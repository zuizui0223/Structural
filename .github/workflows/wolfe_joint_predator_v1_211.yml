name: Wolfe source-controlled retrospective joint-predator analysis v1.211
on:
  push:
    branches:
      - analysis/wolfe-joint-predator-v1-209
    paths:
      - .github/workflows/wolfe_joint_predator_v1_211.yml
permissions:
  contents: read
jobs:
  source-locked-score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run design and provenance tests without biological source
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_wolfe_joint_predator_v1_209.py tests/test_wolfe_joint_predator_v1_210.py tests/test_wolfe_identifier_audit_v1_211.py
      - name: Fetch immutable author source at pinned Git commit
        uses: actions/checkout@v4
        with:
          repository: ExperimentalConservation/Experimental-data
          ref: fabe50b58a13651be4168b91cd91589ccc261a96
          path: build/wolfe_source
          persist-credentials: false
      - name: Score only frozen source and experimental conditions
        run: |
          mkdir -p build/wolfe_v211
          python scripts/run_wolfe_joint_predator_v1_211.py "build/wolfe_source/Wolfe et al. /Wolfe et al experimental data.csv" --out build/wolfe_v211/result.json
      - name: Upload result only; exclude biological rows
        uses: actions/upload-artifact@v4
        with:
          name: wolfe-v211-retrospective-corrected-id-result
          path: build/wolfe_v211/result.json
          retention-days: 21
