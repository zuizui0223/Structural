name: Forest island bridge occupied-source geometry and leakage safety
on:
  push:
    paths:
      - "analysis/forest_macro_global/source_pool_bridge.py"
      - "analysis/forest_macro_global/test_source_pool_bridge.py"
      - ".github/workflows/forest-island-source-bridge-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  training_only_forest_and_ocean_source_context:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify origin-typed forest matrix, heldout-source exclusion and topology residual
        run: python -m pytest -q analysis/forest_macro_global/test_source_pool_bridge.py
      - name: Refuse to label synthetic geometry as new forest ecological evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("analysis/forest_macro_global/source_pool_bridge.py").read_text()
          assert "No empirical forest connectivity effect is claimed" in p
          assert "unobserved_patches_assumed_absent" in p
          assert "source_loss_or_demographic_transition_identified" in p
          print("Known-truth operator/geometry and no-outcome-leakage rules passed; empirical ecology remains unscored")
          PY
