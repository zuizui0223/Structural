name: Forest macro Kortmann2026 canonical 17775805 publisher index ONLY
on:
  push:
    branches:
      - analysis/forest-macro-plot-environment
    paths:
      - ".github/workflows/forest-macro-kortmann2026-17775805-canonical-index-only.yml"
      - "analysis/forest_macro_global/kortmann2026_17775805_canonical_publisher_index_only.py"
      - "docs/FOREST_MACRO_KORTMANN2026_17775805_CANONICAL_SOURCE_INDEX_PREFREEZE_20261120.md"
  pull_request:
    paths:
      - ".github/workflows/forest-macro-kortmann2026-17775805-canonical-index-only.yml"
      - "analysis/forest_macro_global/kortmann2026_17775805_canonical_publisher_index_only.py"
      - "docs/FOREST_MACRO_KORTMANN2026_17775805_CANONICAL_SOURCE_INDEX_PREFREEZE_20261120.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-publisher-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Source-only synthetic data and license drift tests
        run: |
          python3 analysis/forest_macro_global/kortmann2026_17775805_canonical_publisher_index_only.py --test
      - name: Query exact canonical Zenodo 17775805 publisher metadata ONLY
        run: |
          python3 analysis/forest_macro_global/kortmann2026_17775805_canonical_publisher_index_only.py --out kortmann2026_17775805_source_index_only/receipt.json
      - name: 'Fail closed: no forest IDs or source biology'
        run: |
          python3 - <<'PY'
          import json
          a=json.load(open('kortmann2026_17775805_source_index_only/receipt.json',encoding='utf8'))
          assert a['source_species_or_OTU_response_rows_READ']==0
          assert a['biological_data_member_download_count']==0
          assert a['new_ecological_effect'] is False
          assert a['historical_17775804_http302_STOP_unchanged'] is True
          assert a['canonical_target_17775805_diagnosed_before_this_GET'] is True
          assert a['status'].startswith(('SOURCE_CANONICAL_PUBLISHER_STOP_','SOURCE_CANONICAL_INDEX_READY_NO_BIOLOGY'))
          if 'publisher' in a:
              b=a['publisher']
              assert b['independence_from_BETAFOR_not_yet_tested']
              assert b['no_original_file_GET']
              assert b['original_physical_sampling_denominator_NOT_VERIFIED']
              print('ORIGINAL_PUBLISHER_FILES',b['source_file_count'])
              print('ORIGINAL_MANIFEST_SHA',b['original_publisher_manifest_SHA256'])
          print('KORTMANN2026_SOURCE_INDEX_DECISION',a['status'])
          PY
      - name: Upload official metadata file roster only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-macro-kortmann2026-17775805-canonical-index
          path: kortmann2026_17775805_source_index_only/
          if-no-files-found: error
