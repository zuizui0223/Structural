name: GIFT fresh-taxon metadata census

on:
  pull_request:
    branches: [main]
    paths:
      - "research/gift_fresh_taxa/**"
      - ".github/workflows/gift-fresh-taxa-metadata.yml"

permissions:
  contents: read

concurrency:
  group: gift-fresh-taxa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Census untouched taxonomic response surfaces
        run: python research/gift_fresh_taxa/metadata_candidate_census_v0_1.py | tee gift_fresh_taxa_metadata.json
      - name: Assert response stayed sealed
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_fresh_taxa_metadata.json"))
          assert x["angiosperm_response_reused"] is False
          assert x["species_composition_endpoint_called"] is False
          assert len(x["census_fingerprint"]) == 64
          print("FRESH_TAXA_METADATA_ONLY_OK", x["census_fingerprint"])
          for k,v in x["results"].items():
              print(k, v.get("eligible_individual_islands"), v.get("archipelagos_by_minimum_island_count"))
          PY
      - name: Install geometry dependencies
        run: python -m pip install pyshp shapely openpyxl
      - name: Freeze Pteridophyta predictor universe
        run: python research/gift_fresh_taxa/freeze_fresh_taxon_universe_v0_1.py --taxon-name Pteridophyta | tee pteridophyta_universe.json
      - name: Freeze Gymnospermae predictor universe
        run: python research/gift_fresh_taxa/freeze_fresh_taxon_universe_v0_1.py --taxon-name Gymnospermae | tee gymnospermae_universe.json
      - name: Assert fresh universes remain response sealed
        run: |
          python - <<'PY'
          import json
          for path in ("pteridophyta_universe.json","gymnospermae_universe.json"):
              x=json.load(open(path))
              assert x["status"] == "RESPONSE_SEALED_PREDICTOR_UNIVERSE"
              assert x["response_values_accessed"] is False
              assert x["species_composition_endpoint_called"] is False
              assert x["n_final_archipelagos"] >= 8
              assert len(x["universe_fingerprint"]) == 64
              assert x["support_class_counts"].get("extreme_only",0) >= 1
              assert x["support_class_counts"].get("nonextreme_only",0) >= 1
              assert x["support_class_counts"].get("paired",0) >= 1
              print("FRESH_UNIVERSE_OK", x["taxon_name"], x["n_final_archipelagos"], x["n_final_islands"], x["support_class_counts"], x["universe_fingerprint"])
          PY
      - name: Freeze Pteridophyta geology crosswalk
        run: python research/gift_fresh_taxa/freeze_geology_crosswalk_v0_1.py --universe pteridophyta_universe.json > pteridophyta_geology.json
      - name: Freeze Gymnospermae geology crosswalk
        run: python research/gift_fresh_taxa/freeze_geology_crosswalk_v0_1.py --universe gymnospermae_universe.json > gymnospermae_geology.json
      - name: Assert geology crosswalks are response blind
        run: |
          python - <<'PY'
          import json
          for name in ("pteridophyta","gymnospermae"):
              x=json.load(open(f"{name}_geology.json"))
              assert x["status"] == "FROZEN_BEFORE_PILOT_RESPONSE"
              assert x["response_values_accessed"] is False
              assert x["gift_species_composition_accessed"] is False
              assert len(x["crosswalk_fingerprint"]) == 64
              print("FRESH_GEOLOGY_FROZEN", name, x["quantitative_geology_eligible_all"], x["crosswalk_fingerprint"])
          PY
      - name: Freeze fresh-taxon candidate selection
        run: |
          python research/gift_fresh_taxa/freeze_candidate_selection_v0_1.py \
            --census gift_fresh_taxa_metadata.json \
            --pteridophyta-universe pteridophyta_universe.json \
            --gymnospermae-universe gymnospermae_universe.json \
            | tee gift_fresh_taxa_selection.json
      - name: Assert all metadata-qualified taxa are retained
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_fresh_taxa_selection.json"))
          assert x["status"] == "FROZEN_RESPONSE_BLIND_CANDIDATE_SELECTION"
          assert x["species_composition_endpoint_called"] is False
          assert x["angiosperm_pilot_response_used_for_selection"] is False
          assert x["selected_taxa"] == ["Pteridophyta","Gymnospermae"]
          assert x["excluded_taxa"] == ["Bryophyta"]
          assert x["selection_rule"]["all_passing_candidates_retained"] is True
          print("FRESH_TAXA_SELECTION_FROZEN", x["selection_fingerprint"])
          PY
      - name: Freeze both taxon protocols
        run: |
          python research/gift_fresh_taxa/freeze_protocol_v0_1.py --universe pteridophyta_universe.json --selection-receipt gift_fresh_taxa_selection.json --geology-crosswalk pteridophyta_geology.json > pteridophyta_protocol.json
          python research/gift_fresh_taxa/freeze_protocol_v0_1.py --universe gymnospermae_universe.json --selection-receipt gift_fresh_taxa_selection.json --geology-crosswalk gymnospermae_geology.json > gymnospermae_protocol.json
      - name: Assert both protocols are response sealed and disjoint
        run: |
          python - <<'PY'
          import json
          for name in ("pteridophyta","gymnospermae"):
              x=json.load(open(f"{name}_protocol.json"))
              assert x["status"] == "FROZEN_BEFORE_PILOT_RESPONSE"
              assert x["response_values_accessed"] is False
              assert x["pilot_response_opened"] is False
              assert x["confirmatory_response_opened"] is False
              assert x["pilot_selection"]["list_overlap"] == 0
              assert len(x["pilot_selection"]["pilot_archipelagos"]) == 3
              assert x["burned_pilot"]["models_allowed"] is False
              assert x["burned_pilot"]["effect_sizes_allowed"] is False
              assert x["confirmatory_response_authorized"] is False
              assert x["study_family"].startswith("response-blind two-clade")
              assert x["candidate_selection_fingerprint"] == json.load(open("gift_fresh_taxa_selection.json"))["selection_fingerprint"]
              assert len(x["protocol_fingerprint"]) == 64
              print("FRESH_PROTOCOL_FROZEN", name, x["pilot_selection"]["pilot_archipelagos"], x["protocol_fingerprint"])
          PY
      - name: Replay committed pre-response lock
        run: |
          python - <<'PY'
          import json
          lock=json.load(open("research/gift_fresh_taxa/pre_response_lock_v0_1.json"))
          selection=json.load(open("gift_fresh_taxa_selection.json"))
          assert lock["status"] == "FROZEN_PRE_RESPONSE_NO_SPECIES_COMPOSITION_OPENED"
          assert lock["response_values_accessed"] is False
          assert lock["angiosperm_pilot_response_reused"] is False
          assert lock["candidate_selection_fingerprint"] == selection["selection_fingerprint"]
          for key,name in (("Pteridophyta","pteridophyta"),("Gymnospermae","gymnospermae")):
              u=json.load(open(f"{name}_universe.json"))
              g=json.load(open(f"{name}_geology.json"))
              p=json.load(open(f"{name}_protocol.json"))
              exp=lock["systems"][key]
              assert exp["universe_fingerprint"] == u["universe_fingerprint"]
              assert exp["geology_crosswalk_fingerprint"] == g["crosswalk_fingerprint"]
              assert exp["protocol_fingerprint"] == p["protocol_fingerprint"]
              assert exp["pilot_archipelagos"] == p["pilot_selection"]["pilot_archipelagos"]
              assert exp["n_archipelagos"] == u["n_final_archipelagos"]
              assert exp["n_islands"] == u["n_final_islands"]
              assert exp["support_class_counts"] == u["support_class_counts"]
          assert lock["boundary"]["pilot_response_authorized_by_this_file"] is False
          assert lock["boundary"]["confirmatory_response_authorized"] is False
          print("PRE_RESPONSE_LOCK_REPLAY_OK", lock["pre_response_green_commit"])
          PY
      - name: Replay Pteridophyta terminal STOP
        run: |
          python research/gift_fresh_taxa/validate_terminal_receipt_v0_1.py \
            --terminal research/gift_fresh_taxa/pteridophyta_terminal_receipt_v0_1.json \
            --universe pteridophyta_universe.json \
            --protocol pteridophyta_protocol.json \
            --lock research/gift_fresh_taxa/pre_response_lock_v0_1.json \
            | tee pteridophyta_terminal_validation.json
      - name: Replay Gymnospermae terminal STOP
        run: |
          python research/gift_fresh_taxa/validate_terminal_receipt_v0_1.py \
            --terminal research/gift_fresh_taxa/gymnospermae_terminal_receipt_v0_1.json \
            --universe gymnospermae_universe.json \
            --protocol gymnospermae_protocol.json \
            --lock research/gift_fresh_taxa/pre_response_lock_v0_1.json \
            | tee gymnospermae_terminal_validation.json
      - name: Assert both fresh systems remain closed
        run: |
          python - <<'PY'
          import json
          for name in ("pteridophyta","gymnospermae"):
              x=json.load(open(f"{name}_terminal_validation.json"))
              assert x["status"] == "TERMINAL_STOP_REPLAY_VALID"
              assert x["pilot_response_reopened"] is False
              assert x["confirmatory_response_opened"] is False
              assert x["confirmatory_response_authorized"] is False
              assert x["effect_size"] is None
              assert x["prediction_score"] is None
              print("FRESH_TERMINAL_STOP_VALID", x["taxon_name"], x["terminal_receipt_sha256"])
          PY
      - name: Assert CI contains no fresh response reopening path
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow=Path(".github/workflows/gift-fresh-taxa-metadata.yml").read_text()
          assert "run_burned_pilot_v0_1.py" not in workflow
          assert "query=checklists" not in workflow
          print("NO_FRESH_RESPONSE_REOPEN_PATH_IN_CI")
          PY
