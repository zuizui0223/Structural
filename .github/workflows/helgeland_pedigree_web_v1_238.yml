name: Helgeland Dryad same-bytes web portal source v1.238
on:
  push:
    branches: [science/helgeland-archipelago-source-intake-v1-230]
    paths:
      - scripts/helgeland_pedigree_web_headers_v1_238.py
      - tests/test_helgeland_pedigree_web_headers_v1_238.py
      - development/helgeland_pedigree_web_contract_v1_238.json
      - .github/workflows/helgeland_pedigree_web_v1_238.yml
permissions:
  contents: read
jobs:
  web-same-bytes-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_helgeland_pedigree_web_headers_v1_238.py
      - name: Public Dryad portal transport strict five-file SHA256 validation
        run: |
          python scripts/helgeland_pedigree_web_headers_v1_238.py development/helgeland_pedigree_web_contract_v1_238.json --out build/v238/source_receipt.json
          python - <<'PY'
          import json
          d=json.load(open("build/v238/source_receipt.json"))
          assert d["source_version_id"]==354268
          assert d["raw_record_rows_interpreted"]==0
          assert d["status"] in ("PASS_SAME_VERSION_FIVE_PUBLIC_FILES_SHA256_HEADERS_ONLY","STOP_PUBLIC_SOURCE_TRANSPORT_NOT_VERIFIED")
          assert d["GEB_scientific_HOLD"]
          print("Published source web transport:",d["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v238-helgeland-pedigree-portal
          path: build/v238/source_receipt.json
          retention-days: 21
