name: Galapagos ant original 2026 independent field schema ONLY v1.338
on:
  push:
    paths:
      - ".github/workflows/galapagos-ant-source-meta-v1_338.yml"
      - "development/galapagos_ant_native_altered_source_contract_v1_338.json"
      - "scripts/galapagos_ant_original_meta_v1_338.py"
      - "tests/test_galapagos_ant_original_meta_v1_338.py"
  pull_request:
    paths:
      - ".github/workflows/galapagos-ant-source-meta-v1_338.yml"
      - "development/galapagos_ant_native_altered_source_contract_v1_338.json"
      - "scripts/galapagos_ant_original_meta_v1_338.py"
      - "tests/test_galapagos_ant_original_meta_v1_338.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-before-original-ant-site-or-taxon-values:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Check exact Event site/habitat/elevation and Occurrence origin source roles without biology
        run: python -m pytest -q tests/test_galapagos_ant_original_meta_v1_338.py
      - name: Read original 2026 Galapagos ant Pensoft source central directory/meta.xml ONLY
        run: |
          python scripts/galapagos_ant_original_meta_v1_338.py \
            --contract development/galapagos_ant_native_altered_source_contract_v1_338.json \
            --out galapagos_ant_original_meta_v1_338.json
      - name: Original locality and ant source taxonomic values still closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("galapagos_ant_original_meta_v1_338.json").read_text())
          assert d["status"] in (
            "GALAPAGOS_ANT_SITE_HABITAT_ELEVATION_AND_ORIGIN_SCHEMA_PRESENT_RESPONSES_SEALED",
            "TERMINAL_SOURCE_MISSING_ANT_HABITAT_ORIGIN_FIELD",
            "TERMINAL_NOT_SINGLE_EVENT_CORE_AND_OCCURRENCE_EXTENSION")
          assert d["original_Event_rows_opened"]==0 and d["original_Occurrence_rows_opened"]==0
          assert d["GEB_scientific_HOLD"] and d["new_confirmatory_systems"]==0 and not d["eBird_used"]
          print("Exact Galapagos source ZIP identity and ecological schema status:",d["status"])
          PY
      - name: Store only source original schema and archive SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galapagos-ant-original-2026-source-schema-only-v1-338
          path: galapagos_ant_original_meta_v1_338.json
          if-no-files-found: warn
