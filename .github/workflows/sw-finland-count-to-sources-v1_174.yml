name: SW Finland v1.173 counts to exact sources v1.174

on:
  push:
    branches:
      - main
    paths:
      - development/sw_finland_count_to_sources_request_v1_174.json

permissions:
  contents: write

jobs:
  exact-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bind exact v1.173 count authority before archive access
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          c=json.loads(Path("development/sw_finland_count_to_sources_contract_v1_174.json").read_text())
          r=json.loads(Path("development/sw_finland_count_to_sources_request_v1_174.json").read_text())
          assert r["schema"]==c["execution_request"]["schema"]
          assert r["status"]==c["execution_request"]["status"]
          assert r["future_outcome_access_requested"] is False
          assert r["effect_estimate_requested"] is False
          assert r["one_shot"] is True
          assert r["eBird_used"] is False
          paths={
            "v1_173_receipt":"development/sw_finland_historical_source_count_calibration_v1_173.json",
            "v1_173_count_table":"development/sw_finland_historical_source_count_recovery_v1_173.csv",
          }
          for key,path in paths.items():
              p=Path(path);assert p.exists()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==r["input_sha256"][key],key
          rec=json.loads(Path(paths["v1_173_receipt"]).read_text())
          assert rec["status"]==c["required_v1_173"]["required_status"]
          assert rec["future_outcome_values_opened"]==0
          assert rec["supplement_future_summary_values_used"]==0
          assert rec["impossible_species"]==0
          assert rec["exact_source_species"]>=30
          PY

      - name: Download exact archive bytes
        run: |
          set -euo pipefail
          mkdir -p build/swf_v174/raw build/swf_v174/safe build/swf_v174/out
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          url="https://zenodo.org/records/4942881/files/colonization_select.csv?download=1"
          out=Path("build/swf_v174/raw/colonization_select.csv")
          md5=hashlib.md5();sha=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Structural-v1.174"}),timeout=180) as src,out.open("wb") as dst:
            while True:
              b=src.read(1024*1024)
              if not b:break
              dst.write(b);md5.update(b);sha.update(b)
          if md5.hexdigest()!="ff648878946ba430fb86c4ab2aa02baa" or sha.hexdigest()!="72b631033ef36210ee19b151dc4f6569760262d68f70b9ce6de6c8a11afeb957":
              out.unlink(missing_ok=True);raise SystemExit("archive identity mismatch")
          PY

      - name: Route t0 state with outcome opaque
        run: |
          python scripts/route_sw_finland_t0_columns_v1_169.py             build/swf_v174/raw/colonization_select.csv             --safe-output build/swf_v174/safe/t0_safe.csv             --receipt build/swf_v174/out/router.json

      - name: Reconstruct exact historical sources from frozen v1.173 counts
        run: |
          python scripts/promote_sw_finland_counts_to_sources_v1_174.py             build/swf_v174/safe/t0_safe.csv             development/sw_finland_historical_source_count_recovery_v1_173.csv             --router-receipt build/swf_v174/out/router.json             --count-receipt development/sw_finland_historical_source_count_calibration_v1_173.json             --species-output build/swf_v174/out/species.csv             --membership-output build/swf_v174/out/membership.csv             --geometry-output build/swf_v174/out/geometry.csv             --receipt build/swf_v174/out/receipt.json

      - name: Delete raw archive and row-level safe projection
        if: always()
        run: rm -rf build/swf_v174/raw build/swf_v174/safe

      - name: Verify t0-only exact-source freeze and commit canonical v1.171 paths
        run: |
          set -euo pipefail
          test ! -e build/swf_v174/raw
          test ! -e build/swf_v174/safe
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/swf_v174/out/receipt.json").read_text())
          assert r["status"]=="T0_EXACT_SOURCE_IDENTITIES_FROZEN_FUTURE_OUTCOME_SEALED"
          assert r["exact_source_species"]>=30
          assert r["impossible_species"]==0
          assert r["exact_source_species"]==r["v1_173_exact_source_species"]
          assert r["future_outcome_values_opened"]==0
          assert r["protected_outcome_values_decoded"]==0
          assert r["supplement_future_summary_values_used"]==0
          assert r["pilot_future_outcome_authorized"] is False
          assert r["confirmatory_future_outcome_authorized"] is False
          PY
          cp build/swf_v174/out/species.csv development/sw_finland_exact_source_species_v1_171.csv
          cp build/swf_v174/out/membership.csv development/sw_finland_exact_source_membership_v1_171.csv
          cp build/swf_v174/out/geometry.csv development/sw_finland_t0_island_geometry_v1_171.csv
          cp build/swf_v174/out/receipt.json development/sw_finland_exact_source_reconstruction_v1_171.json
          git add development/sw_finland_exact_source_species_v1_171.csv development/sw_finland_exact_source_membership_v1_171.csv development/sw_finland_t0_island_geometry_v1_171.csv development/sw_finland_exact_source_reconstruction_v1_171.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze SW Finland exact historical source identities from v1.173 counts v1.174"
          git push origin HEAD:main
