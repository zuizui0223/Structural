name: SW Finland anchor inversion v1.170.1 t0 dry run

on:
  push:
    branches:
      - candidate/sw-finland-anchor-inversion-v1-170-1
    paths:
      - .github/workflows/sw-finland-anchor-inversion-dryrun-v1_170_1.yml
      - development/sw_finland_anchor_inversion_contract_v1_170_1.json
      - scripts/invert_sw_finland_historical_source_counts_v1_170_1.py

permissions:
  contents: read

jobs:
  t0-dry-run:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download exact frozen archive
        run: |
          mkdir -p build/swf1701dry/raw build/swf1701dry/safe build/swf1701dry/out
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          url="https://zenodo.org/records/4942881/files/colonization_select.csv?download=1"
          md5e="ff648878946ba430fb86c4ab2aa02baa"
          shaE="72b631033ef36210ee19b151dc4f6569760262d68f70b9ce6de6c8a11afeb957"
          p=Path("build/swf1701dry/raw/colonization_select.csv");m=hashlib.md5();s=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Structural-v1.170.1-dry"}),timeout=240) as src,p.open("wb") as out:
            while True:
              b=src.read(1024*1024)
              if not b:break
              out.write(b);m.update(b);s.update(b)
          assert m.hexdigest()==md5e and s.hexdigest()==shaE
          PY
      - name: Route t0 with future endpoint opaque
        run: |
          python scripts/route_sw_finland_t0_columns_v1_169.py             build/swf1701dry/raw/colonization_select.csv             --safe-output build/swf1701dry/safe/t0_safe.csv             --receipt build/swf1701dry/out/router.json
      - name: Run frozen anchor inversion gate
        id: invert
        run: |
          set +e
          python scripts/invert_sw_finland_historical_source_counts_v1_170_1.py             build/swf1701dry/safe/t0_safe.csv             --router-receipt build/swf1701dry/out/router.json             --species-output build/swf1701dry/out/species.csv             --membership-output build/swf1701dry/out/membership.csv             --geometry-output build/swf1701dry/out/geometry.csv             --receipt build/swf1701dry/out/receipt.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Delete raw and row-level safe data
        if: always()
        run: rm -rf build/swf1701dry/raw build/swf1701dry/safe
      - name: Assert future endpoint remained sealed
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/swf1701dry/out/router.json").read_text())
          assert r["outcome_values_read"]==0
          assert r["protected_field_values_decoded"]==0
          assert r["protected_field_bytes_persisted"]==0
          x=json.loads(Path("build/swf1701dry/out/receipt.json").read_text())
          assert x["future_outcome_values_opened"]==0
          assert x["protected_outcome_values_decoded"]==0
          assert x["future_summary_values_used"]==0
          PY
      - name: Upload aggregate t0 result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-finland-anchor-inversion-dry-v1701-${{ github.sha }}
          path: |
            build/swf1701dry/out/receipt.json
            build/swf1701dry/out/router.json
          retention-days: 7
      - name: Fail if frozen inversion gate failed
        if: always()
        env:
          EXIT_CODE: ${{ steps.invert.outputs.exit_code }}
        run: test "$EXIT_CODE" = "0"
