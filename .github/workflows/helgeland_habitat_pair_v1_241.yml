name: Helgeland historical habitat-controlled pair routing v1.241
on:
  push:
    branches: [science/helgeland-archipelago-source-intake-v1-230]
    paths:
      - scripts/helgeland_habitat_pair_portability_v1_241.py
      - tests/test_helgeland_habitat_pair_portability_v1_241.py
      - development/helgeland_habitat_adjusted_directional_contract_v1_241.json
      - development/helgeland_natal_resight_result_freeze_v1_231.json
      - .github/workflows/helgeland_habitat_pair_v1_241.yml
permissions:
  contents: read
jobs:
  frozen-postpublication-habitat-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate historical-only fitting and source habitat known truth
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_helgeland_habitat_pair_portability_v1_241.py
      - name: Test later migrant destination against habitat-class conditional reference
        run: |
          python scripts/helgeland_habitat_pair_portability_v1_241.py development/helgeland_natal_resight_result_freeze_v1_231.json --out build/v241/result.json
          python - <<'PY'
          import json
          r=json.load(open("build/v241/result.json"))
          assert r["testing_later_n"]==173
          assert r["training_historical_n"]==259
          assert r["excluded_bridge_n"]==28
          assert set(r["all_precommitted_tau_results"])=={"5","10","20"}
          assert r["reference_excludes_geographical_distance_and_timevarying_observation_effort"]
          assert r["GEB_scientific_HOLD"]
          print("Retrospective known habitat-category stronger-reference comparison:",r["primary_R2_minus_H"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v241-helgeland-habitat-conditioned-pair
          path: build/v241/result.json
          retention-days: 21
