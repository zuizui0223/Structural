name: Azores trail biological score synthetic dry-run v1.295 NO source access
on:
  push:
    paths:
      - ".github/workflows/azores-trail-native-alien-synthetic-v1_295.yml"
      - "development/azores_trail_native_alien_response_contract_v1_295.json"
      - "scripts/azores_trail_native_alien_v1_295.py"
      - "tests/test_azores_trail_native_alien_v1_295.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-original-plant-file-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify original-source-free synthetic score and all terminal gates
        run: python -m pytest -q tests/test_azores_trail_native_alien_v1_295.py
      - name: Report that no original biology was opened
        run: |
          echo "Source-free ONLY: original v1.4 Occurrence values remain unopened. No effect or species scores."
