name: Fox 2017 published experimental source metadata v1.247
on:
  push:
    branches: [science/source-loss-synchrony-sign-gate-v1-246]
    paths:
      - scripts/fox2017_hydra_source_readiness_v1_247.py
      - tests/test_fox2017_hydra_source_readiness_v1_247.py
      - development/fox2017_hydra_source_contract_v1_247.json
      - .github/workflows/fox2017_hydra_source_readiness_v1_247.yml
permissions:
  contents: read
jobs:
  method-metadata-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic Dryad metadata and source file identity guards
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_fox2017_hydra_source_readiness_v1_247.py
      - name: Original Fox Dryad metadata and README only
        run: |
          python scripts/fox2017_hydra_source_readiness_v1_247.py --out build/v247/source_receipt.json
          python - <<'PY'
          import json
          r=json.load(open("build/v247/source_receipt.json"))
          assert r["DOI"]=="10.5061/dryad.2rs23"
          assert r["biological_CSV_downloaded_or_read"] is False
          assert r["measured_source_delivery_or_off_event_identified"] is False
          assert r["GEB_scientific_HOLD"]
          print("Fox 2017 publisher-method gate:",r["status"],r.get("readme",{}).get("status"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v247-Fox-original-hydra-source-readiness
          path: build/v247/source_receipt.json
          retention-days: 21
