name: Global mammals opaque response transport v1.17

on:
  push:
    branches:
      - main
    paths:
      - development/global_mammals_opaque_transport_request_v1_17.json

permissions:
  contents: read

jobs:
  one-shot-opaque-transport:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout frozen Structural code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate one-shot exact-byte request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          req = json.loads(
              Path(
                  "development/global_mammals_opaque_transport_request_v1_17.json"
              ).read_text(encoding="utf-8")
          )
          assert req["schema"] == (
              "structural.global_mammals_opaque_transport_request.v1_17"
          )
          assert req["status"] == (
              "REQUEST_ONE_CREDENTIALED_EXACT_OPAQUE_TRANSPORT"
          )
          assert req["candidate_id"] == (
              "global_island_native_mammals_barreto_2024"
          )
          assert req["dryad_file_id"] == 3242161
          assert req["expected_size_bytes"] == 60486843
          assert req["expected_sha256"] == (
              "32bf3f077af7e66ddcbf05fc675d6c51656f59111c27cd37129e14c658430fa6"
          )
          assert req["credentialed_attempt_limit"] == 1
          assert req["blind_endpoint_retry_authorized"] is False
          assert req["alternate_file_id_retry_authorized"] is False
          assert req["header_access_authorized"] is False
          assert req["routing_id_access_authorized"] is False
          assert req["species_header_access_authorized"] is False
          assert req["occurrence_value_access_authorized"] is False
          assert req["semantic_crosswalk_authorized_in_same_revision"] is False
          assert req["raw_response_artifact_authorized"] is False
          assert req["one_shot"] is True
          PY

      - name: Prepare short-lived Dryad bearer token
        env:
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
          DRYAD_TOKEN_FALLBACK: ${{ secrets.DRYAD_TOKEN }}
        run: |
          mkdir -p build/global_mammals_v117
          python scripts/prepare_dryad_token_v0_73.py \
            --github-env "$GITHUB_ENV" \
            --receipt build/global_mammals_v117/token_receipt.json

      - name: Transport exact response bytes as opaque stream
        run: |
          mkdir -p build/global_mammals_v117/raw
          python scripts/fetch_global_mammal_response_opaque_v1_17.py \
            build/global_mammals_v117/raw/Appendix_1_presence_absence.csv \
            --receipt build/global_mammals_v117/transport_receipt.json

      - name: Delete raw response bytes before artifact handling
        if: always()
        run: |
          rm -rf build/global_mammals_v117/raw

      - name: Verify JSON-only artifact surface
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/global_mammals_v117")
          observed = {p.name for p in root.iterdir() if p.is_file()}
          expected = {"token_receipt.json", "transport_receipt.json"}
          if observed != expected:
              raise SystemExit(
                  f"unexpected v1.17 artifact surface: {sorted(observed)}"
              )
          if any(root.rglob("*.csv")):
              raise SystemExit("raw mammal response CSV reached artifact surface")

          receipt = json.loads(
              (root / "transport_receipt.json").read_text(encoding="utf-8")
          )
          assert receipt["status"] == (
              "EXACT_RESPONSE_BYTES_VERIFIED_SEMANTICS_UNOPENED"
          )
          assert receipt["target"]["dryad_file_id"] == 3242161
          assert receipt["target"]["size_bytes"] == 60486843
          assert receipt["target"]["sha256"] == (
              "32bf3f077af7e66ddcbf05fc675d6c51656f59111c27cd37129e14c658430fa6"
          )
          assert receipt["header_decoded"] is False
          assert receipt["routing_ids_decoded"] == 0
          assert receipt["species_header_fields_decoded"] == 0
          assert receipt["occurrence_values_decoded"] == 0
          assert receipt["biological_response_values_opened"] is False
          assert receipt["semantic_crosswalk_authorized_in_same_revision"] is False
          assert receipt["raw_response_artifact_authorized"] is False
          assert receipt["fresh_system_denominator_contribution"] == 0
          PY

      - name: Upload transport receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-mammals-v117-opaque-transport-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/global_mammals_v117/token_receipt.json
            build/global_mammals_v117/transport_receipt.json
          if-no-files-found: warn
          retention-days: 30
