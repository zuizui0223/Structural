name: BALA seven-island original long-term community schema only v1.310
on:
  push:
    paths:
      - ".github/workflows/bala-original-metadata-v1_310.yml"
      - "development/bala_longitudinal_original_source_protocol_v1_310.json"
      - "scripts/bala_original_metadata_only_v1_310.py"
      - "tests/test_bala_original_metadata_only_v1_310.py"
  pull_request:
    paths:
      - ".github/workflows/bala-original-metadata-v1_310.yml"
      - "development/bala_longitudinal_original_source_protocol_v1_310.json"
      - "scripts/bala_original_metadata_only_v1_310.py"
      - "tests/test_bala_original_metadata_only_v1_310.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install synthetic test runner
        run: python -m pip install pytest
      - name: Validate original sampling Event and guild/taxon metadata firewall
        run: python -m pytest -q tests/test_bala_original_metadata_only_v1_310.py
      - name: Read only official BALA 1.0 original archive directory and meta.xml
        run: |
          python scripts/bala_original_metadata_only_v1_310.py \
            --protocol development/bala_longitudinal_original_source_protocol_v1_310.json \
            --out bala_original_metadata_receipt_v1_310.json
      - name: Confirm original long-term Event and species data still sealed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("bala_original_metadata_receipt_v1_310.json").read_text())
          assert r["status"] in ("META_ELIGIBLE_EVENT_VALUES_STILL_CLOSED",
            "META_HOLD_MISSING_TEMPORAL_OR_GUILD_ROLE")
          assert r["source_Event_rows_opened"]==0 and r["source_Occurrence_rows_opened"]==0
          assert r["GEB_scientific_HOLD"] and r["confirmatory_systems_admitted"]==0
          assert not r["eBird_used"]
          print("ORIGINAL 2024 BALA SOURCE META ONLY:",r["status"])
          PY
      - name: Keep only original source role schema receipt and exact ZIP SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bala-seven-island-original-schema-v1-310
          path: bala_original_metadata_receipt_v1_310.json
          if-no-files-found: warn
