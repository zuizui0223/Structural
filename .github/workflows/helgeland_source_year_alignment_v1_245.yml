name: Helgeland annual source-year alignment exhaustive audit v1.245
on:
  push:
    branches: [science/helgeland-archipelago-source-intake-v1-230]
    paths:
      - scripts/helgeland_source_year_alignment_v1_245.py
      - tests/test_helgeland_source_year_alignment_v1_245.py
      - development/helgeland_source_year_alignment_contract_v1_245.json
      - .github/workflows/helgeland_source_year_alignment_v1_245.yml
permissions:
  contents: read
jobs:
  exhaustive-year-shuffles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_helgeland_source_year_alignment_v1_245.py
      - uses: actions/checkout@v4
        with:
          repository: torhanssonfrank/DensityRegulationHouseSparrows
          ref: a4e1c9ebc1148d7c7aca2bb5730b9d7104094fe5
          path: build/author
          persist-credentials: false
      - name: Exhaustive alignment of already published seven source-year and target-year states
        run: |
          python scripts/helgeland_source_year_alignment_v1_245.py build/author development/helgeland_natal_resight_result_freeze_v1_231.json --out build/v245/result.json
          python - <<'PY'
          import json
          d=json.load(open("build/v245/result.json"))
          assert len(d["all_four_predeclared_routes"])==4
          assert all(r["all_5040_year_alignment_assignments"]["assignments"]==5040 for r in d["all_four_predeclared_routes"].values())
          assert all(len(r["all_single_and_double_year_omissions"])==28 for r in d["all_four_predeclared_routes"].values())
          assert all(len(r["all_11_source_annual_volume_ablations"])==11 for r in d["all_four_predeclared_routes"].values())
          assert d["GEB_scientific_HOLD"]
          print("v1.245 exhaustive source-year alignment complete:",d["primary_route_R2_observed_percentile_among_all_5040_assignments"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v245-helgeland-source-year-alignment
          path: build/v245/result.json
          retention-days: 21
