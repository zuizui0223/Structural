name: Zhoushan regional original heldout island footprint v1.233
on:
  push:
    branches: [science/marine-mammal-field-intake-v1-224]
    paths:
      - development/zhoushan_heldout_region_geography_contract_v1_233.json
permissions:
  contents: read
  actions: read
jobs:
  original-heldout-geography-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate original frozen geographic test contract
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_zhoushan_heldout_bbox_v1_233.py
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v123-appendix2-safe-ea565b98419f8aacde9fb13c26724bb385635b95-36524988694
          path: build/v233/source
          repository: zuizui0223/Structural
          run-id: 36524988694
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v143-reference-fe0e65be12a223fb3f0991afae959cd62ef3aabb-36622553042
          path: build/v233/selected
          repository: zuizui0223/Structural
          run-id: 36622553042
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v152-pilot-routing-f5ae81b05aac3ce4c5db6f43ce41e89c1d14548c-36625810600
          path: build/v233/routing
          repository: zuizui0223/Structural
          run-id: 36625810600
          github-token: ${{ github.token }}
      - name: Count frozen original heldout island centroids inside published Zhoushan rectangle
        run: |
          python scripts/zhoushan_original_heldout_bbox_v1_233.py build/v233/source/appendix2_safe_rows.csv build/v233/selected/state_reference.csv build/v233/routing/confirmatory_ids.csv --out build/v233/out/geographic_eligibility.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v233-Zhoushan-heldout-rectangle-response-free
          path: build/v233/out/geographic_eligibility.json
          retention-days: 21
