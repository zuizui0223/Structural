name: Global mammals isolation-empty-support audit v1.87

on:
  push:
    branches: [main]
    paths:
      - development/global_mammals_isolation_empty_support_audit_request_v1_87.json

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate frozen-output-only request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("development/global_mammals_isolation_empty_support_audit_request_v1_87.json").read_text())
          c=json.loads(Path("development/global_mammals_isolation_empty_support_audit_contract_v1_87.json").read_text())
          assert r["status"]=="REQUEST_FROZEN_BLOCK_ISOLATION_EMPTY_SUPPORT_AUDIT"
          assert r["diagnostics_artifact_id"]==11130602935
          assert r["prediction_behavior_artifact_id"]==11139081593
          assert r["expected_blocks"]==168
          assert r["new_response_access_authorized"] is False
          assert r["confirmatory_status_change_authorized"] is False
          assert r["one_shot"] is True
          assert c["anti_fishing"][0].startswith("only Current_isolation")
          assert c["counts_as_confirmatory_evidence"] is False
          PY

      - name: Download exact frozen geographic diagnostics
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v177-diagnostics-3778a2c53e76ec83a871b1415ba2e27eb1affb98-36787772910
          path: build/global_mammals_v187/context
          repository: zuizui0223/Structural
          run-id: 36787772910
          github-token: ${{ github.token }}

      - name: Download exact frozen prediction-behavior diagnostics
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v184-prediction-behavior-08b046de1a63eba861bf5ab31802e8743d8da085-36808403888
          path: build/global_mammals_v187/behavior
          repository: zuizui0223/Structural
          run-id: 36808403888
          github-token: ${{ github.token }}

      - name: Verify exact frozen inputs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          checks={
            "build/global_mammals_v187/context/block_context.csv":"36f452c2db01f55d6bd43951fb2f744c98772484f033330153e26b5da6d82195",
            "build/global_mammals_v187/behavior/block_prediction_behavior.csv":"8abce72e8ce349e536a1bd7287508a24975ba0eb5f4a50db39b67d1c8a34d50e",
          }
          for p,s in checks.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              assert got==s,(p,got,s)
          PY

      - name: Audit isolation versus graph-empty redundancy
        run: |
          mkdir -p build/global_mammals_v187/output
          python scripts/audit_global_mammals_isolation_empty_support_v1_87.py             build/global_mammals_v187/context/block_context.csv             build/global_mammals_v187/behavior/block_prediction_behavior.csv             --output build/global_mammals_v187/output/isolation_empty_support_result.json

      - name: Enforce post-hoc nonrescuing ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/global_mammals_v187/output/isolation_empty_support_result.json").read_text())
          assert x["status"]=="POSTHOC_ISOLATION_EMPTY_SUPPORT_AUDIT_COMPLETE"
          assert x["blocks"]==168
          assert x["bioregions"]==12
          assert x["posthoc"] is True
          assert x["causal_mediation_claimed"] is False
          assert x["may_change_primary_status"] is False
          assert x["counts_as_confirmatory_evidence"] is False
          assert x["new_response_accessed"] is False
          PY

      - name: Upload frozen-output audit
        uses: actions/upload-artifact@v4
        with:
          name: global-mammals-v187-isolation-empty-${{ github.sha }}-${{ github.run_id }}
          path: build/global_mammals_v187/output/isolation_empty_support_result.json
          if-no-files-found: error
          retention-days: 30
