name: Global mammals ultrarare heldout scoring v1.118

on:
  push:
    branches: [main]
    paths:
      - development/global_mammals_ultrarare_execution_request_v1_118.json

permissions:
  contents: read
  actions: read

jobs:
  execute:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact numerics
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3

      - name: Validate irreversible authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("development/global_mammals_ultrarare_execution_request_v1_118.json").read_text())
          f=json.loads(Path("development/global_mammals_ultrarare_preconfirm_freeze_v1_117.json").read_text())
          c=json.loads(Path("development/global_mammals_ultrarare_scoring_contract_v1_115.json").read_text())
          assert r["status"]=="AUTHORIZE_ONE_SHOT_ULTRARARE_HELDOUT_SCORING"
          assert r["actual_preconfirm_artifact_id"]==11284534666
          assert r["null_artifact_id"]==11285972572
          assert r["heldout_species"]==529
          assert r["heldout_islands"]==4126
          assert r["expected_target_cells"]==2182654
          assert r["decode_only_ultrarare_species"] is True
          assert r["heldout_response_authorized"] is True
          assert r["rerun_after_first_decode"] is False
          assert r["one_shot"] is True
          assert f["status"]=="SUCCESSFUL_ULTRARARE_ACTUAL_AND_MATCHED_NULL_PREDICTIONS_FROZEN"
          assert f["response_boundary"]["ultrarare_heldout_response_opened"] is False
          assert c["heldout_response_authorized_now"] is False
          PY

      - name: Download corrected physical schema
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v169-corrected-schema-c1ba487b5df7c9558048f69a2747243d59edd58c-36743248729
          path: build/global_mammals_v118/schema
          repository: zuizui0223/Structural
          run-id: 36743248729
          github-token: ${{ github.token }}

      - name: Download ultrarare pilot snapshot
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v112-ultrarare-pilot-03c170e50de4bd21f3c9148b36905e20aecc51d6-37153960728
          path: build/global_mammals_v118/pilot
          repository: zuizui0223/Structural
          run-id: 37153960728
          github-token: ${{ github.token }}

      - name: Download exact routing
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v152-pilot-routing-f5ae81b05aac3ce4c5db6f43ce41e89c1d14548c-36625810600
          path: build/global_mammals_v118/routing
          repository: zuizui0223/Structural
          run-id: 36625810600
          github-token: ${{ github.token }}

      - name: Download frozen actual R3/C surface
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v113-ultrarare-preconfirm-dc558569303879c858c5588ba158a414dc3fda3d-37154791882
          path: build/global_mammals_v118/actual
          repository: zuizui0223/Structural
          run-id: 37154791882
          github-token: ${{ github.token }}

      - name: Download frozen matched-null surface
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v114-ultrarare-topology-null-3336335ee61a284dfb77e321d7ea2525e5994d7f-37155793003
          path: build/global_mammals_v118/null
          repository: zuizui0223/Structural
          run-id: 37155793003
          github-token: ${{ github.token }}

      - name: Verify exact frozen identities
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          checks={
            "build/global_mammals_v118/schema/corrected_species_manifest.csv":"882af8216d94dcb18fdafe8f9b3d363cadc2e7afbc1c227ba65d29848dea63d6",
            "build/global_mammals_v118/pilot/ultrarare_species_universe.csv":"4f801eac218edb00f319cd04416af3c6e7d7a90e04b68868eeed47f4d403dfd9",
            "build/global_mammals_v118/actual/ultrarare_predictions.f64le":"3307a2e058f5f8223eaf0c2d69241acd938e96b93cb02643b1b7d63b425fae04",
            "build/global_mammals_v118/actual/ultrarare_entity_order.csv":"afda05287599110c7248c5cb0c1931689a2aee40f8ff4ff5b76509aff5350715",
            "build/global_mammals_v118/actual/ultrarare_graph_empty.u8":"e992497666d388d451a328ffaa41df53b0511af04b54719fa8ed74c7e9b7a4ae",
            "build/global_mammals_v118/actual/ultrarare_block_context.csv":"314aba152580ff84c933d0a1c8f7675327d381052f458aa997ff9d70d50ab7ba",
            "build/global_mammals_v118/null/ultrarare_rewired_predictions.f64le":"300f0001d250dde01bc0240be3d20898399300fcac5f405e76bfd0f8524495c3",
          }
          for p,s in checks.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              assert got==s,(p,got,s)
          PY

      - name: Prepare exact Dryad token
        env:
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
          DRYAD_TOKEN_FALLBACK: ${{ secrets.DRYAD_TOKEN }}
        run: |
          mkdir -p build/global_mammals_v118/result
          python scripts/prepare_dryad_token_v0_73.py             --github-env "$GITHUB_ENV"             --receipt build/global_mammals_v118/result/token_receipt.json

      - name: Consume exactly the 529 ultrarare heldout species once
        run: |
          python scripts/run_global_mammals_ultrarare_response_v1_115.py             --corrected-manifest build/global_mammals_v118/schema/corrected_species_manifest.csv             --universe build/global_mammals_v118/pilot/ultrarare_species_universe.csv             --pilot-routing build/global_mammals_v118/routing/pilot_ids.csv             --heldout-routing build/global_mammals_v118/routing/confirmatory_ids.csv             --matrix build/global_mammals_v118/result/ultrarare_heldout_matrix.csv             --receipt build/global_mammals_v118/result/ultrarare_response_receipt.json

      - name: Score frozen ultrarare hypotheses immediately
        run: |
          python scripts/score_global_mammals_ultrarare_v1_115.py             build/global_mammals_v118/actual/ultrarare_predictions.f64le             build/global_mammals_v118/null/ultrarare_rewired_predictions.f64le             build/global_mammals_v118/actual/ultrarare_entity_order.csv             build/global_mammals_v118/actual/ultrarare_graph_empty.u8             build/global_mammals_v118/actual/ultrarare_block_context.csv             build/global_mammals_v118/actual/ultrarare_preconfirm_receipt.json             build/global_mammals_v118/null/ultrarare_topology_null_receipt.json             build/global_mammals_v118/pilot/ultrarare_species_universe.csv             build/global_mammals_v118/result/ultrarare_heldout_matrix.csv             build/global_mammals_v118/result/ultrarare_response_receipt.json             --block-output build/global_mammals_v118/result/ultrarare_block_scores.csv             --null-output build/global_mammals_v118/result/ultrarare_null_scores.csv             --result build/global_mammals_v118/result/ultrarare_result.json

      - name: Enforce terminal one-shot semantics
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("build/global_mammals_v118/result/ultrarare_response_receipt.json").read_text())
          r=json.loads(Path("build/global_mammals_v118/result/ultrarare_result.json").read_text())
          assert q["status"]=="ULTRARARE_HELDOUT_RESPONSE_CONSUMED_ONCE"
          assert q["heldout_entities_decoded"]==4126
          assert q["heldout_ultrarare_species"]==529
          assert q["heldout_ultrarare_values_decoded"]==2182654
          assert q["heldout_non_ultrarare_values_decoded"]==0
          assert q["pilot_occurrence_values_decoded_during_run"]==0
          assert q["excluded_occurrence_values_decoded"]==0
          assert q["rerun_authorized"] is False
          assert r["status"]=="PROSPECTIVE_ULTRARARE_LAYER_SCORED_ONCE"
          assert r["species_layer"]["species"]==529
          assert r["species_layer"]["target_cells"]==2182654
          assert r["heldout_ultrarare_response_consumed"] is True
          assert r["rerun_authorized"] is False
          PY

      - name: Upload terminal ultrarare result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-mammals-v118-ultrarare-result-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/global_mammals_v118/result/token_receipt.json
            build/global_mammals_v118/result/ultrarare_heldout_matrix.csv
            build/global_mammals_v118/result/ultrarare_response_receipt.json
            build/global_mammals_v118/result/ultrarare_block_scores.csv
            build/global_mammals_v118/result/ultrarare_null_scores.csv
            build/global_mammals_v118/result/ultrarare_result.json
          if-no-files-found: warn
          retention-days: 30
