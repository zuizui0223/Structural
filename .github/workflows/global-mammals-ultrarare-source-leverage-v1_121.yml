name: Global mammals ultrarare source leverage v1.121

on:
  push:
    branches: [main]
    paths:
      - development/global_mammals_ultrarare_source_leverage_request_v1_121.json

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact numerics
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3

      - name: Validate response-free request and contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('development/global_mammals_ultrarare_source_leverage_contract_v1_121.json').read_text())
          r=json.loads(Path('development/global_mammals_ultrarare_source_leverage_request_v1_121.json').read_text())
          assert c['status']=='POSTHOC_RESPONSE_FREE_MECHANISM_DIAGNOSTIC_FROZEN'
          assert c['population']['heldout_occurrence_values_authorized'] is False
          assert r['status']=='REQUEST_POSTHOC_RESPONSE_FREE_SOURCE_LEVERAGE_DIAGNOSTIC'
          assert r['heldout_occurrence_authorized'] is False
          assert r['ultrarare_pilot_artifact_id']==11285057696
          assert r['reference_artifact_id']==11059506168
          assert r['routing_artifact_id']==11060106528
          assert r['null_replicates']==1000 and r['seed']==20261004
          assert r['one_shot'] is True
          PY

      - name: Download ultrarare pilot snapshot
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v112-ultrarare-pilot-03c170e50de4bd21f3c9148b36905e20aecc51d6-37153960728
          path: build/source_leverage/pilot
          repository: zuizui0223/Structural
          run-id: 37153960728
          github-token: ${{ github.token }}

      - name: Download response-independent graph reference
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v143-reference-fe0e65be12a223fb3f0991afae959cd62ef3aabb-36622553042
          path: build/source_leverage/reference
          repository: zuizui0223/Structural
          run-id: 36622553042
          github-token: ${{ github.token }}

      - name: Download exact routing
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v152-pilot-routing-f5ae81b05aac3ce4c5db6f43ce41e89c1d14548c-36625810600
          path: build/source_leverage/routing
          repository: zuizui0223/Structural
          run-id: 36625810600
          github-token: ${{ github.token }}

      - name: Run response-free source leverage diagnostic
        run: |
          mkdir -p build/source_leverage/output
          python scripts/run_global_mammals_ultrarare_source_leverage_v1_121.py \
            build/source_leverage/pilot/ultrarare_species_universe.csv \
            build/source_leverage/pilot/ultrarare_pilot_matrix.csv \
            build/source_leverage/reference/source_graph_edges.csv \
            build/source_leverage/reference/reference_receipt.json \
            build/source_leverage/routing/pilot_ids.csv \
            build/source_leverage/routing/confirmatory_ids.csv \
            --source-table build/source_leverage/output/source_leverage_by_source.csv \
            --species-table build/source_leverage/output/source_leverage_by_species.csv \
            --result build/source_leverage/output/source_leverage_result.json

      - name: Enforce response boundary and output shape
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('build/source_leverage/output/source_leverage_result.json').read_text())
          assert x['status']=='POSTHOC_PILOT_PLUS_GEOMETRY_SOURCE_LEVERAGE_DIAGNOSTIC_COMPLETE'
          assert x['heldout_occurrence_values_used'] is False
          assert x['heldout_occurrence_values_opened'] is False
          assert x['species']==529
          assert x['multi_source_summary']['species']==212
          PY

      - name: Upload source leverage diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: global-mammals-v121-ultrarare-source-leverage-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/source_leverage/output/source_leverage_by_source.csv
            build/source_leverage/output/source_leverage_by_species.csv
            build/source_leverage/output/source_leverage_result.json
          if-no-files-found: error
          retention-days: 30
