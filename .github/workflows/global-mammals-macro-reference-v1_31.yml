name: Global mammals macro state/source reference v1.31

on:
  push:
    branches:
      - main
    paths:
      - development/global_mammals_macro_reference_request_v1_31.json

permissions:
  contents: read
  actions: read

jobs:
  freeze-response-independent-reference:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout frozen Structural code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate contaminated-macro response-closed request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          req = json.loads(
              Path(
                  "development/global_mammals_macro_reference_request_v1_31.json"
              ).read_text(encoding="utf-8")
          )
          assert req["schema"] == (
              "structural.global_mammals_macro_reference_request.v1_31"
          )
          assert req["status"] == (
              "REQUEST_RESPONSE_INDEPENDENT_MACRO_STATE_AND_SOURCE_OPERATOR"
          )
          assert req["candidate_id"] == (
              "global_island_native_mammals_barreto_2024"
          )
          assert req["analysis_route"] == "contaminated_macro_analysis_only"
          assert req["safe_island_count"] == 5592
          assert req["validation_block_count"] == 219
          assert req["Appendix_1_response_access_authorized"] is False
          assert req["counts_as_fresh_confirmation"] is False
          assert req["fresh_system_denominator_contribution"] == 0
          assert req["one_shot"] is True
          PY

      - name: Download exact v1.23 safe covariates
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v123-appendix2-safe-ea565b98419f8aacde9fb13c26724bb385635b95-36524988694
          path: build/global_mammals_v131/safe
          repository: zuizui0223/Structural
          run-id: 36524988694
          github-token: ${{ github.token }}

      - name: Download exact v1.25 spatial design
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v125-spatial-9333854097f15617b25a09ba79a67db4854c6b3f-36527735618
          path: build/global_mammals_v131/spatial
          repository: zuizui0223/Structural
          run-id: 36527735618
          github-token: ${{ github.token }}

      - name: Verify exact frozen parent files
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          checks = {
              Path("build/global_mammals_v131/safe/appendix2_safe_rows.csv"):
                  "b60fbfd643b8a517d3a632a50db6b2b9916f9f3f34bae123ba7b7e89665b39e8",
              Path("build/global_mammals_v131/spatial/island_partition.csv"):
                  "3f85efb3b71423a8392cb1f7a5590c7b03cedef377fee0997df457a029b998bd",
              Path("build/global_mammals_v131/spatial/block_table.csv"):
                  "4646034c1e5cd408e252c6d187a763e292850edd5c7d1619567b634e410bb27d",
          }
          for path, expected in checks.items():
              if not path.exists():
                  raise SystemExit(f"missing frozen parent: {path}")
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != expected:
                  raise SystemExit(
                      f"frozen parent SHA mismatch: {path.name}"
                  )
          PY

      - name: Build R0/R1 state and distinct source-block graph
        run: |
          mkdir -p build/global_mammals_v131/output
          python scripts/build_global_mammals_macro_reference_v1_31.py \
            --safe-csv build/global_mammals_v131/safe/appendix2_safe_rows.csv \
            --island-partition build/global_mammals_v131/spatial/island_partition.csv \
            --block-table build/global_mammals_v131/spatial/block_table.csv \
            --state-output build/global_mammals_v131/output/state_reference.csv \
            --operator-output build/global_mammals_v131/output/source_operator.json \
            --receipt build/global_mammals_v131/output/reference_receipt.json

      - name: Enforce exact macro-only ceiling
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("build/global_mammals_v131/output")
          receipt = json.loads(
              (root / "reference_receipt.json").read_text(encoding="utf-8")
          )
          operator = json.loads(
              (root / "source_operator.json").read_text(encoding="utf-8")
          )
          with (root / "state_reference.csv").open(
              "r", encoding="utf-8", newline=""
          ) as handle:
              rows = list(csv.DictReader(handle))

          assert receipt["status"] == (
              "GLOBAL_MACRO_STATE_AND_SOURCE_OPERATOR_FROZEN_RESPONSE_CLOSED"
          )
          assert receipt["island_count"] == 5592
          assert receipt["block_count"] == 219
          assert receipt["pilot_block_count"] == 50
          assert receipt["confirmatory_block_count"] == 169
          assert receipt["pilot_island_count"] == 1307
          assert receipt["confirmatory_island_count"] == 4285
          assert len(receipt["bioregion_levels"]) == 12
          assert receipt["bioregion_baseline"] == "Afrotropical"
          assert len(rows) == 5592
          assert operator["selected_k"] >= 1
          assert operator["edge_count"] >= 218
          assert operator["cross_bioregion_edge_count"] >= 11
          assert len(operator["block_order"]) == 219
          assert len(operator["all_pairs_shortest_paths"]) == 23871
          assert operator["validation_tile_adjacency_reused"] is False
          assert operator["response_used_to_build_operator"] is False
          assert receipt["Appendix_1_reopened"] is False
          assert receipt["mammal_species_names_opened"] is False
          assert receipt["mammal_occurrence_values_opened"] is False
          assert receipt["counts_as_fresh_confirmation"] is False
          assert receipt["fresh_system_denominator_contribution"] == 0
          assert receipt["original_fresh_chain_restored"] is False
          assert receipt["mechanism_claim_authorized"] is False
          assert receipt["Appendix_1_response_access_authorized"] is False
          PY

      - name: Upload response-independent macro reference
        uses: actions/upload-artifact@v4
        with:
          name: global-mammals-v131-reference-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/global_mammals_v131/output/state_reference.csv
            build/global_mammals_v131/output/source_operator.json
            build/global_mammals_v131/output/reference_receipt.json
          if-no-files-found: error
          retention-days: 30
