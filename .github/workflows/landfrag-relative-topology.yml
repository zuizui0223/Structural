name: LandFrag relative-topology pre-response freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "research/landfrag_relative_topology/**"
      - ".github/workflows/landfrag-relative-topology.yml"

permissions:
  contents: read

concurrency:
  group: landfrag-relative-topology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install predictor-only dependency
        run: python -m pip install numpy
      - name: Run LandFrag metadata-only geometry census
        shell: bash
        run: |
          set -o pipefail
          python research/landfrag_relative_topology/metadata_census_v0_1.py             | tee landfrag_relative_topology_census.json
      - name: Assert monolithic abundance response remains sealed
        run: |
          python - <<'PY'
          import json
          x=json.load(open("landfrag_relative_topology_census.json"))
          assert x["schema"] == "structural.landfrag_relative_topology_metadata.v0_1"
          assert x["status"] == "QUALIFIED_RESPONSE_SEALED"
          assert x["response_values_accessed"] is False
          assert x["abundance_file_opened"] is False
          assert x["response_surface"]["opened"] is False
          assert x["source"]["abundance_git_blob_sha"] == "abfdd21712b7f221207e25e62b623e8a8a901a55"
          assert x["selection"]["geometry_qualified_studies"] >= 60
          assert x["selection"]["independent_geography_clusters"] >= 50
          assert x["selection"]["qualified_focals"] >= 800
          assert x["geometry_rules"]["prediction"] == "positive"
          assert len(x["census_fingerprint"]) == 64
          print("LANDFRAG_CENSUS_QUALIFIED",x["census_fingerprint"])
          print("SELECTION",x["selection"])
          print("MULTI_STUDY_CLUSTERS",[c for c in x["geography_clustering"]["clusters"] if len(c["studies"])>1])
          PY
      - name: Freeze exact response and H1 protocol
        shell: bash
        run: |
          set -o pipefail
          python research/landfrag_relative_topology/freeze_protocol_v0_1.py             --census landfrag_relative_topology_census.json             | tee landfrag_relative_topology_protocol.json
      - name: Assert protocol remains response sealed
        run: |
          python - <<'PY'
          import json
          x=json.load(open("landfrag_relative_topology_protocol.json"))
          assert x["schema"] == "structural.landfrag_relative_topology_protocol.v0_1"
          assert x["status"] == "FROZEN_BEFORE_MONOLITHIC_ABUNDANCE_ACCESS"
          assert x["response_values_accessed"] is False
          assert x["abundance_file_opened"] is False
          assert x["response_firewall"]["one_shot_access_only"] is True
          assert x["response_firewall"]["no_pilot_confirmatory_split"] is True
          assert x["study_model"]["target"] == "direct_x_gain"
          assert x["H1_primary"]["prediction"] == "positive"
          assert x["geography_aggregation"]["minimum_response_qualified_geography_clusters"] == 50
          assert x["bootstrap"]["replicates"] == 10000
          assert x["bootstrap"]["seed"] == 20260925
          assert x["response_open_authorized"] is False
          assert x["H1_scoring_authorized"] is False
          assert len(x["protocol_fingerprint"]) == 64
          print("LANDFRAG_PROTOCOL_FROZEN",x["protocol_fingerprint"])
          PY
      - name: Assert pre-response scripts cannot fetch abundance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("research/landfrag_relative_topology/metadata_census_v0_1.py").read_text()
          q=Path("research/landfrag_relative_topology/freeze_protocol_v0_1.py").read_text()
          assert p.count("fetch_raw(") == 2
          assert "fetch_raw(METADATA_PATH)" in p
          assert "fetch_raw(ABUNDANCE_PATH)" not in p
          assert "urlopen" not in q
          print("NO_LANDFRAG_RESPONSE_ACCESS_PATH")
          PY
