name: GIFT community heterogeneity audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/gift_community_heterogeneity/**"
      - ".github/workflows/gift-community-heterogeneity.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: gift-community-heterogeneity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen analysis dependencies
        run: python -m pip install numpy pyshp shapely
      - name: Replay frozen common predictor panel without response access
        run: |
          python research/gift_community_heterogeneity/freeze_common_panel_v0_2.py \
            --prior-exclusions research/gift_community_heterogeneity/prior_response_exclusions_v0_1.json \
            > gift_community_panel.json
      - name: Replay final frozen H1 H3 protocol
        run: |
          python research/gift_community_heterogeneity/freeze_protocol_v0_5.py \
            --panel gift_community_panel.json \
            --prior-exclusions research/gift_community_heterogeneity/prior_response_exclusions_v0_1.json \
            --h2-terminal research/gift_community_heterogeneity/pre_response_h2_stop_v0_4.json \
            > gift_community_protocol.json
      - name: Verify exact final design before archived-response analysis
        run: |
          python - <<'PY'
          import json
          panel=json.load(open("gift_community_panel.json"))
          protocol=json.load(open("gift_community_protocol.json"))
          lock=json.load(open("research/gift_community_heterogeneity/pre_response_lock_v0_5.json"))
          assert panel["panel_fingerprint"] == lock["panel_fingerprint"] == "7d8c01f6dd36f479106f669f11c0c46aa0c3ff245874b99416f4ad3440393b7b"
          assert protocol["protocol_fingerprint"] == lock["protocol_fingerprint"] == "6529dbd74d845dfdbecf614177376c80d690445f4cf6f9eb8c5fb654c03f54e1"
          assert protocol["H2"]["status"] == "TERMINAL_PRE_RESPONSE_NON_ESTIMABLE_NOT_TESTED"
          assert protocol["model"]["bootstrap_design"]["accepted_draws_sha256"] == "2aeebc05347847523e91066457c3fce0ccae422a0a6a71be348faa6a24f2d04d"
          assert lock["response_values_accessed"] is False
          print("FINAL_GIFT_DESIGN_REPLAY_OK")
          PY
      - name: Download immutable one-shot response artifact
        uses: actions/download-artifact@v4
        with:
          name: gift-community-topology-weighted-one-shot-v0-1
          path: archived_one_shot
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35992977691
      - name: Audit heterogeneity using archived response only
        run: |
          test -f archived_one_shot/gift_community_outcome.json
          test -f archived_one_shot/gift_community_raw_response.csv
          python research/gift_community_heterogeneity/analyze_heterogeneity_v0_1.py \
            --panel gift_community_panel.json \
            --protocol gift_community_protocol.json \
            --lock research/gift_community_heterogeneity/pre_response_lock_v0_5.json \
            --raw-response archived_one_shot/gift_community_raw_response.csv \
            --outcome archived_one_shot/gift_community_outcome.json \
            | tee gift_community_heterogeneity.json
      - name: Assert exploratory evidence boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_community_heterogeneity.json"))
          assert x["status"] == "EXPLORATORY_AFTER_FROZEN_ONE_SHOT"
          b=x["evidence_boundary"]
          assert b["new_response_queries"] == 0
          assert b["uses_archived_one_shot_only"] is True
          assert b["cannot_rescue_confirmatory_results"] is True
          assert b["H2_reintroduced"] is False
          assert abs(x["exact_replay"]["H1"] - 0.25463742860046484) < 1e-12
          assert abs(x["exact_replay"]["H3"] + 0.31695760719153243) < 1e-12
          assert len(x["exploratory_fingerprint"]) == 64
          print("HETEROGENEITY_AUDIT_OK", x["exploratory_fingerprint"])
          print("BOOTSTRAP", x["bootstrap_directional_stability"])
          print("LOAO", {k:v for k,v in x["leave_one_archipelago_out"].items() if k!="all_archipelagos"})
          PY
      - name: Assert no response API exists in exploratory analysis
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("research/gift_community_heterogeneity/analyze_heterogeneity_v0_1.py").read_text()
          assert "gift.uni-goettingen.de" not in p
          assert "query=checklists" not in p
          assert "urlopen" not in p
          print("NO_NEW_RESPONSE_QUERY_PATH")
          PY
      - name: Preserve exploratory audit
        uses: actions/upload-artifact@v4
        with:
          name: gift-community-heterogeneity-v0-1
          path: gift_community_heterogeneity.json
          retention-days: 90
