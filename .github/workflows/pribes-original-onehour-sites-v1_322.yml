name: PRIBES separate original published one-hour Event-only source cohort v1.322
on:
  push:
    paths:
      - ".github/workflows/pribes-original-onehour-sites-v1_322.yml"
      - "development/pribes_equal_onehour_original_event_protocol_v1_322.json"
      - "scripts/pribes_original_onehour_sites_v1_322.py"
      - "tests/test_pribes_original_onehour_sites_v1_322.py"
  pull_request:
    paths:
      - ".github/workflows/pribes-original-onehour-sites-v1_322.yml"
      - "development/pribes_equal_onehour_original_event_protocol_v1_322.json"
      - "scripts/pribes_original_onehour_sites_v1_322.py"
      - "tests/test_pribes_original_onehour_sites_v1_322.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-onehour-response-sealed-source-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Test response-blind 72 physical 1-hour sites, old full cohort STOP and disjoint source IDs
        run: python -m pytest -q tests/test_pribes_original_onehour_sites_v1_322.py
      - name: Original PRIBES 1.3 Event ONLY, no taxon or status source reads
        run: |
          python scripts/pribes_original_onehour_sites_v1_322.py \
            --contract development/pribes_equal_onehour_original_event_protocol_v1_322.json \
            --previous-event-contract development/pribes_original_event_site_contract_v1_321.json \
            --out pribes_original_onehour_source_selection_v1_322.json
      - name: Retain original 80-source terminal and new 1-hour subset scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("pribes_original_onehour_source_selection_v1_322.json").read_text(encoding="utf-8"))
          assert r["status"] in (
             "NEW_SEPARATE_72_RUDERAL_SITES_ONEHOUR_EACH_TAXON_RESPONSES_SEALED",
             "TERMINAL_NO_EXACT_PUBLISHED_ONEHOUR_SIX_ISLAND_FRAME")
          assert r["previous_v1_321_full_source_equal_effort_gate"]=="TERMINAL"
          assert r["source_origin_and_species_values_OPENED"]==0
          assert r["original_BALA_Event_or_Occurrence_rows_reopened"]==0
          assert r["GEB_scientific_HOLD"] and not r["eBird_used"]
          assert r["new_confirmatory_systems"]==0
          print("Original 1-hour PRIBES source-only admissibility:",r["status"])
          print("Independent 6-island site counts:",r.get("onehour_source_physical_sites_by_BALA_overlap_island"))
          PY
      - name: Preserve immutable 1-hour site selection SHA (no species)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pribes-original-published-onehour-six-island-source-only-v1-322
          path: pribes_original_onehour_source_selection_v1_322.json
          if-no-files-found: warn
