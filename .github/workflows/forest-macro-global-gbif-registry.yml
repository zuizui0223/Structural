name: Global forest GBIF sampling-event network discovery metadata only
on:
  push:
    paths:
      - ".github/workflows/forest-macro-global-gbif-registry.yml"
      - "analysis/forest_macro_global/gbif_forest_event_registry.py"
      - "analysis/forest_macro_global/test_gbif_forest_event_registry.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-global-forest-network-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run known-truth candidate registry and false-forest tests
        run: |
          python -m pip install pytest
          python -m pytest -q analysis/forest_macro_global/test_gbif_forest_event_registry.py
      - name: Scan original GBIF sampling-event datasets across forest discovery terms
        run: |
          python analysis/forest_macro_global/gbif_forest_event_registry.py --out global_forest_gbif_registry
      - name: Check accurate metadata-only scope, no fabricated forest site replication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("global_forest_gbif_registry/GBIF_forest_source_registry_audit.json").read_text())
          assert r["scope"]=="metadata_only_global_sampling_event_forest_query_discovery"
          assert r["n_distinct_GBIF_dataset_UUIDs"]>0
          assert r["n_unique_sampled_sites_verified"]==0
          assert r["n_original_source_Event_rows_read"]==0
          assert r["n_original_source_Occurrence_rows_read"]==0
          assert r["publishing_country_is_not_sampling_location"]
          assert r["dataset_recordCount_is_NOT_forest_plot_sample_size"]
          assert not r["eBird_used"]
          print("Verified worldwide forest monitoring candidate dataset UUIDs:",r["n_distinct_GBIF_dataset_UUIDs"])
          PY
      - name: Preserve global source network registry and uncertainty labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-macro-global-gbif-event-network-candidates
          path: global_forest_gbif_registry/
          if-no-files-found: warn
