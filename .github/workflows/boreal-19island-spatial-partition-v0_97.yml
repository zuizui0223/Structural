name: Boreal 19-island spatial partition v0.97

on:
  push:
    branches:
      - main
    paths:
      - development/boreal_19island_spatial_partition_request_v0_97.json

permissions:
  contents: read

jobs:
  freeze-spatial-partition:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Checkout committed safe geometry and frozen rule
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate one-shot response-independent request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(
              Path("development/boreal_19island_spatial_partition_request_v0_97.json")
              .read_text(encoding="utf-8")
          )
          assert x["schema"] == (
              "structural.boreal_19island_spatial_partition_request.v0_97"
          )
          assert x["status"] == "REQUEST_LEGACY_RULE_SPATIAL_FREEZE"
          assert x["reuse_v075_rule_without_tuning"] is True
          assert x["biological_response_values_opened"] is False
          assert x["counts_as_empirical_evidence"] is False
          PY

      - name: Freeze spatial blocks with unchanged v0.75 rule
        run: |
          mkdir -p build/boreal_v097
          python scripts/freeze_boreal_19island_spatial_partition_v0_97.py \
            --output build/boreal_v097/spatial_receipt.json

      - name: Assert receipt-only artifact surface
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("build/boreal_v097")
          observed = {p.name for p in root.iterdir() if p.is_file()}
          if observed != {"spatial_receipt.json"}:
              raise SystemExit(f"unexpected artifact surface: {sorted(observed)}")
          PY

      - name: Upload response-independent spatial receipt
        uses: actions/upload-artifact@v4
        with:
          name: boreal-v097-spatial-${{ github.sha }}-${{ github.run_id }}
          path: build/boreal_v097/spatial_receipt.json
          if-no-files-found: error
          retention-days: 14
