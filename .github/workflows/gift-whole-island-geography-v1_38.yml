name: GIFT complete whole-island geography v1.38
on:
  push:
    branches: [main]
    paths:
      - development/gift_whole_island_geography_request_v1_38.json
permissions:
  contents: read
  actions: read
jobs:
  geography:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::GIFT@1.3.4
            any::jsonlite
            any::digest
      - name: Validate response-independent supersession
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("development/gift_whole_island_geography_contract_v1_38.json").read_text())
          r=json.loads(Path("development/gift_whole_island_geography_request_v1_38.json").read_text())
          assert c["failure_basis"]["workflow_run_id"]==36584382510
          assert c["failure_basis"]["species_composition_opened"] is False
          assert r["canonical_metadata_artifact_id"]==11039932741
          assert r["species_composition_authorized"] is False
          assert r["one_shot"] is True
          PY
      - name: Download exact canonical metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: gift-v089-metadata-766855d3948088603eef19f9a3ac09bb7c5b8e3e-36582542511
          path: build/gift_v138/input
          repository: zuizui0223/Structural
          run-id: 36582542511
          github-token: ${{ github.token }}
      - name: Verify exact metadata identity
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("build/gift_v138/input/gift_island_list_metadata.csv")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="3d7f5a1284aded4e28e0bddea2f09c87ce9fb456ac785b84d59446307e0ba4a7"
          PY
      - name: Project unique whole islands
        run: |
          mkdir -p build/gift_v138/output
          Rscript scripts/project_gift_whole_islands_v1_30.R             --input build/gift_v138/input/gift_island_list_metadata.csv             --output-entities build/gift_v138/output/whole_island_entities.csv             --output-lists build/gift_v138/output/whole_island_lists.csv             --receipt build/gift_v138/output/whole_island_receipt.json
      - name: Freeze complete safe geography
        run: |
          Rscript scripts/freeze_gift_whole_island_geography_v1_38.R             --entities build/gift_v138/output/whole_island_entities.csv             --lists build/gift_v138/output/whole_island_lists.csv             --output-geography build/gift_v138/output/gift_whole_island_geography.csv             --output-lists build/gift_v138/output/gift_retained_lists.csv             --output-excluded build/gift_v138/output/gift_excluded_missing_geography.csv             --receipt build/gift_v138/output/geography_receipt.json
      - name: Enforce response ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/gift_v138/output/geography_receipt.json").read_text())
          assert x["status"]=="COMPLETE_SAFE_WHOLE_ISLAND_GEOGRAPHY_FROZEN"
          assert x["input_whole_island_entities"]==1460
          assert x["retained_complete_geography_entities"]>0
          assert x["species_composition_opened"] is False
          assert x["species_response_authorized"] is False
          PY
      - name: Upload response-independent geography
        uses: actions/upload-artifact@v4
        with:
          name: gift-v138-geography-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/gift_v138/output/whole_island_entities.csv
            build/gift_v138/output/whole_island_lists.csv
            build/gift_v138/output/whole_island_receipt.json
            build/gift_v138/output/gift_whole_island_geography.csv
            build/gift_v138/output/gift_retained_lists.csv
            build/gift_v138/output/gift_excluded_missing_geography.csv
            build/gift_v138/output/geography_receipt.json
          if-no-files-found: error
          retention-days: 30
