name: Structural standalone checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate confirmatory admission queue
        run: python scripts/validate_confirmatory_queue_v0_36.py
      - name: Validate standalone and connectivity-development boundaries
        run: python -m pytest -q
      - name: Build standalone submission package
        run: python manuscript/build_structural_submission_package_v2.py --output-dir build/structural_submission_v2
