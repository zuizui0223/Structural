name: Structural standalone checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate raw-replay confirmatory admission queue
        run: python scripts/validate_confirmatory_queue_v0_38.py
      - name: Exercise non-empty raw-replay queue fixture
        run: python scripts/validate_confirmatory_queue_v0_38.py tests/fixtures/confirmatory_admission_v0_38/queue.json
      - name: Validate prospective mechanism framework
        run: python scripts/validate_mechanism_protocol_v0_1.py
      - name: Validate synthetic response-sealed mechanism protocol
        run: python scripts/validate_mechanism_protocol_v0_1.py tests/fixtures/mechanism_protocol_v0_1/valid_protocol.json
      - name: Exercise burned mechanism transition pilot gate
        run: python scripts/run_mechanism_transition_pilot_v0_2.py tests/fixtures/mechanism_transition_pilot_v0_2/protocol.json tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv
      - name: Exercise response-blind M3/M4 auxiliary mechanism gate
        run: python scripts/run_mechanism_auxiliary_gate_v0_3.py tests/fixtures/mechanism_auxiliary_gate_v0_3/protocol.json --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv
      - name: Exercise replay-bound mechanism admission gate
        run: python scripts/run_mechanism_admission_v0_4.py tests/fixtures/mechanism_admission_v0_4/protocol.json tests/fixtures/confirmatory_admission_v0_38/queue.json --transition-pilot tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv --allow-synthetic-structural-queue
      - name: Freeze synthetic M1 confirmatory mechanism protocol
        run: python scripts/freeze_mechanism_confirmatory_protocol_v0_5.py tests/fixtures/mechanism_confirmatory_freeze_v0_5/m1.json tests/fixtures/mechanism_admission_v0_4/protocol.json tests/fixtures/confirmatory_admission_v0_38/queue.json --transition-pilot tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv --allow-synthetic-structural-queue
      - name: Freeze synthetic M2 confirmatory mechanism protocol
        run: python scripts/freeze_mechanism_confirmatory_protocol_v0_5.py tests/fixtures/mechanism_confirmatory_freeze_v0_5/m2.json tests/fixtures/mechanism_admission_v0_4/protocol.json tests/fixtures/confirmatory_admission_v0_38/queue.json --transition-pilot tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv --allow-synthetic-structural-queue
      - name: Freeze synthetic M3 confirmatory mechanism protocol
        run: python scripts/freeze_mechanism_confirmatory_protocol_v0_5.py tests/fixtures/mechanism_confirmatory_freeze_v0_5/m3.json tests/fixtures/mechanism_admission_v0_4/protocol.json tests/fixtures/confirmatory_admission_v0_38/queue.json --transition-pilot tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv --allow-synthetic-structural-queue
      - name: Freeze synthetic M4 confirmatory mechanism protocol
        run: python scripts/freeze_mechanism_confirmatory_protocol_v0_5.py tests/fixtures/mechanism_confirmatory_freeze_v0_5/m4.json tests/fixtures/mechanism_admission_v0_4/protocol.json tests/fixtures/confirmatory_admission_v0_38/queue.json --transition-pilot tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv --allow-synthetic-structural-queue
      - name: Authorize synthetic M1 confirmatory mechanism response
        run: python scripts/authorize_mechanism_response_v0_6.py tests/fixtures/mechanism_confirmatory_freeze_v0_5/m1.json tests/fixtures/mechanism_confirmatory_freeze_v0_5/m1_receipt.json tests/fixtures/mechanism_admission_v0_4/protocol.json tests/fixtures/confirmatory_admission_v0_38/queue.json --transition-pilot tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv --allow-synthetic-structural-queue
      - name: Authorize synthetic M2 confirmatory mechanism response
        run: python scripts/authorize_mechanism_response_v0_6.py tests/fixtures/mechanism_confirmatory_freeze_v0_5/m2.json tests/fixtures/mechanism_confirmatory_freeze_v0_5/m2_receipt.json tests/fixtures/mechanism_admission_v0_4/protocol.json tests/fixtures/confirmatory_admission_v0_38/queue.json --transition-pilot tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv --allow-synthetic-structural-queue
      - name: Authorize synthetic M3 confirmatory mechanism response
        run: python scripts/authorize_mechanism_response_v0_6.py tests/fixtures/mechanism_confirmatory_freeze_v0_5/m3.json tests/fixtures/mechanism_confirmatory_freeze_v0_5/m3_receipt.json tests/fixtures/mechanism_admission_v0_4/protocol.json tests/fixtures/confirmatory_admission_v0_38/queue.json --transition-pilot tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv --allow-synthetic-structural-queue
      - name: Authorize synthetic M4 confirmatory mechanism response
        run: python scripts/authorize_mechanism_response_v0_6.py tests/fixtures/mechanism_confirmatory_freeze_v0_5/m4.json tests/fixtures/mechanism_confirmatory_freeze_v0_5/m4_receipt.json tests/fixtures/mechanism_admission_v0_4/protocol.json tests/fixtures/confirmatory_admission_v0_38/queue.json --transition-pilot tests/fixtures/mechanism_transition_pilot_v0_2/pilot.csv --genetic-populations tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_populations.csv --genetic-pairs tests/fixtures/mechanism_auxiliary_gate_v0_3/genetic_pairs.csv --environment tests/fixtures/mechanism_auxiliary_gate_v0_3/environment.csv --allow-synthetic-structural-queue
      - name: Validate standalone and connectivity-development boundaries
        run: python -m pytest -q
      - name: Build standalone submission package
        run: python manuscript/build_structural_submission_package_v2.py --output-dir build/structural_submission_v2
      - name: Verify release candidate state
        run: python scripts/verify_release_candidate_v0_2.py --package-dir build/structural_submission_v2 --allow-hold
      - name: Build deterministic release staging bundle
        run: python scripts/build_release_bundle_v0_1.py --submission-package build/structural_submission_v2 --output-dir build/structural_release_bundle_v0_1 --zip-path build/structural_release_bundle_v0_1.zip
      - name: Verify release-ready receipt remains correctly blocked
        run: python scripts/issue_release_ready_receipt_v0_1.py --submission-package build/structural_submission_v2 --release-bundle-zip build/structural_release_bundle_v0_1.zip --release-bundle-receipt build/structural_release_bundle_v0_1.zip.receipt.json --allow-hold
