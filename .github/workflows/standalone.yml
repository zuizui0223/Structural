name: Structural standalone checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate raw-replay confirmatory admission queue
        run: python scripts/validate_confirmatory_queue_v0_38.py
      - name: Exercise non-empty raw-replay queue fixture
        run: python scripts/validate_confirmatory_queue_v0_38.py tests/fixtures/confirmatory_admission_v0_38/queue.json
      - name: Validate prospective mechanism framework
        run: python scripts/validate_mechanism_protocol_v0_1.py
      - name: Validate synthetic response-sealed mechanism protocol
        run: python scripts/validate_mechanism_protocol_v0_1.py tests/fixtures/mechanism_protocol_v0_1/valid_protocol.json
      - name: Validate standalone and connectivity-development boundaries
        run: python -m pytest -q
      - name: Build standalone submission package
        run: python manuscript/build_structural_submission_package_v2.py --output-dir build/structural_submission_v2
      - name: Verify release candidate state
        run: python scripts/verify_release_candidate_v0_2.py --package-dir build/structural_submission_v2 --allow-hold
      - name: Build deterministic release staging bundle
        run: python scripts/build_release_bundle_v0_1.py --submission-package build/structural_submission_v2 --output-dir build/structural_release_bundle_v0_1 --zip-path build/structural_release_bundle_v0_1.zip
      - name: Verify release-ready receipt remains correctly blocked
        run: python scripts/issue_release_ready_receipt_v0_1.py --submission-package build/structural_submission_v2 --release-bundle-zip build/structural_release_bundle_v0_1.zip --release-bundle-receipt build/structural_release_bundle_v0_1.zip.receipt.json --allow-hold
