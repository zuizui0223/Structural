name: Global mammals corrected exploratory pilot v1.71
on:
  push:
    branches: [main]
    paths:
      - development/global_mammals_corrected_macro_pilot_request_v1_71.json
permissions:
  contents: read
  actions: read
jobs:
  corrected-pilot:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate separate exploratory lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("development/global_mammals_corrected_macro_pilot_request_v1_71.json").read_text())
          c=json.loads(Path("development/global_mammals_corrected_macro_pilot_contract_v1_70.json").read_text())
          old=json.loads(Path("development/global_mammals_corrected_physical_schema_contract_v1_69.json").read_text())
          assert r["status"]=="REQUEST_ONE_SHOT_CORRECTED_NONCONFIRMATORY_MACRO_PILOT"
          assert r["corrected_schema_artifact_id"]==11112070309
          assert r["pilot_occurrence_access_authorized"] is True
          assert r["confirmatory_response_authorized"] is False
          assert r["fresh_or_confirmatory_claim_authorized"] is False
          assert r["one_shot"] is True
          assert c["species_universe"]["minimum_presence"]==13
          assert c["species_universe"]["minimum_absence"]==13
          assert c["scientific_method_lock"]["R0_R3_C_method_changed_from_v167"] is False
          assert old["continuation"]["same_v165_protocol_retry_authorized"] is False
          PY
      - name: Download exact corrected schema
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v169-corrected-schema-c1ba487b5df7c9558048f69a2747243d59edd58c-36743248729
          path: build/global_mammals_v171/schema
          repository: zuizui0223/Structural
          run-id: 36743248729
          github-token: ${{ github.token }}
      - name: Download exact routing
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v152-pilot-routing-f5ae81b05aac3ce4c5db6f43ce41e89c1d14548c-36625810600
          path: build/global_mammals_v171/routing
          repository: zuizui0223/Structural
          run-id: 36625810600
          github-token: ${{ github.token }}
      - name: Verify response-independent inputs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          checks={
            "build/global_mammals_v171/schema/corrected_species_manifest.csv":"882af8216d94dcb18fdafe8f9b3d363cadc2e7afbc1c227ba65d29848dea63d6",
            "build/global_mammals_v171/routing/pilot_ids.csv":"ac3898162331ce4217ea63d8b9330051acaa3a39ddca425cd0b48246a11caec0",
            "build/global_mammals_v171/routing/confirmatory_ids.csv":"afda05287599110c7248c5cb0c1931689a2aee40f8ff4ff5b76509aff5350715",
          }
          for p,s in checks.items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==s,(p,s)
          PY
      - name: Prepare Dryad token
        env:
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
          DRYAD_TOKEN_FALLBACK: ${{ secrets.DRYAD_TOKEN }}
        run: |
          mkdir -p build/global_mammals_v171/output
          python scripts/prepare_dryad_token_v0_73.py             --github-env "$GITHUB_ENV"             --receipt build/global_mammals_v171/output/token_receipt.json
      - name: Consume corrected exploratory pilot once
        run: |
          python scripts/run_global_mammals_corrected_macro_pilot_v1_70.py             --manifest build/global_mammals_v171/schema/corrected_species_manifest.csv             --pilot-routing build/global_mammals_v171/routing/pilot_ids.csv             --confirmatory-routing build/global_mammals_v171/routing/confirmatory_ids.csv             --species-universe build/global_mammals_v171/output/pilot_species_universe.csv             --pilot-matrix build/global_mammals_v171/output/pilot_matrix.csv             --receipt build/global_mammals_v171/output/pilot_response_receipt.json
      - name: Enforce nonconfirmatory boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/global_mammals_v171/output/pilot_response_receipt.json").read_text())
          assert x["status"]=="CORRECTED_NONCONFIRMATORY_MACRO_PILOT_CONSUMED"
          assert x["source_species"]==5394
          assert x["pilot_islands"]==1275
          assert x["confirmatory_islands_seen_routing_only"]==4126
          assert x["confirmatory_occurrence_values_decoded"]==0
          assert x["excluded_occurrence_values_decoded"]==0
          assert x["species_threshold_m"]==13
          assert x["fresh_status_restored"] is False
          assert x["counts_as_fresh_confirmation"] is False
          assert x["confirmatory_response_authorized"] is False
          PY
      - name: Upload corrected exploratory pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-mammals-v171-corrected-pilot-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/global_mammals_v171/output/token_receipt.json
            build/global_mammals_v171/output/pilot_species_universe.csv
            build/global_mammals_v171/output/pilot_matrix.csv
            build/global_mammals_v171/output/pilot_response_receipt.json
          if-no-files-found: warn
          retention-days: 30
