name: "Forest macro England NFI2026 original canopy/subcanopy ZIP header-only audit"
on:
  push:
    branches:
      - analysis/forest-macro-plot-environment
    paths:
      - "analysis/forest_macro_global/england_nfi2026_canopy_subcanopy_source_gate.py"
      - "docs/FOREST_NFI_ENGLAND_2026_CANOPY_SUBCANOPY_ORIGINAL_SOURCE_GATE_PRESPEC_20261118.md"
      - ".github/workflows/forest-macro-england-nfi2026-canopy-subcanopy-source-only.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher_original_metadata_only:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Synthetic original ZIP first-header only and leakage guards"
        run: |
          python analysis/forest_macro_global/england_nfi2026_canopy_subcanopy_source_gate.py --test
      - name: "One exact official NFI 2023-26 original archive GET and source-only gate"
        run: |
          python analysis/forest_macro_global/england_nfi2026_canopy_subcanopy_source_gate.py --out NFI2026_SOURCE_ONLY_AGGREGATE
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("NFI2026_SOURCE_ONLY_AGGREGATE/England_NFI2026_official_archive_header_source_only.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"]=="structural.england_nfi2026_canopy_subcanopy_original_source_gate.v1"
          assert d["source_official_dataset_uuid"]=="2b8a8f17-3745-43d1-bb32-0d509230f158"
          assert d["source_zip_biological_rows_READ"]==0 and not d["new_ecological_effect_estimated"]
          assert d["source_explicit_Lindgren_canopy_Malaise_subcanopy_method_confound"]
          assert d["previous_Finland_Carpathian_PREDICTS_Thai_NEON_BALA_GEB_scores_UNCHANGED"]
          assert not d["eBird_used"] and not d["TinyFish_used"]
          if d["status"]=="SOURCE_NFI_ENGLAND_2026_ARCHIVE_AND_HEADERS_ONLY_PASS":
              q=d["original_source_zip_directory_and_first_headers_ONLY"]
              assert q["source_OTU_and_species_rows_READ"]==0
              assert q["source_sample_ID_or_delocation_values_READ"]==0
              assert q["source_site_geography_or_coordinates_READ"]==0
              assert q["candidate_header_valid_n"]>=1
              assert len(d["publisher_original_archive_sha256"])==64
          else:
              assert d["no_site_denominator_or_biological_response_eligible"]
          print("SCIENTIFIC_EVIDENCE_CEILING_ARCHIVE_HEADERS_ONLY",d["status"])
          PY
      - name: "Archive source receipt without original site, taxon or sequence records"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-forest-england-nfi2026-publisher-original-source-only
          path: NFI2026_SOURCE_ONLY_AGGREGATE/
          if-no-files-found: warn
