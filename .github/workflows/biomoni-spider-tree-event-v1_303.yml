name: Terceira spider-tree exact original Event colocation v1.303
on:
  push:
    paths:
      - ".github/workflows/biomoni-spider-tree-event-v1_303.yml"
      - "development/biomoni_terceira_spider_tree_event_protocol_v1_303.json"
      - "scripts/biomoni_terceira_spider_tree_event_v1_303.py"
      - "tests/test_biomoni_terceira_spider_tree_event_v1_303.py"
  pull_request:
    paths:
      - ".github/workflows/biomoni-spider-tree-event-v1_303.yml"
      - "development/biomoni_terceira_spider_tree_event_protocol_v1_303.json"
      - "scripts/biomoni_terceira_spider_tree_event_v1_303.py"
      - "tests/test_biomoni_terceira_spider_tree_event_v1_303.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  author-plot-colocation-only-no-spider-taxa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Confirm exact ten-site and equal method opportunity gates with synthetic tests
        run: python -m pytest -q tests/test_biomoni_terceira_spider_tree_event_v1_303.py
      - name: Only original published woody and spider Event core bodies allowed
        run: |
          python scripts/biomoni_terceira_spider_tree_event_v1_303.py \
            --protocol development/biomoni_terceira_spider_tree_event_protocol_v1_303.json \
            --out biomoni_spider_tree_event_v1_303.json
      - name: Preserve study STOP and no taxonomic access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("biomoni_spider_tree_event_v1_303.json").read_text())
          assert r["status"] in ("TEN_SITE_SPIDER_TREE_EVENT_FRAME_QUALIFIED_RESPONSES_SEALED","STOP_ORIGINAL_TEN_PHYSICAL_SITE_BIJECTION_MISSING","TERMINAL_SITE_COORDINATE_OR_SPIDER_METHOD_EFFORT")
          assert r["original_spider_Occurrence_rows_opened"]==0
          assert r["original_woody_Occurrence_rows_reopened"]==0
          assert r["GEB_scientific_HOLD"] and not r["eBird_used"]
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomoni-spider-tree-original-event-only-v1-303
          path: biomoni_spider_tree_event_v1_303.json
          if-no-files-found: warn
