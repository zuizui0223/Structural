name: Global mammals macro pilot response v1.66
on:
  push:
    branches: [main]
    paths:
      - development/global_mammals_macro_pilot_response_request_v1_66.json
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate exact macro pilot request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("development/global_mammals_macro_pilot_response_request_v1_66.json").read_text())
          c=json.loads(Path("development/global_mammals_macro_pilot_response_contract_v1_65.json").read_text())
          assert r["status"]=="REQUEST_ONE_SHOT_CONTAMINATED_MACRO_MAMMAL_PILOT"
          assert r["routing_artifact_id"]==11060106528
          assert r["pilot_ids_sha256"]=="ac3898162331ce4217ea63d8b9330051acaa3a39ddca425cd0b48246a11caec0"
          assert r["confirmatory_ids_sha256"]=="afda05287599110c7248c5cb0c1931689a2aee40f8ff4ff5b76509aff5350715"
          assert r["macro_pilot_response_authorized"] is True
          assert r["confirmatory_response_authorized"] is False
          assert r["one_shot"] is True
          assert c["species_universe"]["minimum_presence"]==13
          assert c["species_universe"]["minimum_absence"]==13
          PY
      - name: Download exact frozen routing
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v152-pilot-routing-f5ae81b05aac3ce4c5db6f43ce41e89c1d14548c-36625810600
          path: build/global_mammals_v166/routing
          repository: zuizui0223/Structural
          run-id: 36625810600
          github-token: ${{ github.token }}
      - name: Prepare Dryad token
        env:
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
          DRYAD_TOKEN_FALLBACK: ${{ secrets.DRYAD_TOKEN }}
        run: |
          mkdir -p build/global_mammals_v166/output
          python scripts/prepare_dryad_token_v0_73.py             --github-env "$GITHUB_ENV"             --receipt build/global_mammals_v166/output/token_receipt.json
      - name: Consume only pilot occurrence rows
        run: |
          python scripts/run_global_mammals_macro_pilot_response_v1_65.py             --pilot-routing build/global_mammals_v166/routing/pilot_ids.csv             --confirmatory-routing build/global_mammals_v166/routing/confirmatory_ids.csv             --species-universe build/global_mammals_v166/output/pilot_species_universe.csv             --pilot-matrix build/global_mammals_v166/output/pilot_matrix.csv             --receipt build/global_mammals_v166/output/pilot_response_receipt.json
      - name: Enforce confirmatory seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/global_mammals_v166/output/pilot_response_receipt.json").read_text())
          assert x["status"]=="MACRO_MAMMAL_PILOT_RESPONSE_CONSUMED_AND_SPECIES_UNIVERSE_FROZEN"
          assert x["pilot_islands_decoded"]==1275
          assert x["confirmatory_islands_seen_routing_only"]==4126
          assert x["confirmatory_occurrence_values_decoded"]==0
          assert x["excluded_occurrence_values_decoded"]==0
          assert x["species_threshold_m"]==13
          assert x["pilot_response_consumed"] is True
          assert x["confirmatory_response_authorized"] is False
          assert x["fresh_status_restored"] is False
          PY
      - name: Upload macro pilot snapshot only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-mammals-v166-pilot-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/global_mammals_v166/output/token_receipt.json
            build/global_mammals_v166/output/pilot_species_universe.csv
            build/global_mammals_v166/output/pilot_matrix.csv
            build/global_mammals_v166/output/pilot_response_receipt.json
          if-no-files-found: warn
          retention-days: 30
