name: Global mammals Appendix2 metadata-link audit v0.5

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  metadata-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Audit Appendix2 metadata links only
        run: |
          mkdir -p build/global_mammals_appendix2_links
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          auth=json.loads(Path(
              "development/global_island_mammals_appendix2_metadata_link_audit_v0_5.json"
          ).read_text())
          headers={
              "Accept":"application/json",
              "X-API-Version":"2.1.0",
              "User-Agent":"Structural-global-mammals-link-audit/0.5"
          }
          def get_json(url):
              with urlopen(Request(url,headers=headers),timeout=60) as r:
                  return json.loads(r.read())

          manifest=get_json("https://datadryad.org/api/v2/versions/299966/files?per_page=100")
          rows=manifest["_embedded"]["stash:files"]
          matches=[x for x in rows if x.get("path")==auth["target_path"]]
          assert len(matches)==1
          row=matches[0]
          assert row.get("digest")==auth["frozen_sha256"]

          self_url=row["_links"]["self"]["href"]
          if self_url.startswith("/"):
              self_url="https://datadryad.org"+self_url
          detail=get_json(self_url)
          assert detail.get("path")==auth["target_path"]
          assert detail.get("digest")==auth["frozen_sha256"]

          def sanitize(x):
              if isinstance(x,dict):
                  return {str(k):sanitize(v) for k,v in x.items()}
              if isinstance(x,list):
                  return [sanitize(v) for v in x]
              if x is None or isinstance(x,(str,int,float,bool)):
                  return x
              return repr(x)

          out={
              "schema":"structural.global_island_mammals_appendix2_metadata_link_result.v0_5",
              "status":"metadata_link_surface_resolved",
              "manifest_file_object":sanitize(row),
              "detail_file_object":sanitize(detail),
              "self_url":self_url,
              "file_content_requests":0,
              "appendix1_content_requests":0,
              "response_values_opened":False,
              "counts_as_empirical_evidence":False
          }
          p=Path("build/global_mammals_appendix2_links/metadata_links.json")
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(p.read_text())
          PY

      - name: Assert zero content access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/global_mammals_appendix2_links/metadata_links.json").read_text())
          assert x["file_content_requests"]==0
          assert x["appendix1_content_requests"]==0
          assert x["response_values_opened"] is False
          print("metadata-only link audit complete")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: global-island-mammals-appendix2-metadata-links-v0-5
          path: build/global_mammals_appendix2_links/metadata_links.json
          if-no-files-found: error
          retention-days: 90
