name: BioMonI spider eight-site post-QA Event subset v1.307
on:
  push:
    paths:
      - ".github/workflows/biomoni-spider-eight-site-event-v1_307.yml"
      - "development/biomoni_spider_eight_site_source_gate_v1_307.json"
      - "scripts/biomoni_spider_eight_site_event_v1_307.py"
      - "tests/test_biomoni_spider_eight_site_event_v1_307.py"
  pull_request:
    paths:
      - ".github/workflows/biomoni-spider-eight-site-event-v1_307.yml"
      - "development/biomoni_spider_eight_site_source_gate_v1_307.json"
      - "scripts/biomoni_spider_eight_site_event_v1_307.py"
      - "tests/test_biomoni_spider_eight_site_event_v1_307.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-8-plot-geographical-match:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Prove strict 8 plots with 23 common sampling Events each and biological outcome sealed
        run: python -m pytest -q tests/test_biomoni_spider_eight_site_event_v1_307.py
      - name: Inspect only original v1.8 Spider and v1.7 Tree Event source identities
        run: |
          python scripts/biomoni_spider_eight_site_event_v1_307.py \
            --contract development/biomoni_spider_eight_site_source_gate_v1_307.json \
            --out biomoni_spider_eight_site_event_receipt_v1_307.json
      - name: Original 10-site terminal kept; no spider or tree taxa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("biomoni_spider_eight_site_event_receipt_v1_307.json").read_text())
          assert r["status"] in ("NEW_EXPLORATORY_EIGHT_PHYSICAL_PLOTS_EQUAL_SPIDER_METHODS_RESPONSE_SEALED","STOP_SPATIAL_QUALIFIED_EIGHT_PLOT_FRAME_NOT_FROZEN","STOP_SOURCE_METHOD_MULTIPLICITY_NOT_FROZEN")
          assert r["GEB_scientific_HOLD"] and not r["eBird_used"] and r["new_confirmatory_systems"]==0
          assert r["original_spider_Occurrence_rows_opened"]==0
          assert r["old_v1_303_and_304_full_ten_plot_gate_TERMINAL"]
          print("Source-only eight-site sampling diagnosis:",r["status"])
          PY
      - name: Retain only hashed source Event subset and source plot counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomoni-spider-eight-site-event-only-v1-307
          path: biomoni_spider_eight_site_event_receipt_v1_307.json
          if-no-files-found: warn
