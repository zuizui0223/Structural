name: AVONET DARs response-blind census

on:
  pull_request:
    branches: [main]
    paths:
      - "research/avonet_dars_archipelago/**"
      - ".github/workflows/avonet-dars-metadata-census.yml"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run response-blind AVONET/DARs source census
        run: python research/avonet_dars_archipelago/metadata_census_v0_1.py | tee avonet_dars_metadata_census.json
      - name: Assert species matrices remained sealed
        run: |
          python - <<'PY'
          import json
          x=json.load(open("avonet_dars_metadata_census.json"))
          assert x["status"] == "RESPONSE_SEALED_METADATA_ONLY"
          assert x["response_values_accessed"] is False
          assert x["dars_species_matrix_bytes_opened"] is False
          assert x["true_island_response_surface"]["content_opened"] is False
          pred=x["response_blind_predictor_surface"]["predictor_content"]
          assert pred["content_opened"] is True
          assert pred["role"].startswith("response-independent")
          assert pred["missing_iso"] == 0
          assert pred["missing_mean_dist"] == 0
          gid=x["global_island_database_schema"]
          assert gid["feature_values_opened"] is False
          assert gid["geometry_values_opened"] is False
          assert isinstance(gid["feature_count"], int) and gid["feature_count"] > 0
          assert x["avonet_or_trait_surface"]["trait_values_opened"] is False
          assert x["readme_contract"]["presence_absence_matrix_declared"] is True
          assert x["readme_contract"]["predictors_declared"] is True
          assert x["readme_contract"]["avonet_declared"] is True
          assert len(x["source_fingerprint"]) == 64
          print(
              "AVONET_DARS_RESPONSE_SEALED",
              x["true_island_response_surface"]["csv_file_count"],
              pred["type_counts"]["Type_V_fine"],
              gid["feature_count"],
              x["source_fingerprint"],
          )
          PY
      - name: Freeze response-blind bird archipelago partition
        run: |
          python research/avonet_dars_archipelago/freeze_partition_v0_1.py \
            --census avonet_dars_metadata_census.json \
            | tee avonet_dars_partition.json
      - name: Assert balanced confirmatory H2 panel
        run: |
          python - <<'PY'
          import json
          x=json.load(open("avonet_dars_partition.json"))
          assert x["status"] == "RESPONSE_SEALED_PARTITIONS_FROZEN"
          assert x["response_values_accessed"] is False
          assert x["response_matrix_content_opened"] is False
          assert x["pilot_selection"]["pilot_count"] == 5
          assert x["confirmatory_counts"]["total"] == 16
          assert x["confirmatory_counts"]["Oceanic"] == 8
          assert x["confirmatory_counts"]["C.Shelf"] == 8
          assert x["confirmatory_counts"]["extreme_q75"] >= 2
          assert x["confirmatory_counts"]["nonextreme_q75"] >= 8
          assert x["pilot_response_authorized"] is False
          assert x["confirmatory_response_authorized"] is False
          print(
              "BIRD_PARTITION_FROZEN",
              [r["dataset"] for r in x["pilot"]],
              x["confirmatory_counts"],
              x["partition_fingerprint"],
          )
          PY
      - name: Install predictor-only numerical dependency
        run: python -m pip install numpy
      - name: Freeze AVONET HWI predictor
        run: |
          python research/avonet_dars_archipelago/freeze_hwi_predictor_v0_1.py \
            | tee avonet_hwi_predictor.json
      - name: Assert trait predictor opened without response
        run: |
          python - <<'PY'
          import json
          x=json.load(open("avonet_hwi_predictor.json"))
          assert x["status"] == "PREDICTOR_OPEN_RESPONSE_SEALED"
          assert x["response_values_accessed"] is False
          assert x["dars_species_matrices_opened"] is False
          assert x["columns"]["HWI"] == "Hand-Wing Index"
          assert x["HWI_nonmissing"] > 9000
          assert x["HWI_missing"] >= 0
          assert len(x["trait_fingerprint"]) == 64
          print("AVONET_HWI_PREDICTOR_FROZEN", x["rows"], x["HWI_nonmissing"], x["trait_fingerprint"])
          PY
      - name: Freeze HWI occupancy protocol before bird response
        run: |
          python research/avonet_dars_archipelago/freeze_hwi_occupancy_protocol_v0_1.py \
            --census avonet_dars_metadata_census.json \
            --partition avonet_dars_partition.json \
            --trait avonet_hwi_predictor.json \
            | tee avonet_dars_hwi_protocol.json
      - name: Assert bird protocol response-sealed and estimable
        run: |
          python - <<'PY'
          import json
          x=json.load(open("avonet_dars_hwi_protocol.json"))
          assert x["status"] == "FROZEN_BEFORE_BURNED_PILOT_RESPONSE"
          assert x["response_values_accessed"] is False
          assert x["pilot_response_opened"] is False
          assert x["confirmatory_response_opened"] is False
          assert x["second_stage"]["design_audit"]["full_rank"] is True
          assert x["second_stage"]["design_audit"]["condition"] < 20
          assert x["nonrescuing_sensitivity"]["design_audit"]["full_rank"] is True
          assert x["second_stage"]["cell_counts"] == {
              "Oceanic|nonextreme":4,
              "Oceanic|extreme":4,
              "C.Shelf|nonextreme":7,
              "C.Shelf|extreme":1,
          }
          b=x["second_stage"]["bootstrap"]
          assert b["replicates"] == 10000
          assert len(b["accepted_draws_sha256"]) == 64
          assert x["burned_pilot_gate"]["effect_or_rho_computation_allowed"] is False
          assert x["pilot_response_authorized"] is False
          assert x["confirmatory_response_authorized"] is False
          assert len(x["protocol_fingerprint"]) == 64
          print("BIRD_HWI_PROTOCOL_FROZEN", x["protocol_fingerprint"], b)
          PY
      - name: Replay committed bird pre-response lock
        run: |
          python - <<'PY'
          import json
          lock=json.load(open("research/avonet_dars_archipelago/pre_response_lock_v0_1.json"))
          census=json.load(open("avonet_dars_metadata_census.json"))
          part=json.load(open("avonet_dars_partition.json"))
          trait=json.load(open("avonet_hwi_predictor.json"))
          protocol=json.load(open("avonet_dars_hwi_protocol.json"))
          assert lock["schema"] == "structural.avonet_dars_hwi_pre_response_lock.v0_1"
          assert lock["status"] == "FROZEN_QUALIFIED_BEFORE_PILOT_RESPONSE"
          assert lock["response_values_accessed"] is False
          assert lock["species_presence_absence_matrices_opened"] is False
          assert lock["source_fingerprint"] == census["source_fingerprint"]
          assert lock["partition_fingerprint"] == part["partition_fingerprint"]
          assert lock["trait_fingerprint"] == trait["trait_fingerprint"]
          assert lock["protocol_fingerprint"] == protocol["protocol_fingerprint"]
          assert lock["pilot_surface"]["fingerprint"] == part["response_surface_fingerprints"]["pilot"]
          assert lock["confirmatory_surface"]["fingerprint"] == part["response_surface_fingerprints"]["confirmatory"]
          assert lock["bootstrap"]["accepted_draws_sha256"] == protocol["second_stage"]["bootstrap"]["accepted_draws_sha256"]
          assert lock["bootstrap"]["candidate_draws_attempted"] == protocol["second_stage"]["bootstrap"]["candidate_draws_attempted"]
          assert lock["authorization"]["pilot_response_authorized"] is True
          assert lock["authorization"]["confirmatory_response_authorized"] is False
          assert lock["authorization"]["pilot_rho_computation_authorized"] is False
          assert lock["authorization"]["pilot_model_fit_authorized"] is False
          print("BIRD_PRE_RESPONSE_LOCK_REPLAY_OK", lock["protocol_fingerprint"])
          PY
      - name: Assert metadata CI contains no bird matrix fetch
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/avonet-dars-metadata-census.yml").read_text()
          pilot_opener="run_"+"burned_pilot"
          confirm_opener="open_"+"confirmatory"
          assert pilot_opener not in wf
          assert confirm_opener not in wf
          print("BIRD_RESPONSE_REMAINS_SEALED")
          PY
