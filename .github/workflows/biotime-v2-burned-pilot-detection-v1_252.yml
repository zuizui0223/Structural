name: BioTIME v2 burned-pilot species detection v1.252

on:
  push:
    paths:
      - ".github/workflows/biotime-v2-burned-pilot-detection-v1_252.yml"
      - "scripts/biotime_v2_burned_pilot_detection_v1_252.R"
      - "tests/test_biotime_v2_burned_pilot_detection_v1_252.R"
      - "development/biotime_v2_burned_pilot_detection_protocol_v1_252.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install fixed analysis dependencies
        run: Rscript -e 'install.packages(c("data.table","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Run source-free 00 / 01 / 10 / 11 regression fixture
        run: Rscript tests/test_biotime_v2_burned_pilot_detection_v1_252.R
      - name: Retrieve exact MD5-verified official source bytes
        run: |
          python scripts/biotime_v2_full_source_transport_v1_250.py \
            --out-rds biotime_v2_query_15April25.rds \
            --out-meta biotime_v2_metadata_15April25.csv \
            --out-receipt biotime_source_transport_v1_252.json
      - name: Read ONLY the pre-frozen 19 burned-pilot studies and score observed detection transitions
        run: |
          Rscript scripts/biotime_v2_burned_pilot_detection_v1_252.R \
            biotime_v2_query_15April25.rds \
            development/biotime_v2_pilot_confirmatory_split_v1_251.json \
            development/biotime_v2_burned_pilot_detection_protocol_v1_252.json \
            biotime_v2_pilot_detected_turnover_v1_252.json \
            biotime_v2_pilot_by_study_v1_252.csv
      - name: Fail closed on off-scope study counts or transition inconsistencies
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          j=json.loads(Path("biotime_v2_pilot_detected_turnover_v1_252.json").read_text())
          assert j["schema"]=="structural.biotime_burned_pilot_detection.v1_252"
          assert j["pilot_study_count"]==19
          assert j["holdout_study_species_responses_accessed"]==0
          assert j["GEB_scientific_HOLD"]
          t=j["overall"]
          assert t["eligible_species_pair_cells"]==sum(t[f"n{s}"] for s in ("00","01","10","11"))
          with open("biotime_v2_pilot_by_study_v1_252.csv",newline="",encoding="utf-8") as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==19 and len({r["study"] for r in rows})==19
          assert not any("taxon" in col.lower() or "species_name" in col.lower() for col in rows[0])
          print("PILOT ONLY", {k:t[k] for k in ("eligible_species_pair_cells","n00","n01","n10","n11","n01_2plus")})
          PY
      - name: Retain aggregated 19-study results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biotime-v2-burned-pilot-detections-v1-252
          path: |
            biotime_source_transport_v1_252.json
            biotime_v2_pilot_detected_turnover_v1_252.json
            biotime_v2_pilot_by_study_v1_252.csv
          if-no-files-found: warn
      - name: Destroy raw RDS and source metadata on runner
        if: always()
        run: |
          rm -f biotime_v2_query_15April25.rds \
            biotime_v2_query_15April25.rds.partial \
            biotime_v2_metadata_15April25.csv
