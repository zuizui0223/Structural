name: Azores 2016 source-locked Macaronesian loss/persistence crosswalk v1.268

on:
  push:
    paths:
      - ".github/workflows/azores2016-S1-distribution-join-v1_268.yml"
      - "development/azores2016_S1_distribution_crosswalk_contract_v1_268.json"
      - "scripts/azores2016_s1_loss_presence_crosswalk_v1_268.py"
      - "tests/test_azores2016_s1_loss_presence_crosswalk_v1_268.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  azores-case-presence-only:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install regression framework
        run: python -m pip install pytest
      - name: Verify synthetic native/current-presence versus historic-loss matching and ambiguity handling
        run: python -m pytest -q tests/test_azores2016_s1_loss_presence_crosswalk_v1_268.py
      - name: Join separately SHA-locked 2016 checklist and already-burned 2025 S1 ONLY
        run: |
          python scripts/azores2016_s1_loss_presence_crosswalk_v1_268.py \
            --contract development/azores2016_S1_distribution_crosswalk_contract_v1_268.json \
            --out azores2016_S1_current_distribution_coverage_v1_268.json
      - name: Verify exact 2016 source, 24 historical loss pairs, no imputed zeros
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('azores2016_S1_current_distribution_coverage_v1_268.json').read_text())
          assert j["status"]=="SOURCE_AUTHENTICATED_AZORES2016_S1_COVERAGE_ANALYSIS"
          assert j["source_gbif2016_sha256"]=="07be180d52f08e5051d63c5364dc856d8b0e811a83a9c26c920780138bb3fc79"
          assert j["S1_strict_azores_pairs"]==24
          assert j["crosswalk"]["strict_S1_azores_source_taxa"]==20
          assert j["crosswalk"]["2016_missing_is_never_filled_as_absent"]
          assert j["S2_S3_S4_values_opened"]==0
          assert j["original_mammal_BioTIME_RLS_holdouts_opened"]==0
          assert j["GEB_scientific_HOLD"]
          print("Observed current checklist coverage, not historical loss risk or biological rescue")
          PY
      - name: Persist aggregated original-source coverage and stop receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores2016-S1-local-loss-current-presence-coverage-v1-268
          path: azores2016_S1_current_distribution_coverage_v1_268.json
          if-no-files-found: warn
