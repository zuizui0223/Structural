name: Response-opaque CamTrapAsia external mammal support adjudication v1.247
on:
  push:
    branches: [science/heldout-geographic-search-index-v1-235]
    paths:
      - development/camtrapasia_external_support_contract_v1_247.json
permissions:
  contents: read
jobs:
  source-freeze-adjudication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_camtrapasia_external_support_gate_v1_247.py
      - name: Decide independent mammal external-scoring eligibility without biology
        run: |
          python scripts/camtrapasia_external_support_gate_v1_247.py development/camtrapasia_published_mammal_taxon_overlap_freeze_v1_238.json development/camtrapasia_original_island_area_consistency_freeze_v1_246.json --out build/v247/support.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v247-camtrapasia-original-mammal-field-support-stop
          path: build/v247/support.json
          retention-days: 21
