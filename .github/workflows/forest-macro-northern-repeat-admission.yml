name: "Forest macro northern repeated stands and EMEND admission"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/forest-macro-northern-repeat-admission.yml"
permissions:
  contents: read
jobs:
  source-routing-only:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install openpyxl==3.1.5
      - run: python analysis/forest_macro_global/northern_repeat_stand_emend_admission.py --test
      - run: python analysis/forest_macro_global/northern_repeat_stand_emend_admission.py --out northern_repeat_admission/receipt.json
      - name: Validate source-only diagnostics
        run: |
          python - <<'PY'
          import json
          r=json.load(open("northern_repeat_admission/receipt.json"))
          assert r["schema"]=="structural.northern_repeat_admission.v1"
          assert r["original_biological_cells_interpreted"]==r["new_ecological_effects_scored"]==0
          assert not r["raw_source_exported"]
          assert r["Finland"]=="HTTP401_HOLD_NO_RETRY"
          assert set(r["sources"])=={"Estonia","EMEND"}
          for s in r["sources"].values():
              assert "status" in s
          print("NORTHERN_REPEAT_ADMISSION_STATUSES",{k:v["status"] for k,v in r["sources"].items()})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: northern-repeat-stand-emend-admission
          path: northern_repeat_admission/receipt.json
          if-no-files-found: error
