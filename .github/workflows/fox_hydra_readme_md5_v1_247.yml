name: Fox 2017 exact author README MD5-only source gate v1.247
on:
  push:
    branches: [science/spatial-hydra-counterexample-v1-246]
    paths:
      - scripts/fox_hydra_readme_md5_v1_247.py
      - tests/test_fox_hydra_readme_md5_v1_247.py
      - .github/workflows/fox_hydra_readme_md5_v1_247.yml
permissions:
  contents: read
jobs:
  author-original-document-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_fox_hydra_readme_md5_v1_247.py
      - run: |
          python scripts/fox_hydra_readme_md5_v1_247.py --out build/v247/source_readme.json
          python - <<'PY'
          import json
          r=json.load(open("build/v247/source_readme.json"))
          assert r["experimental_observation_rows_opened"]==0
          assert r["new_confirmatory_systems"]==0
          assert r["status"] in ("PASS_ORIGINAL_README_MD5_AND_METHOD_DESCRIPTIONS_ONLY",
                                 "TECHNICAL_STOP_ORIGINAL_README_TRANSPORT")
          assert r["GEB_scientific_HOLD"]
          print("Fox source README original MD5/transport:",r["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v247-fox-hydra-original-readme
          path: build/v247/source_readme.json
          retention-days: 21
