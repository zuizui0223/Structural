name: Hopson assay flag domain audit v1.228
on:
  push:
    branches: [science/temporal-rescue-design-intake-v1-221]
    paths:
      - scripts/hopson_prey_volume_schema_v1_228.py
      - tests/test_hopson_prey_volume_schema_v1_228.py
      - development/hopson_prey_assay_schema_contract_v1_228.json
      - .github/workflows/hopson_prey_volume_schema_v1_228.yml
permissions:
  contents: read
jobs:
  assay-schema-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_hopson_prey_volume_schema_v1_228.py
      - name: Frozen publisher bytes; volume flag metadata only
        run: |
          python scripts/hopson_prey_volume_schema_v1_228.py --out build/v228/source_schema.json
          python - <<'PY'
          import json
          r=json.load(open("build/v228/source_schema.json"))
          assert r["n_published_rows"]==4830
          assert r["original_v227_fail_closed"]
          assert not r["raw_eupl_tet_values_used"]
          assert not r["prey_model_replayed"]
          print("Assay domain audit complete; no v1.227 score authorized:",r["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v228-hopson-assay-flag-domain
          path: build/v228/source_schema.json
          retention-days: 21
