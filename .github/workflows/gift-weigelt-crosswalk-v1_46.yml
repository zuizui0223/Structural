name: GIFT-Weigelt strict crosswalk v1.46
on:
  push:
    branches: [main]
    paths:
      - development/gift_weigelt_crosswalk_request_v1_46.json
permissions:
  contents: read
  actions: read
jobs:
  crosswalk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate response-independent request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("development/gift_weigelt_crosswalk_request_v1_46.json").read_text())
          c=json.loads(Path("development/gift_weigelt_crosswalk_contract_v1_45.json").read_text())
          assert r["gift_geography_artifact_id"]==11059270235
          assert r["weigelt_safe_artifact_id"]==10930234623
          assert r["plant_species_composition_authorized"] is False
          assert c["input_population"]["gift_whole_islands"]==1373
          assert c["one_to_one_rule"]["required"] is True
          assert r["one_shot"] is True
          PY
      - name: Download exact GIFT geography artifact
        uses: actions/download-artifact@v4
        with:
          name: gift-v138-geography-898f73cc957f7b58f075dd2fcef92ab00f401e8e-36621638377
          path: build/gift_weigelt_v146/gift
          repository: zuizui0223/Structural
          run-id: 36621638377
          github-token: ${{ github.token }}
      - name: Download exact Weigelt safe artifact
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-weigelt-safe-rows-v0-60
          path: build/gift_weigelt_v146/weigelt
          repository: zuizui0223/Structural
          run-id: 36316161135
          github-token: ${{ github.token }}
      - name: Verify exact inputs
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          checks={
            "build/gift_weigelt_v146/gift/gift_whole_island_geography.csv":"385c4aa0860a90f9a3805455d7270797f3eab3a8ab36a7425a720359accf22c5",
            "build/gift_weigelt_v146/weigelt/weigelt_islanddata_safe_v0_60.csv":"ebb4b54cc9b056a1ea61fcae3a53bf578c0e47488e4a496d40fceaeca4f4b8af",
          }
          for p,s in checks.items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==s,(p,s)
          PY
      - name: Execute strict response-independent crosswalk
        run: |
          mkdir -p build/gift_weigelt_v146/output
          python scripts/crosswalk_gift_weigelt_v1_45.py             build/gift_weigelt_v146/gift/gift_whole_island_geography.csv             build/gift_weigelt_v146/weigelt/weigelt_islanddata_safe_v0_60.csv             --matched build/gift_weigelt_v146/output/gift_weigelt_matched.csv             --excluded build/gift_weigelt_v146/output/gift_weigelt_excluded.csv             --receipt build/gift_weigelt_v146/output/crosswalk_receipt.json
      - name: Enforce response ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/gift_weigelt_v146/output/crosswalk_receipt.json").read_text())
          assert x["status"]=="STRICT_GIFT_WEIGELT_CROSSWALK_COMPLETE"
          assert x["input_gift_entities"]==1373
          assert x["one_to_one"] is True
          assert x["species_composition_opened"] is False
          assert x["mammal_Appendix1_opened"] is False
          assert x["species_response_authorized"] is False
          PY
      - name: Upload strict crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: gift-v146-weigelt-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/gift_weigelt_v146/output/gift_weigelt_matched.csv
            build/gift_weigelt_v146/output/gift_weigelt_excluded.csv
            build/gift_weigelt_v146/output/crosswalk_receipt.json
          if-no-files-found: error
          retention-days: 30
