name: BioMonI spider original Event coordinate and date quality v1.306
on:
  push:
    paths:
      - ".github/workflows/biomoni-spider-coordinate-date-diagnostic-v1_306.yml"
      - "development/biomoni_spider_coord_date_quality_contract_v1_306.json"
      - "scripts/biomoni_spider_coord_date_quality_v1_306.py"
      - "tests/test_biomoni_spider_coord_date_quality_v1_306.py"
  pull_request:
    paths:
      - ".github/workflows/biomoni-spider-coordinate-date-diagnostic-v1_306.yml"
      - "development/biomoni_spider_coord_date_quality_contract_v1_306.json"
      - "scripts/biomoni_spider_coord_date_quality_v1_306.py"
      - "tests/test_biomoni_spider_coord_date_quality_v1_306.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-only-location-quality-before-species:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install tests
        run: python -m pip install pytest
      - name: Check all location/date formatting logic without biological rows
        run: python -m pytest -q tests/test_biomoni_spider_coord_date_quality_v1_306.py
      - name: Original wood and spider source-locked Event geographic quality only
        run: |
          python scripts/biomoni_spider_coord_date_quality_v1_306.py \
            --protocol development/biomoni_spider_coord_date_quality_contract_v1_306.json \
            --out biomoni_spider_coordinate_date_result_v1_306.json
      - name: Require original source Event audit and old terminal STOP
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("biomoni_spider_coordinate_date_result_v1_306.json").read_text())
          assert r["status"]=="SOURCE_ONLY_LOCATION_DATE_QUALITY_DIAGNOSTIC_V1_303_REMAINS_TERMINAL"
          assert r["original_exact_Terceira_shared_site_IDs"]==10
          assert r["original_spider_Occurrence_rows_opened"]==0
          assert r["original_woody_Occurrence_rows_reopened"]==0
          assert r["old_v1_303_original_time_and_coordinate_gate_status"]=="TERMINAL"
          assert r["new_confirmatory_systems"]==0 and r["GEB_scientific_HOLD"] and not r["eBird_used"]
          assert r["original_site_IDs_geographic_coordinates_and_species_exported"] is False
          print("PASS: original species untouched, spatial/date diagnostic only")
          PY
      - name: Upload anonymized source Event geographic QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biomoni-spider-source-only-coordinate-date-v1-306
          path: biomoni_spider_coordinate_date_result_v1_306.json
          if-no-files-found: warn
