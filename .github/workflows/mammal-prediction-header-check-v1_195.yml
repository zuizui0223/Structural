name: Mammal predictor binary schema v1.195 CI
on:
  pull_request:
    paths:
      - scripts/audit_frozen_prediction_headers_v1_195.py
      - tests/test_prediction_headers_v1_195.py
  push:
    branches:
      - closure/ala-one-shot-schema-stop-v1-195
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_ala_terminal_stop_v1_195.py tests/test_prediction_headers_v1_195.py
