name: Original island area versus source-version GADM polygon area v1.246
on:
  push:
    branches: [science/heldout-geographic-search-index-v1-235]
    paths:
      - development/camtrapasia_original_island_area_contract_v1_246.json
permissions:
  contents: read
  actions: read
jobs:
  area-grain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest shapely pyproj
          python -m pytest -q tests/test_camtrapasia_original_area_vs_polygon_v1_246.py
      - uses: actions/download-artifact@v4
        with:
          name: structural-v241-camera-study-15-safe-site-geography
          path: build/v246/candidate
          repository: zuizui0223/Structural
          run-id: 37889725368
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v123-appendix2-safe-ea565b98419f8aacde9fb13c26724bb385635b95-36524988694
          path: build/v246/original
          repository: zuizui0223/Structural
          run-id: 36524988694
          github-token: ${{ github.token }}
      - run: |
          python scripts/camtrapasia_original_island_vs_GADM_area_v1_246.py build/v246/candidate/result.json build/v246/original/appendix2_safe_rows.csv --out build/v246/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v246-original-island-vs-GADM-component-area
          path: build/v246/result.json
          retention-days: 21
