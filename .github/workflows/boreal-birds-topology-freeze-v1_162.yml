name: Boreal birds topology freeze v1.162

on:
  push:
    branches:
      - develop/boreal-birds-topology-sensitivity-v1-162
    paths:
      - development/boreal_birds_topology_freeze_request_v1_162.json

permissions:
  contents: write

jobs:
  freeze-response-independent-topology:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/boreal-birds-topology-sensitivity-v1-162
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("development/boreal_birds_topology_freeze_request_v1_162.json").read_text())
          assert x["schema"]=="structural.boreal_birds_topology_freeze_request.v1_162"
          assert x["status"]=="REQUEST_RESPONSE_INDEPENDENT_TOPOLOGY_FREEZE"
          assert x["bird_response_values_opened"] is False
          assert x["ebird_used"] is False
          PY
      - name: Run focused tests
        run: python -m pytest -q tests/test_boreal_birds_topology_sensitivity_v1_162.py
      - name: Freeze null ensemble and H surface
        run: |
          python scripts/freeze_boreal_birds_topology_nulls_v1_162.py \
            --output development/boreal_birds_topology_null_freeze_v1_162.json
      - name: Verify response boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("development/boreal_birds_topology_null_freeze_v1_162.json")
          x=json.loads(p.read_text())
          assert x["status"]=="RESPONSE_INDEPENDENT_TOPOLOGY_NULLS_AND_H_SURFACE_FROZEN"
          assert len(x["null_ensemble"])==20
          assert len({z["edge_set_sha256"] for z in x["null_ensemble"]})==20
          assert x["bird_response_values_opened"]==0
          assert x["pilot_response_opened"] is False
          assert x["confirmatory_response_opened"] is False
          PY
      - name: Commit exact response-independent freeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development/boreal_birds_topology_null_freeze_v1_162.json
          git commit -m "Freeze boreal bird topology null ensemble v1.162"
          git push origin HEAD:develop/boreal-birds-topology-sensitivity-v1-162
