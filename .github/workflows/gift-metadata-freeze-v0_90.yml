name: GIFT metadata freeze v0.90

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-24.04
    steps:
      - name: Require manual execution from main
        run: |
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout frozen Structural code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install pinned metadata dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::GIFT@1.3.4
            any::jsonlite
            any::digest

      - name: Freeze metadata only
        run: |
          mkdir -p build/gift_v090
          Rscript scripts/freeze_gift_metadata_v0_90.R             --output-metadata build/gift_v090/gift_island_list_metadata.csv             --receipt build/gift_v090/gift_metadata_receipt.json

      - name: Assert metadata-only artifact surface
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("build/gift_v090")
          allowed = {
              "gift_island_list_metadata.csv",
              "gift_metadata_receipt.json",
          }
          observed = {p.name for p in root.iterdir() if p.is_file()}
          if observed != allowed:
              raise SystemExit(f"unexpected GIFT artifact surface: {sorted(observed)}")
          PY

      - name: Upload frozen GIFT metadata
        uses: actions/upload-artifact@v4
        with:
          name: gift-v090-metadata-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/gift_v090/gift_island_list_metadata.csv
            build/gift_v090/gift_metadata_receipt.json
          if-no-files-found: error
          retention-days: 14
