name: Helgeland published breeding source crosswalk v1.233
on:
  push:
    branches: [science/helgeland-archipelago-source-intake-v1-230]
    paths:
      - scripts/helgeland_reproduction_identity_crosswalk_v1_233.py
      - tests/test_helgeland_reproduction_identity_crosswalk_v1_233.py
      - development/helgeland_reproduction_crosswalk_contract_v1_233.json
      - .github/workflows/helgeland_reproduction_crosswalk_v1_233.yml
permissions:
  contents: read
jobs:
  source-identity-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_helgeland_reproduction_identity_crosswalk_v1_233.py
      - uses: actions/checkout@v4
        with:
          repository: torhanssonfrank/DensityRegulationHouseSparrows
          ref: a4e1c9ebc1148d7c7aca2bb5730b9d7104094fe5
          path: build/author
          persist-credentials: false
      - run: |
          python scripts/helgeland_reproduction_identity_crosswalk_v1_233.py build/author --out build/v233/receipt.json
          python - <<'PY'
          import json
          d=json.load(open("build/v233/receipt.json"))
          assert d["model_islands"]==11
          assert d["extra_R_index_column_correctly_dropped"]
          assert not d["author_producer_nestling_and_recruits_numerical_values_accessed"]
          assert d["GEB_scientific_HOLD"]
          print("v1.233 original producer ID join feasibility only; no fitness model")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v233-helgeland-reproduction-join
          path: build/v233/receipt.json
          retention-days: 21
