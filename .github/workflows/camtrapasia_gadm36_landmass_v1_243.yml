name: Pin GADM 3.6 country land components for 15 camera candidate sites v1.243
on:
  push:
    branches: [science/heldout-geographic-search-index-v1-235]
    paths:
      - development/camtrapasia_gadm36_landmass_contract_v1_243.json
permissions:
  contents: read
  actions: read
jobs:
  GADM36-country-landmass:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest shapely
          python -m pytest -q tests/test_camtrapasia_gadm36_landmass_v1_243.py
      - uses: actions/download-artifact@v4
        with:
          name: structural-v241-camera-study-15-safe-site-geography
          path: build/v243/candidate
          repository: zuizui0223/Structural
          run-id: 37889725368
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v123-appendix2-safe-ea565b98419f8aacde9fb13c26724bb385635b95-36524988694
          path: build/v243/original
          repository: zuizui0223/Structural
          run-id: 36524988694
          github-token: ${{ github.token }}
      - name: Check exact GADM v3.6 country land components for camera survey and mammal centroids
        run: |
          python scripts/check_camtrapasia_gadm36_landmass_v1_243.py build/v243/candidate/result.json build/v243/original/appendix2_safe_rows.csv --out build/v243/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v243-GADM36-study-to-original-island-landmass
          path: build/v243/result.json
          retention-days: 21
