name: Zenodo 318 mammal occurrence row-structure probe

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  row-structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: List row and cell structure without values
        run: |
          mkdir -p build/zenodo_318_mammals_row_structure
          python - <<'PY'
          import hashlib, io, json, re, zipfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET

          auth=json.loads(Path(
              "development/zenodo_318_island_mammals_row_structure_probe_v0_4.json"
          ).read_text())
          spec=auth["file"]
          req=Request(spec["url"],headers={"User-Agent":"Structural-zenodo-318-row-structure/0.4"},method="GET")
          with urlopen(req,timeout=90) as r:
              raw=r.read()
          assert len(raw)==spec["size_bytes"]
          assert hashlib.md5(raw).hexdigest()==spec["md5"]

          NS_MAIN="{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
          NS_REL="{http://schemas.openxmlformats.org/officeDocument/2006/relationships}"
          NS_PKG="{http://schemas.openxmlformats.org/package/2006/relationships}"

          with zipfile.ZipFile(io.BytesIO(raw)) as zf:
              wb=ET.fromstring(zf.read("xl/workbook.xml"))
              rels=ET.fromstring(zf.read("xl/_rels/workbook.xml.rels"))
              relmap={r.attrib["Id"]:r.attrib["Target"] for r in rels.findall(NS_PKG+"Relationship")}
              xmlb=None
              for s in wb.find(NS_MAIN+"sheets"):
                  if s.attrib["name"]=="occurrence":
                      target=relmap[s.attrib[NS_REL+"id"]].lstrip("/")
                      if not target.startswith("xl/"): target="xl/"+target
                      xmlb=zf.read(target)
                      break
              assert xmlb is not None

          row_tags=list(re.finditer(br"<row\b([^>]*)>",xmlb))
          rows=[]
          for m in row_tags[:12]:
              attrs=m.group(1)
              rm=re.search(br'\br=\"([^\"]+)\"',attrs)
              rownum=int(rm.group(1)) if rm else None
              start=m.start()
              end=xmlb.find(b"</row>",m.end())
              assert end>=0
              rb=xmlb[start:end+6]
              cells=[]
              for cm in re.finditer(br"<c\b([^>]*)",rb):
                  a=cm.group(1)
                  refm=re.search(br'\br=\"([^\"]+)\"',a)
                  tm=re.search(br'\bt=\"([^\"]+)\"',a)
                  cells.append({
                      "cell":refm.group(1).decode("ascii") if refm else None,
                      "type":tm.group(1).decode("ascii") if tm else None
                  })
              rows.append({
                  "row":rownum,
                  "cell_count":len(cells),
                  "cells":cells
              })

          out={
              "schema":"structural.zenodo_318_island_mammals_row_structure_result.v0_4",
              "status":"cell_structure_only_complete",
              "first_rows":rows,
              "cell_values_decoded":0,
              "rows_semantically_parsed":0,
              "response_values_opened":False
          }
          p=Path("build/zenodo_318_mammals_row_structure/row_structure.json")
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps({
              "rows":[{"row":r["row"],"cell_count":r["cell_count"],"first_cells":r["cells"][:8]} for r in rows],
              "cell_values_decoded":0,
              "response_values_opened":False
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: zenodo-318-island-mammals-row-structure-v0-4
          path: build/zenodo_318_mammals_row_structure/row_structure.json
          if-no-files-found: error
          retention-days: 90
