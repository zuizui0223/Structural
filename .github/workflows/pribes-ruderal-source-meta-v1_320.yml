name: PRIBES independent ruderal seven-island archive schema-only v1.320
on:
  push:
    paths:
      - ".github/workflows/pribes-ruderal-source-meta-v1_320.yml"
      - "development/pribes_independent_ruderal_source_protocol_v1_320.json"
      - "scripts/pribes_original_opaque_metadata_v1_320.py"
      - "tests/test_pribes_original_opaque_metadata_v1_320.py"
  pull_request:
    paths:
      - ".github/workflows/pribes-ruderal-source-meta-v1_320.yml"
      - "development/pribes_independent_ruderal_source_protocol_v1_320.json"
      - "scripts/pribes_original_opaque_metadata_v1_320.py"
      - "tests/test_pribes_original_opaque_metadata_v1_320.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-archive-meta-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install pytest
      - name: Prove source schema cannot reveal original habitat or species responses
        run: python -m pytest -q tests/test_pribes_original_opaque_metadata_v1_320.py
      - name: Read only official original version 1.3 ZIP directory and meta.xml
        run: |
          python scripts/pribes_original_opaque_metadata_v1_320.py \
            --protocol development/pribes_independent_ruderal_source_protocol_v1_320.json \
            --out pribes_source_meta_only_v1_320.json
      - name: Preserve original ecology source-response seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("pribes_source_meta_only_v1_320.json").read_text(encoding="utf-8"))
          assert r["status"] in ("PRIBES_SOURCE_SCHEMA_ELIGIBLE_EVENT_AND_TAXON_VALUES_SEALED",
                                 "PRIBES_SOURCE_SCHEMA_HOLD_BEFORE_SOURCE_SITE_VALUES")
          assert r["original_Event_rows_opened"]==0
          assert r["original_Occurrence_rows_opened"]==0
          assert r["no_BALA_original_biological_source_access"]
          assert r["GEB_scientific_HOLD"] and not r["eBird_used"]
          assert r["new_confirmatory_systems"]==0
          print("Source archive SHA256",r["original_pribes_v1_3_zip_sha256"])
          print("Source-only original taxonomic roles:",r["status"])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pribes-original-version-1-3-schema-only-v1-320
          path: pribes_source_meta_only_v1_320.json
          if-no-files-found: warn
