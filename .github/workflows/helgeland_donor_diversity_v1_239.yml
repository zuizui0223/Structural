name: Helgeland observed donor concentration from frozen migration edges v1.239
on:
  push:
    branches: [science/helgeland-archipelago-source-intake-v1-230]
    paths:
      - scripts/helgeland_observed_donor_diversity_v1_239.py
      - tests/test_helgeland_observed_donor_diversity_v1_239.py
      - development/helgeland_observed_donor_diversity_contract_v1_239.json
      - development/helgeland_natal_resight_result_freeze_v1_231.json
      - .github/workflows/helgeland_donor_diversity_v1_239.yml
permissions:
  contents: read
jobs:
  retrospective-frozen-edges:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_helgeland_observed_donor_diversity_v1_239.py
      - name: Verify frozen v1.231 and compute descriptive supply distribution
        run: |
          python scripts/helgeland_observed_donor_diversity_v1_239.py development/helgeland_natal_resight_result_freeze_v1_231.json --out build/v239/donor_network.json
          python - <<'PY'
          import json
          d=json.load(open("build/v239/donor_network.json"))
          assert d["periods"]["historical"]["total_observed_firstyear_immigrants"]==259
          assert d["periods"]["later"]["total_observed_firstyear_immigrants"]==173
          assert len(d["periods"]["later"]["all_recipient_islands"])==11
          assert not d["new_confirmatory_evidence"]
          assert d["GEB_scientific_HOLD"]
          print("Frozen recorded-source diversity only, no demographic rescue prediction")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v239-helgeland-observed-source-diversity
          path: build/v239/donor_network.json
          retention-days: 21
