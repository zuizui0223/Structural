name: Global mammals original79 topology audit v1.116

on:
  push:
    branches: [main]
    paths:
      - development/global_mammals_original79_topology_audit_request_v1_116.json

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact numerics
        run: python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.3.3

      - name: Validate frozen-output-only audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("development/global_mammals_original79_topology_audit_contract_v1_116.json").read_text())
          r=json.loads(Path("development/global_mammals_original79_topology_audit_request_v1_116.json").read_text())
          assert r["status"]=="REQUEST_POSTHOC_ORIGINAL79_ACTUAL_VS_REWIRED_AUDIT"
          assert r["new_response_access_authorized"] is False
          assert r["one_shot"] is True
          assert c["population"]["species"]==79
          assert c["null_ensemble"]["null_graphs"]==20
          assert c["interpretation"]["counts_as_confirmatory_evidence"] is False
          PY

      - name: Download frozen 79-species pilot
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v171-exploratory-pilot-6dd3917166633381d88f7d9c4f95ee38b11d63f8-36743891802
          path: build/global_mammals_v116/pilot
          repository: zuizui0223/Structural
          run-id: 36743891802
          github-token: ${{ github.token }}

      - name: Download frozen actual prediction surface
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v173-preconfirmatory-2dfb3ce75e57b0d6a44584a8fd68158d05310e91-36745389315
          path: build/global_mammals_v116/actual
          repository: zuizui0223/Structural
          run-id: 36745389315
          github-token: ${{ github.token }}

      - name: Download frozen heldout focal response
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v175-exploratory-score-33f0a6a85ff7480f1fac30d8fcf26f355a7687ef-36746823761
          path: build/global_mammals_v116/heldout
          repository: zuizui0223/Structural
          run-id: 36746823761
          github-token: ${{ github.token }}

      - name: Download response-independent reference
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v143-reference-fe0e65be12a223fb3f0991afae959cd62ef3aabb-36622553042
          path: build/global_mammals_v116/reference
          repository: zuizui0223/Structural
          run-id: 36622553042
          github-token: ${{ github.token }}

      - name: Download safe Appendix 2 projection
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v123-appendix2-safe-ea565b98419f8aacde9fb13c26724bb385635b95-36524988694
          path: build/global_mammals_v116/safe
          repository: zuizui0223/Structural
          run-id: 36524988694
          github-token: ${{ github.token }}

      - name: Download exact routing
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v152-pilot-routing-f5ae81b05aac3ce4c5db6f43ce41e89c1d14548c-36625810600
          path: build/global_mammals_v116/routing
          repository: zuizui0223/Structural
          run-id: 36625810600
          github-token: ${{ github.token }}

      - name: Verify frozen response and prediction identities
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          checks={
            "build/global_mammals_v116/pilot/exploratory_pilot_species_universe.csv":"c15cb86ba0b0bd88e8d22fd566c495adcec113a3c9f7dd65f4b7c3415796335e",
            "build/global_mammals_v116/pilot/exploratory_pilot_matrix.csv":"77be952a6c45707e5e71cd0f192551f6365d6fde1ac1ba5aaaef2755c03366e2",
            "build/global_mammals_v116/actual/confirmatory_predictions.f64le":"f48ab1f09c825f99bced712a64e7c5f1ff927d024fdbe1aaf80db588b0372ef8",
            "build/global_mammals_v116/actual/confirmatory_entity_order.csv":"afda05287599110c7248c5cb0c1931689a2aee40f8ff4ff5b76509aff5350715",
            "build/global_mammals_v116/heldout/exploratory_confirmatory_matrix.csv":"25db7bf42396c66452c7611503522e68b6b4262bc83770c737be43076677a252",
          }
          for p,s in checks.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              assert got==s,(p,got,s)
          PY

      - name: Run fixed topology audit
        run: |
          mkdir -p build/global_mammals_v116/output
          python scripts/run_global_mammals_original79_topology_audit_v1_116.py             build/global_mammals_v116/pilot/exploratory_pilot_species_universe.csv             build/global_mammals_v116/pilot/exploratory_pilot_matrix.csv             build/global_mammals_v116/reference/state_reference.csv             build/global_mammals_v116/reference/source_graph_edges.csv             build/global_mammals_v116/reference/reference_receipt.json             build/global_mammals_v116/safe/appendix2_safe_rows.csv             build/global_mammals_v116/routing/pilot_ids.csv             build/global_mammals_v116/routing/confirmatory_ids.csv             build/global_mammals_v116/actual/confirmatory_predictions.f64le             build/global_mammals_v116/actual/confirmatory_entity_order.csv             build/global_mammals_v116/heldout/exploratory_confirmatory_matrix.csv             --null-output build/global_mammals_v116/output/null_scores.csv             --result build/global_mammals_v116/output/topology_audit_result.json

      - name: Enforce post-hoc nonrescuing boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/global_mammals_v116/output/topology_audit_result.json").read_text())
          assert x["status"]=="POSTHOC_ORIGINAL79_ACTUAL_VS_REWIRED_AUDIT_COMPLETE"
          assert x["actual_surface_replay_max_abs_probability_difference"]<=1e-12
          assert x["posthoc"] is True
          assert x["may_change_original_exploratory_status"] is False
          assert x["counts_as_confirmatory_evidence"] is False
          assert x["new_response_accessed"] is False
          PY

      - name: Upload fixed audit
        uses: actions/upload-artifact@v4
        with:
          name: global-mammals-v116-original79-topology-audit-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/global_mammals_v116/output/null_scores.csv
            build/global_mammals_v116/output/topology_audit_result.json
          if-no-files-found: error
          retention-days: 30
