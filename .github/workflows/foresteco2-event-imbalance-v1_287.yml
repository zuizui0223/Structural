name: ForestEco2 original Event imbalance terminal diagnostic v1.287
on:
  push:
    paths:
      - ".github/workflows/foresteco2-event-imbalance-v1_287.yml"
      - "development/foresteco2_event_imbalance_diagnostic_protocol_v1_287.json"
      - "scripts/foresteco2_event_imbalance_diagnostic_v1_287.py"
      - "tests/test_foresteco2_event_imbalance_diagnostic_v1_287.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-after-gate-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Prove original forecast gate remains failed even with Event diagnostics
        run: python -m pytest -q tests/test_foresteco2_event_imbalance_diagnostic_v1_287.py
      - name: Reinspect original source Event ONLY, fixed SHA, no Occurrence or S1
        run: |
          python scripts/foresteco2_event_imbalance_diagnostic_v1_287.py \
            --protocol development/foresteco2_event_imbalance_diagnostic_protocol_v1_287.json \
            --earlier-protocol development/foresteco2_event_only_qualification_protocol_v1_286.json \
            --out foresteco2_event_imbalance_receipt_v1_287.json
      - name: Verify no plant response read and old gate not rescued
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("foresteco2_event_imbalance_receipt_v1_287.json").read_text())
          assert r["status"]=="V1_286_REMAINS_TERMINAL_RESPONSE_UNOPENED"
          assert r["original_Event_rows_examined"]==90
          assert r["Occurrence_data_rows_opened"]==0 and r["focal_prediction_scores"]==0
          assert r["confirmatory_admissions"]==0 and r["GEB_scientific_HOLD"]
          assert not r["eBird_used"]
          print("PASS: original forest categories counted; old gate remains STOP")
          PY
      - name: Retain only forest×island aggregate counts, not site identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foresteco2-original-nine-cell-imbalance-v1-287
          path: foresteco2_event_imbalance_receipt_v1_287.json
          if-no-files-found: warn
