name: Boreal 19-island preconfirmatory artifact freeze v1.10

on:
  push:
    branches:
      - main
    paths:
      - development/boreal_19island_preconfirmatory_freeze_request_v1_10.json
      - .github/workflows/boreal-19island-preconfirmatory-freeze-v1_10.yml

permissions:
  actions: read
  contents: write

jobs:
  freeze-preconfirmatory-artifact:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce one-shot freeze request
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          REQUEST="development/boreal_19island_preconfirmatory_freeze_request_v1_10.json"
          test "$(git rev-list --count HEAD -- "$REQUEST")" = "1"

      - name: Validate source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          req = json.loads(
              Path(
                  "development/boreal_19island_preconfirmatory_freeze_request_v1_10.json"
              ).read_text(encoding="utf-8")
          )
          assert req["schema"] == (
              "structural.boreal_19island_preconfirmatory_freeze_request.v1_10"
          )
          assert req["status"] == (
              "REQUEST_EXACT_PRECONFIRMATORY_ARTIFACT_FREEZE"
          )
          assert req["one_shot"] is True

          src = req["source_execution"]
          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/artifacts/{src['artifact_id']}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              meta = json.load(response)

          assert meta["id"] == src["artifact_id"]
          assert meta["name"] == src["artifact_name"]
          assert meta["digest"] == src["artifact_digest"]
          assert meta["expired"] is False
          assert meta["workflow_run"]["id"] == src["workflow_run_id"]
          assert meta["workflow_run"]["head_sha"] == src["workflow_head_sha"]
          PY

      - name: Download exact successful v1.09 artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10996718466
          run-id: 36481729833
          path: build/boreal_v110/source
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Verify source files and model result
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          req = json.loads(
              Path(
                  "development/boreal_19island_preconfirmatory_freeze_request_v1_10.json"
              ).read_text(encoding="utf-8")
          )
          root = Path("build/boreal_v110/source")
          expected_files = {
              "confirmatory_predictions.csv",
              "model_receipt.json",
          }
          observed = {p.name for p in root.iterdir() if p.is_file()}
          assert observed == expected_files

          for name, expected_sha in req["file_sha256"].items():
              raw = (root / name).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == expected_sha

          receipt = json.loads(
              (root / "model_receipt.json").read_text(encoding="utf-8")
          )
          expected = req["expected_model_result"]
          for key, value in expected.items():
              assert receipt[key] == value

          with (root / "confirmatory_predictions.csv").open(
              "r", encoding="utf-8", newline=""
          ) as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 1287
          assert tuple(rows[0]) == (
              "island",
              "block",
              "species",
              "p_R0_hex",
              "p_R1_hex",
              "p_R2_hex",
              "p_R3_hex",
              "p_C_hex",
          )
          assert len({row["island"] for row in rows}) == 13
          assert len({row["block"] for row in rows}) == 7
          assert len({row["species"] for row in rows}) == 99
          PY

      - name: Exact replay v1.09 from committed parents
        run: |
          mkdir -p build/boreal_v110/replay
          python scripts/freeze_boreal_19island_preconfirmatory_model_v1_09.py \
            --predictions build/boreal_v110/replay/confirmatory_predictions.csv \
            --receipt build/boreal_v110/replay/model_receipt.json
          cmp -s \
            build/boreal_v110/source/confirmatory_predictions.csv \
            build/boreal_v110/replay/confirmatory_predictions.csv
          cmp -s \
            build/boreal_v110/source/model_receipt.json \
            build/boreal_v110/replay/model_receipt.json

      - name: Fast-forward to latest main before durable freeze
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --ff-only origin/main

      - name: Persist exact predictions receipt and provenance freeze
        run: |
          set -euo pipefail
          test ! -e development/boreal_19island_confirmatory_predictions_v1_10.csv
          test ! -e development/boreal_19island_preconfirmatory_model_receipt_v1_10.json
          test ! -e development/boreal_19island_preconfirmatory_freeze_v1_10.json

          cp build/boreal_v110/source/confirmatory_predictions.csv \
            development/boreal_19island_confirmatory_predictions_v1_10.csv
          cp build/boreal_v110/source/model_receipt.json \
            development/boreal_19island_preconfirmatory_model_receipt_v1_10.json

          python - <<'PY'
          import json
          from pathlib import Path

          req = json.loads(
              Path(
                  "development/boreal_19island_preconfirmatory_freeze_request_v1_10.json"
              ).read_text(encoding="utf-8")
          )
          expected = req["expected_model_result"]
          freeze = {
              "schema": "structural.boreal_19island_preconfirmatory_freeze.v1_10",
              "status": "PRECONFIRMATORY_MODELS_AND_PREDICTIONS_COMMITTED",
              "candidate_id": req["candidate_id"],
              "source_execution": req["source_execution"],
              "files": {
                  "confirmatory_predictions": {
                      "path": (
                          "development/"
                          "boreal_19island_confirmatory_predictions_v1_10.csv"
                      ),
                      "sha256": req["file_sha256"][
                          "confirmatory_predictions.csv"
                      ],
                  },
                  "model_receipt": {
                      "path": (
                          "development/"
                          "boreal_19island_preconfirmatory_model_receipt_v1_10.json"
                      ),
                      "sha256": req["file_sha256"]["model_receipt.json"],
                  },
              },
              "model_result": expected,
              "response_boundary": {
                  "pilot_response_already_consumed": True,
                  "confirmatory_response_opened": False,
                  "confirmatory_target_values_opened": 0,
                  "excluded_target_values_opened": 0,
                  "confirmatory_response_authorized": False,
                  "counts_as_empirical_evidence": False,
                  "predictive_denominator_contribution": 0,
              },
              "exact_replay_verified": True,
              "confirmatory_authorization_may_be_built": True,
              "next_action": (
                  "build a separately committed one-shot confirmatory-response "
                  "authorization bound to these exact 1287 predictions, model "
                  "fingerprint and v1.10 file SHA-256 values"
              ),
          }
          Path(
              "development/boreal_19island_preconfirmatory_freeze_v1_10.json"
          ).write_text(
              json.dumps(freeze, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit exact v1.10 freeze to main
        run: |
          set -euo pipefail
          git add \
            development/boreal_19island_confirmatory_predictions_v1_10.csv \
            development/boreal_19island_preconfirmatory_model_receipt_v1_10.json \
            development/boreal_19island_preconfirmatory_freeze_v1_10.json
          test "$(git diff --cached --name-only | wc -l)" = "3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze exact boreal 19-island preconfirmatory bundle v1.10"
          git push origin HEAD:main
