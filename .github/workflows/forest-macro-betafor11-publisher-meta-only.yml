name: Forest macro BETA-FOR11 original publisher metadata only

on:
  push:
    branches:
      - analysis/forest-macro-plot-environment
    paths:
      - ".github/workflows/forest-macro-betafor11-publisher-meta-only.yml"
      - "analysis/forest_macro_global/betafor11_publisher_metadata_preintake_only.py"
      - "docs/FOREST_MACRO_BETAFOR11_2025_ORIGINAL_METHOD_PREINTAKE_PRESPEC_20261119.md"
  pull_request:
    paths:
      - ".github/workflows/forest-macro-betafor11-publisher-meta-only.yml"
      - "analysis/forest_macro_global/betafor11_publisher_metadata_preintake_only.py"
      - "docs/FOREST_MACRO_BETAFOR11_2025_ORIGINAL_METHOD_PREINTAKE_PRESPEC_20261119.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic source drift and privacy STOP tests before original access
        run: |
          python3 analysis/forest_macro_global/betafor11_publisher_metadata_preintake_only.py --test
      - name: Read official Zenodo 15371332 index JSON ONLY
        run: |
          python3 analysis/forest_macro_global/betafor11_publisher_metadata_preintake_only.py --out betafor11_publisher_index_only/metadata_receipt.json
      - name: Assert no original biological-file download and no false ecological score
        run: |
          python3 - <<'PY'
          import json
          p = 'betafor11_publisher_index_only/metadata_receipt.json'
          x = json.load(open(p, encoding='utf-8'))
          assert x['source_original_data_members_GET'] == 0
          assert x['original_organism_or_site_rows_read'] == 0
          assert x['new_field_effects_tested'] == 0
          assert x['status'].startswith(('ORIGINAL_PUBLISHER_SIX_FILE_METADATA_ONLY_PASS', 'SOURCE_METADATA_HOLD_'))
          if x['status'].startswith('ORIGINAL_PUBLISHER'):
              assert x['publisher']['file_count'] == 6
              assert x['publisher']['scientific_eligibility_held_pending_source_method_crosswalk']
          print('SOURCE_ONLY_GUARD_PASS: ' + x['status'])
          PY
      - name: Upload publisher-only non-biological provenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-macro-betafor11-official-metadata-only
          path: betafor11_publisher_index_only/
          if-no-files-found: error
