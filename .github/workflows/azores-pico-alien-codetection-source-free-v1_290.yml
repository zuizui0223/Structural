name: Pico aggregate-only binary alien co-detection partial identification v1.290
on:
  push:
    paths:
      - ".github/workflows/azores-pico-alien-codetection-source-free-v1_290.yml"
      - "development/azores_pico_alien_binary_partial_id_protocol_v1_290.json"
      - "development/azores_pico_source_aggregates_v1_290.json"
      - "scripts/azores_pico_alien_codetection_bounds_v1_290.py"
      - "tests/test_azores_pico_alien_codetection_bounds_v1_290.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-aggregate-only-math:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install pytest only; no biological source transports allowed
        run: python -m pip install pytest
      - name: Verify exact co-detection bounds and native nonfocal contrast
        run: python -m pytest -q tests/test_azores_pico_alien_codetection_bounds_v1_290.py
      - name: Run strict deterministic aggregate-only Pico partial identification
        run: |
          python scripts/azores_pico_alien_codetection_bounds_v1_290.py \
            --aggregate development/azores_pico_source_aggregates_v1_290.json \
            --protocol development/azores_pico_alien_binary_partial_id_protocol_v1_290.json \
            --out azores_pico_aggregate_codetection_bounds_v1_290.json
      - name: Verify original field sources never reopened and no causal claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('azores_pico_aggregate_codetection_bounds_v1_290.json').read_text())
          assert r['feasible_binary_alien_codetection_count_pairs']==[[6,5],[7,4],[8,3]]
          assert r['alien_codetection_frequency_difference_upper_bound']['exact']=='-17/95'
          assert r['ratio_mean_nonfocal_native_richness_detected_vs_nondetected']['exact']=='123/38'
          assert r['all_feasible_codetection_gap_negative']
          assert r['no_original_biological_rows_reopened']
          assert r['no_colonization_rescue_or_survival_inferred']
          assert r['GEB_scientific_HOLD'] and r['new_confirmatory_systems']==0 and not r['eBird_used']
          print('PASS: analytical source-free bound only, no invader causality or individual viability inferred')
          PY
      - name: Retain source-free exact bounds and hypothetical feasibility vectors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azores-pico-sourcefree-exact-alien-codetection-v1-290
          path: azores_pico_aggregate_codetection_bounds_v1_290.json
          if-no-files-found: warn
