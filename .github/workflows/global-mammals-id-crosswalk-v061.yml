name: Global mammals ID-only crosswalk v0.61

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  id-only-crosswalk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable v0.60 parent and two-file delta
        run: |
          set -euo pipefail
          parent="69d3a45dc13c8eed06f1b1a8e517c8b17f0c2f0e"
          git merge-base --is-ancestor "$parent" HEAD
          mapfile -t changed < <(git diff --name-only "$parent"...HEAD | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/global-mammals-id-crosswalk-v061.yml"
          test "${changed[1]}" = "development/global_mammals_id_only_crosswalk_authorization_v0_61.json"

          python - <<'PY'
          import json
          from pathlib import Path
          A=json.loads(Path(
              "development/global_mammals_id_only_crosswalk_authorization_v0_61.json"
          ).read_text())
          assert A["status"]=="one_shot_routing_id_only_before_any_occurrence_value_access"
          assert A["occurrence_values_opened_expected"]==0
          assert A["species_headers_opened_expected"]==0
          assert A["mammal_response_identity"]["source_reported_islands"]==5592
          print("v0.61 ID-only authorization OK")
          PY

      - name: Download exact v0.60 safe Weigelt artifact
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-weigelt-safe-rows-v0-60
          path: build/safe
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36316161135

      - name: Verify safe Weigelt artifact
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          A=json.loads(Path(
              "development/global_mammals_id_only_crosswalk_authorization_v0_61.json"
          ).read_text())
          p=Path("build/safe")/A["safe_weigelt_artifact"]["csv_name"]
          assert p.is_file()
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()==A["safe_weigelt_artifact"]["csv_sha256"]
          assert len(raw)>0
          print("safe Weigelt CSV identity OK")
          PY

      - name: Resolve exact Dryad response file and decode routing IDs only
        run: |
          mkdir -p build/global_mammals_id_crosswalk_v061
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          A=json.loads(Path(
              "development/global_mammals_id_only_crosswalk_authorization_v0_61.json"
          ).read_text())
          R=A["mammal_response_identity"]

          # Load only already-safe Weigelt data.
          safe_path=Path("build/safe")/A["safe_weigelt_artifact"]["csv_name"]
          safe_rows={}
          with safe_path.open(newline="",encoding="utf-8") as f:
              reader=csv.DictReader(f)
              assert "id" in reader.fieldnames
              for row in reader:
                  key=str(row["id"]).strip()
                  assert key and key not in safe_rows
                  safe_rows[key]=row
          assert len(safe_rows)==A["safe_weigelt_artifact"]["row_count"]

          # Resolve current frozen Dryad file ID from metadata only.
          headers={
              "Accept":"application/json",
              "X-API-Version":"2.1.0",
              "User-Agent":"Structural-global-mammals-id-only/0.61"
          }
          files_url=f"https://datadryad.org/api/v2/versions/{R['version_id']}/files"
          req=Request(files_url,headers=headers,method="GET")
          with urlopen(req,timeout=60) as resp:
              meta=json.loads(resp.read())
          emb=meta.get("_embedded") or {}
          files=emb.get("stash:files") or emb.get("files") or []
          matches=[x for x in files if x.get("path")==R["path"]]
          assert len(matches)==1,(len(matches),[x.get("path") for x in files])
          fmeta=matches[0]
          file_id=fmeta.get("id")
          assert file_id is not None
          assert int(fmeta.get("size"))==R["size_bytes"]
          assert fmeta.get("digestType")=="sha-256"
          assert fmeta.get("digest")==R["sha256"]

          # Use the canonical Dryad public file-stream route once.
          download_url=f"https://datadryad.org/downloads/file_stream/{file_id}"
          req=Request(
              download_url,
              headers={"User-Agent":"Structural-global-mammals-id-only/0.61"},
              method="GET"
          )
          with urlopen(req,timeout=120) as resp:
              raw=resp.read()
          assert len(raw)==R["size_bytes"],(len(raw),R["size_bytes"])
          assert hashlib.sha256(raw).hexdigest()==R["sha256"]

          # Byte-level CSV parser: only first field is retained/decoded.
          # Everything after the first comma remains opaque and is discarded.
          first_fields=[]
          line_count=0
          for line in raw.splitlines():
              if not line:
                  continue
              line_count += 1
              if line.startswith(b'"'):
                  # Routing IDs are expected to be scalar identifiers. Support a
                  # quoted first field without decoding later columns.
                  i=1
                  field=bytearray()
                  while i < len(line):
                      b=line[i]
                      if b==34:
                          if i+1 < len(line) and line[i+1]==34:
                              field.append(34); i+=2; continue
                          i+=1
                          assert i < len(line) and line[i]==44
                          break
                      field.append(b); i+=1
                  first=bytes(field)
              else:
                  pos=line.find(b",")
                  assert pos>=0
                  first=line[:pos]
              first_fields.append(first)

          assert len(first_fields)==R["source_reported_islands"]+1,(len(first_fields),R["source_reported_islands"]+1)

          header=first_fields[0]
          if header.startswith(b"\xef\xbb\xbf"):
              header=header[3:]
          routing_header=header.decode("utf-8").strip()
          assert routing_header==R["expected_routing_header"],routing_header

          routing_ids=[]
          for b in first_fields[1:]:
              value=b.decode("utf-8").strip()
              assert value
              routing_ids.append(value)

          duplicates=sorted({x for x in routing_ids if routing_ids.count(x)>1})
          distinct=set(routing_ids)
          assert len(routing_ids)==R["source_reported_islands"]
          assert len(distinct)==R["source_reported_islands"],duplicates

          unmatched=sorted(distinct-set(safe_rows))
          matched=sorted(distinct & set(safe_rows))

          safe_fields=[
              "archip","name_long","name_lat","area","dist","slmp","gmmc",
              "elev","temp","vart","ccvt","prec","varp"
          ]
          null_counts={}
          for col in safe_fields:
              null_counts[col]=sum(
                  1 for key in matched
                  if not str(safe_rows[key].get(col,"")).strip()
              )

          crosswalk_text="\n".join(matched)+"\n"
          result={
              "schema":"structural.global_mammals_id_only_crosswalk_result.v0_61",
              "status":(
                  "exact_Weigelt_ID_crosswalk_complete"
                  if not unmatched else
                  "HOLD_unmatched_routing_IDs"
              ),
              "dryad_file_id":int(file_id),
              "dryad_download_url":download_url,
              "response_file_bytes_downloaded":len(raw),
              "response_file_sha256":R["sha256"],
              "routing_header":routing_header,
              "routing_rows":len(routing_ids),
              "distinct_routing_ids":len(distinct),
              "duplicate_routing_ids":duplicates,
              "matched_Weigelt_ids":len(matched),
              "unmatched_Weigelt_ids":len(unmatched),
              "unmatched_ids":unmatched,
              "matched_safe_field_null_counts":null_counts,
              "matched_archip_complete":len(matched)-null_counts["archip"],
              "matched_name_coordinates_complete":len(matched)-max(
                  null_counts["name_long"],null_counts["name_lat"]
              ),
              "crosswalk_sha256":hashlib.sha256(
                  crosswalk_text.encode("utf-8")
              ).hexdigest(),
              "species_header_values_decoded":0,
              "occurrence_values_decoded":0,
              "nonrouting_response_fields_decoded":0,
              "mammal_response_values_opened":False,
              "counts_as_empirical_evidence":False,
          }
          p=Path("build/global_mammals_id_crosswalk_v061/id_crosswalk_result.json")
          p.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Enforce ID-only semantic ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path(
              "build/global_mammals_id_crosswalk_v061/id_crosswalk_result.json"
          ).read_text())
          assert x["species_header_values_decoded"]==0
          assert x["occurrence_values_decoded"]==0
          assert x["nonrouting_response_fields_decoded"]==0
          assert x["mammal_response_values_opened"] is False
          assert x["routing_rows"]==5592
          print("ID-only semantic ceiling intact")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: global-mammals-id-crosswalk-v0-61
          path: build/global_mammals_id_crosswalk_v061/id_crosswalk_result.json
          if-no-files-found: error
          retention-days: 90
