name: Frozen exploratory independent camera positives on four island candidates v1.250
on:
  push:
    branches: [science/heldout-geographic-search-index-v1-235]
    paths:
      - development/camtrapasia_field_positive_protocol_v1_250.json
permissions:
  contents: read
  actions: read
jobs:
  original-four-island-field-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_camtrapasia_four_island_field_positive_v1_250.py
      - uses: actions/download-artifact@v4
        with:
          name: structural-v248-all239-response-safe-source-land-candidates
          path: build/v250/geo
          repository: zuizui0223/Structural
          run-id: 37892990657
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: structural-v238-camtrapasia-species-overlap-only
          path: build/v250/taxa
          repository: zuizui0223/Structural
          run-id: 37888766560
          github-token: ${{ github.token }}
      - name: Score actual independent positive camera records under frozen protocol
        run: |
          python scripts/camtrapasia_four_island_field_positives_v1_250.py build/v250/geo/result.json build/v250/taxa/overlap.json --out build/v250/out/field_positive.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v250-four-island-independent-camera-positive-pilot
          path: build/v250/out/field_positive.json
          retention-days: 21
