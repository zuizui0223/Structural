name: BALA JBI manuscript and 3 figures original source-FREE v1.345
on:
  push:
    paths:
      - ".github/workflows/bala-jbi-manuscript-figures-sourcefree-v1_345.yml"
      - "docs/BALA_JBI_ANONYMIZED_FULL_MANUSCRIPT_DRAFT_V1_345.md"
      - "scripts/bala_jbi_sourcefree_figures_v1_345.py"
      - "tests/test_bala_jbi_sourcefree_manuscript_figures_v1_345.py"
      - "scripts/bala_jbi_anonymous_review_bundle_v1_347.py"
      - "tests/test_bala_jbi_anonymous_review_bundle_v1_347.py"
      - "docs/BALA_JBI_SUPPLEMENTARY_TABLE_S1_ISLAND_UNCERTAINTY_V1_346.md"
      - "development/bala_within_campaign_detection_original_result_freeze_v1_316.json"
      - "development/bala_spatial_original_result_freeze_v1_318.json"
  pull_request:
    paths:
      - ".github/workflows/bala-jbi-manuscript-figures-sourcefree-v1_345.yml"
      - "docs/BALA_JBI_ANONYMIZED_FULL_MANUSCRIPT_DRAFT_V1_345.md"
      - "scripts/bala_jbi_sourcefree_figures_v1_345.py"
      - "tests/test_bala_jbi_sourcefree_manuscript_figures_v1_345.py"
      - "scripts/bala_jbi_anonymous_review_bundle_v1_347.py"
      - "tests/test_bala_jbi_anonymous_review_bundle_v1_347.py"
      - "docs/BALA_JBI_SUPPLEMENTARY_TABLE_S1_ISLAND_UNCERTAINTY_V1_346.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourcefree-paper-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install source-free plotting and test dependencies
        run: python -m pip install pytest matplotlib
      - name: Validate structured abstract, numeric source provenance, and figure consistency
        run: |
          python -m pytest -q tests/test_bala_jbi_sourcefree_manuscript_figures_v1_345.py
          python -m pytest -q tests/test_bala_jbi_anonymous_review_bundle_v1_347.py
      - name: Render all three research paper figures and inspectable aggregate CSV
        run: |
          python scripts/bala_jbi_sourcefree_figures_v1_345.py \
            --316 development/bala_within_campaign_detection_original_result_freeze_v1_316.json \
            --318 development/bala_spatial_original_result_freeze_v1_318.json \
            --contract development/bala_temporal_spatial_cross_axis_sourcefree_protocol_v1_344.json \
            --out bala_jbi_manuscript_v1_345
      - name: Verify no original BALA taxonomic source was reopened
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("bala_jbi_manuscript_v1_345/figure_bundle_manifest.json")
          r=json.loads(p.read_text())
          assert r["status"]=="ORIGINAL_BALA_NUMERICAL_FIGURES_GENERATED_WITHOUT_BIOLOGICAL_SOURCE"
          assert r["original_Event_or_Occurrence_rows_opened"]==0
          assert r["physical_islands"]==7 and r["physical_sites"]==29
          assert r["source_BALA_v314_v316_v318_workflows_SEALED"]
          assert r["negative_beetle_spatial_mean_is_not_seven_of_seven_negative_islands"]
          assert r["GEB_scientific_HOLD"] and r["new_confirmatory_systems"]==0 and not r["eBird_used"]
          print("PASS: exact original source-free JBI figure evidence, sealed taxonomy")
          PY
      - name: Package reviewer-safe anonymous main text, Table S1, three figures and island CSV
        run: |
          python scripts/bala_jbi_anonymous_review_bundle_v1_347.py \
            --manuscript docs/BALA_JBI_ANONYMIZED_FULL_MANUSCRIPT_DRAFT_V1_345.md \
            --S1 docs/BALA_JBI_SUPPLEMENTARY_TABLE_S1_ISLAND_UNCERTAINTY_V1_346.md \
            --bundle bala_jbi_manuscript_v1_345
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bala-jbi-original-sourcefree-full-manuscript-3fig-v1-345
          path: bala_jbi_manuscript_v1_345/
          if-no-files-found: warn
