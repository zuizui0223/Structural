name: Fifteen CamTrapAsia candidate study site geography v1.241
on:
  push:
    branches: [science/heldout-geographic-search-index-v1-235]
    paths:
      - development/camtrapasia_fifteen_candidate_contract_v1_241.json
permissions:
  contents: read
  actions: read
jobs:
  candidate-studies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest numpy scipy
          python -m pytest -q tests/test_camtrapasia_fifteen_candidate_v1_241.py
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v123-appendix2-safe-ea565b98419f8aacde9fb13c26724bb385635b95-36524988694
          path: build/v241/geom
          repository: zuizui0223/Structural
          run-id: 36524988694
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v152-pilot-routing-f5ae81b05aac3ce4c5db6f43ce41e89c1d14548c-36625810600
          path: build/v241/heldout
          repository: zuizui0223/Structural
          run-id: 36625810600
          github-token: ${{ github.token }}
      - run: |
          python scripts/camtrapasia_fifteen_candidate_geo_v1_241.py build/v241/geom/appendix2_safe_rows.csv build/v241/heldout/confirmatory_ids.csv --out build/v241/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v241-camera-study-15-safe-site-geography
          path: build/v241/result.json
          retention-days: 21
