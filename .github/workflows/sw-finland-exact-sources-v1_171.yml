name: SW Finland exact historical sources v1.171

on:
  push:
    branches:
      - main
    paths:
      - development/sw_finland_exact_source_reconstruction_request_v1_171.json

permissions:
  contents: write

jobs:
  reconstruct-t0-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate one-shot t0 request and lookup freeze
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          req=json.loads(Path("development/sw_finland_exact_source_reconstruction_request_v1_171.json").read_text())
          assert req["schema"]=="structural.sw_finland_exact_source_reconstruction_request.v1_171"
          assert req["status"]=="REQUEST_T0_EXACT_SOURCE_RECONSTRUCTION"
          assert req["future_outcome_access_requested"] is False
          assert req["one_shot"] is True
          assert req["eBird_used"] is False
          lookup=Path("development/sw_finland_species_potential_islands_v1_168.csv")
          val=Path("development/sw_finland_potential_lookup_validation_v1_170.json")
          assert lookup.exists() and val.exists()
          assert hashlib.sha256(lookup.read_bytes()).hexdigest()==req["lookup_sha256"]
          v=json.loads(val.read_text())
          assert v["status"]=="T0_SOURCE_COUNT_LOOKUP_VALIDATED_NO_FUTURE_SUMMARIES_PERSISTED"
          assert v["future_summary_values_persisted"]==0
          PY

      - name: Download exact archive bytes
        run: |
          set -euo pipefail
          mkdir -p build/swf_v171/raw build/swf_v171/safe build/swf_v171/out
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          url="https://zenodo.org/records/4942881/files/colonization_select.csv?download=1"
          expected_md5="ff648878946ba430fb86c4ab2aa02baa"
          expected_sha="72b631033ef36210ee19b151dc4f6569760262d68f70b9ce6de6c8a11afeb957"
          out=Path("build/swf_v171/raw/colonization_select.csv");md5=hashlib.md5();sha=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Structural-v1.171"}),timeout=180) as src,out.open("wb") as dst:
            while True:
              b=src.read(1024*1024)
              if not b:break
              dst.write(b);md5.update(b);sha.update(b)
          if md5.hexdigest()!=expected_md5 or sha.hexdigest()!=expected_sha:
            out.unlink(missing_ok=True);raise SystemExit("archive identity mismatch")
          PY

      - name: Route t0 state with outcome bytes opaque
        run: |
          python scripts/route_sw_finland_t0_columns_v1_169.py             build/swf_v171/raw/colonization_select.csv             --safe-output build/swf_v171/safe/t0_safe.csv             --receipt build/swf_v171/out/router.json

      - name: Reconstruct exact historical source identities
        run: |
          python scripts/reconstruct_sw_finland_exact_sources_v1_171.py             build/swf_v171/safe/t0_safe.csv             development/sw_finland_species_potential_islands_v1_168.csv             --router-receipt build/swf_v171/out/router.json             --lookup-validation development/sw_finland_potential_lookup_validation_v1_170.json             --species-output build/swf_v171/out/species.csv             --membership-output build/swf_v171/out/membership.csv             --geometry-output build/swf_v171/out/geometry.csv             --receipt build/swf_v171/out/receipt.json

      - name: Delete raw archive and row-level safe projection
        if: always()
        run: |
          rm -rf build/swf_v171/raw build/swf_v171/safe

      - name: Verify t0-only result and commit
        run: |
          set -euo pipefail
          test ! -e build/swf_v171/raw
          test ! -e build/swf_v171/safe
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/swf_v171/out/receipt.json").read_text())
          assert r["status"]=="T0_EXACT_SOURCE_IDENTITIES_FROZEN_FUTURE_OUTCOME_SEALED"
          assert r["exact_source_species"]>=30
          assert r["impossible_species"]==0
          assert r["future_outcome_values_opened"]==0
          assert r["protected_outcome_values_decoded"]==0
          assert r["pilot_future_outcome_authorized"] is False
          assert r["confirmatory_future_outcome_authorized"] is False
          PY
          cp build/swf_v171/out/species.csv development/sw_finland_exact_source_species_v1_171.csv
          cp build/swf_v171/out/membership.csv development/sw_finland_exact_source_membership_v1_171.csv
          cp build/swf_v171/out/geometry.csv development/sw_finland_t0_island_geometry_v1_171.csv
          cp build/swf_v171/out/receipt.json development/sw_finland_exact_source_reconstruction_v1_171.json
          git add development/sw_finland_exact_source_species_v1_171.csv development/sw_finland_exact_source_membership_v1_171.csv development/sw_finland_t0_island_geometry_v1_171.csv development/sw_finland_exact_source_reconstruction_v1_171.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze SW Finland exact historical source identities v1.171"
          git push origin HEAD:main
