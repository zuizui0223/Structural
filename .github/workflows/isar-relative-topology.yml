name: ISAR relative-topology response-blind census

on:
  pull_request:
    branches: [main]
    paths:
      - "research/isar_relative_topology/**"
      - ".github/workflows/isar-relative-topology.yml"

permissions:
  contents: read

concurrency:
  group: isar-relative-topology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install predictor-only dependency
        run: python -m pip install numpy
      - name: Run metadata-only geometry census
        shell: bash
        run: |
          set -o pipefail
          python research/isar_relative_topology/metadata_census_v0_1.py \
            --contamination research/isar_relative_topology/response_contamination_v0_1.json \
            | tee isar_relative_topology_census.json
      - name: Assert fresh response remains sealed
        run: |
          python - <<'PY'
          import json
          x=json.load(open("isar_relative_topology_census.json"))
          assert x["schema"] == "structural.isar_relative_topology_metadata_census.v0_1"
          assert x["status"] == "QUALIFIED_RESPONSE_SEALED"
          assert x["response_values_accessed"] is False
          assert x["abundance_files_opened"] is False
          assert x["selection"]["final_geographic_archipelagos"] >= 10
          assert x["selection"]["final_studies"] >= 10
          assert x["selection"]["final_islands"] >= 200
          assert all(x["pre_response_gates"].values())
          assert x["design"]["rank"] == x["design"]["n_columns"]
          assert x["design"]["bootstrap"]["replicates"] == 10000
          assert x["response_open_authorized"] is False
          assert all(r["opened"] is False for r in x["response_surfaces"])
          print("ISAR_RESPONSE_SEALED_QUALIFIED", x["census_fingerprint"])
          print("PANEL", x["selection"])
          print("DESIGN", x["design"])
          print("FRESH_SURFACES", [r["study_ID"] for r in x["response_surfaces"]])
          PY
      - name: Assert census cannot open abundance matrices
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("research/isar_relative_topology/metadata_census_v0_1.py").read_text()
          assert p.count("fetch_raw(") == 2  # definition + the one ENV_PATH call
          assert "fetch_raw(ENV_PATH)" in p
          assert 'fetch_raw(r["source_path"])' not in p
          assert 'fetch_raw(response' not in p
          print("NO_ABUNDANCE_RESPONSE_ACCESS_PATH")
          PY
      - name: Freeze response and H1 protocol
        shell: bash
        run: |
          set -o pipefail
          python research/isar_relative_topology/freeze_protocol_v0_1.py \
            --census isar_relative_topology_census.json \
            --contamination research/isar_relative_topology/response_contamination_v0_1.json \
            | tee isar_relative_topology_protocol.json
      - name: Assert protocol remains response sealed
        run: |
          python - <<'PY'
          import json
          x=json.load(open("isar_relative_topology_protocol.json"))
          assert x["schema"] == "structural.isar_relative_topology_protocol.v0_1"
          assert x["status"] == "FROZEN_BEFORE_FRESH_RESPONSE"
          assert x["response_values_accessed"] is False
          assert x["geographic_archipelagos"] == 10
          assert x["islands"] == 212
          assert x["predictor_model"]["target"] == "topology_x_relative_isolation"
          assert x["H1_primary"]["prediction"] == "positive"
          assert x["bootstrap"]["accepted_draws_sha256"] == "26f23f36d94b83bca45749c8ba0527a50bb63a207ac6dd5d73a962738b2bd9ed"
          assert x["response_open_authorized"] is False
          assert x["H1_scoring_authorized"] is False
          assert len(x["protocol_fingerprint"]) == 64
          print("ISAR_PROTOCOL_FROZEN", x["protocol_fingerprint"])
          PY
      - name: Replay exact pre-response lock
        run: |
          python - <<'PY'
          import json
          census=json.load(open("isar_relative_topology_census.json"))
          protocol=json.load(open("isar_relative_topology_protocol.json"))
          lock=json.load(open("research/isar_relative_topology/pre_response_lock_v0_1.json"))
          assert lock["schema"] == "structural.isar_relative_topology_pre_response_lock.v0_1"
          assert lock["status"] == "FROZEN_QUALIFIED_BEFORE_RESPONSE"
          assert lock["response_values_accessed"] is False
          assert lock["abundance_files_opened"] is False
          assert lock["census_fingerprint"] == census["census_fingerprint"] == "23d726b895845753006c15529871dce89a38e9c93b94d515628a86b5b4a15ec3"
          assert lock["protocol_fingerprint"] == protocol["protocol_fingerprint"] == "2aa38abac0c706d639e34135373188628e9e9ec63846aa6926c892a8b3e0c285"
          assert lock["bootstrap"]["accepted_draws_sha256"] == census["design"]["bootstrap"]["accepted_draws_sha256"]
          assert lock["model"]["target"] == protocol["predictor_model"]["target"]
          expected={r["study_ID"]:(r["geography_cluster"],r["source_path"]) for r in census["response_surfaces"]}
          observed={r["study_ID"]:(r["cluster"],r["path"]) for r in lock["response_surfaces"]}
          assert observed == expected
          assert lock["authorization"]["one_shot_fresh_response_authorized"] is True
          assert lock["authorization"]["post_response_study_dropping_authorized"] is False
          assert lock["authorization"]["post_response_retuning_authorized"] is False
          assert lock["authorization"]["rerun_after_any_abundance_file_opened"] is False
          print("ISAR_PRE_RESPONSE_LOCK_REPLAY_OK", lock["protocol_fingerprint"])
          PY
