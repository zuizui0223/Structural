name: ALA response-free island geometry v1.191 checks

on:
  pull_request:
    paths:
      - development/global_mammals_ala_island_geometry_gate_v1_191.json
      - scripts/freeze_ala_island_geometry_crosswalk_v1_191.py
      - tests/test_ala_island_geometry_v1_191.py
      - .github/workflows/ala-island-geometry-check-v1_191.yml
  push:
    branches:
      - candidate/ala-island-identity-v1-191

permissions:
  contents: read

jobs:
  response-free:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest pyshp==2.3.1 shapely==2.1.1 pyproj==3.7.2
      - run: python -m pytest -q tests/test_ala_island_geometry_v1_191.py
