name: CamTrapAsia response-safe site geography vs heldout island index v1.239
on:
  push:
    branches: [science/heldout-geographic-search-index-v1-235]
    paths:
      - development/camtrapasia_site_geography_contract_v1_239.json
permissions:
  contents: read
  actions: read
jobs:
  geocoded-sample-overlap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_camtrapasia_site_geography_v1_239.py
      - uses: actions/download-artifact@v4
        with:
          name: structural-v235-original-4126-heldout-geography-index
          path: build/v239/old
          repository: zuizui0223/Structural
          run-id: 37888194328
          github-token: ${{ github.token }}
      - name: Evaluate survey-center geography against frozen original heldout grid only
        run: |
          python scripts/camtrapasia_sites_vs_mammal_heldout_grid_v1_239.py build/v239/old/result.json --out build/v239/result/site_geography.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v239-camtrapasia-field-study-geography-only
          path: build/v239/result/site_geography.json
          retention-days: 21
