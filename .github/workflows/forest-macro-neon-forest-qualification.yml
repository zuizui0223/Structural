name: "Forest beetle NEON strict forest site with temperature and vegetation temporal support"
on:
  push:
    paths:
      - ".github/workflows/forest-macro-neon-forest-qualification.yml"
      - "analysis/forest_macro_global/qualify_neon_forest_nlcd_three_product_sites.py"
      - "analysis/forest_macro_global/test_qualify_neon_forest_nlcd_three_product_sites.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  strict_NLCD_forest_eligibility_over_NEON_2026_original_site_cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test strict original forest-only vs mixed habitat source eligibility
        run: |
          python -m pip install pytest
          python -m pytest -q analysis/forest_macro_global/test_qualify_neon_forest_nlcd_three_product_sites.py
      - name: Restore exact previously verified NEON RELEASE-2026 42 site-month metadata cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p original_neon_three_products
          gh run download 42445186294 \
            --repo "$GITHUB_REPOSITORY" \
            --name forest-macro-neon-original-three-product-site-month-support \
            --dir original_neon_three_products
      - name: Retrieve official source-pinned NEON 2026 field-site NLCD and canopy metadata
        run: |
          mkdir -p official_NEON_2026_site_source
          curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 130 \
            "https://www.neonscience.org/field-sites/exports/NEON_Field_Site_Metadata_20260805" \
            --output official_NEON_2026_site_source/NEON_Field_Site_Metadata_20260805.csv
      - name: Join original field-site NLCD vegetation with 3-product month/year support
        run: |
          python analysis/forest_macro_global/qualify_neon_forest_nlcd_three_product_sites.py \
            --site_csv official_NEON_2026_site_source/NEON_Field_Site_Metadata_20260805.csv \
            --month_manifest original_neon_three_products/NEON_three_product_original_release_site_month_support.json \
            --out original_NEON_2026_forest_site_eligibility
      - name: Verify site context not silently promoted to forest plot or insect vertical migration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("original_NEON_2026_forest_site_eligibility/NEON_2026_strict_forest_nlcd_three_product_source_gate.json").read_text())
          assert r["schema"]=="structural.NEON_forest_beetle_site_NLCD_temporal_gate.v1"
          assert r["NEON_official_site_source_sha256"]=="d123c8dd131635bbfb1869f8c899f4c0a7930549a6ec531c612a01bd9ad03461"
          assert r["official_NEON_site_metadata_rows"]==81
          assert r["original_three_product_site_N"]==42
          assert sum(r["site_NLCD_context_category_counts"].values())==42
          assert r["strict_forest_only_with_2plus_sample_years"]<=r["strict_forest_only_with_same_calendar_month_three_products"]
          assert r["original_plot_scale_habitat_identity_qualified"]==0
          assert not r["original_NEON_biological_thermal_effect_scored"]
          assert r["NEON_ground_beetle_pitfall_not_an_insect_canopy_trap"]
          assert r["no_original_species_or_trap_ID_values_exported"]
          assert not r["eBird_used"]
          PY
      - name: Archive source-backed NEON forest context and sampled months without raw biological data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-macro-neon-strict-NLCD-forest-site-candidates
          path: original_NEON_2026_forest_site_eligibility/
          if-no-files-found: warn
