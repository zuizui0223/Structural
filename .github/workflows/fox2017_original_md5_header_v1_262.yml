name: Fox 2017 exact published experiment original MD5 v1.262
on:
  push:
    branches: [science/extinction-synchrony-sign-v1-260]
    paths:
      - scripts/fox2017_original_md5_header_v1_262.py
      - tests/test_fox2017_original_md5_header_v1_262.py
      - development/fox2017_original_MD5_transport_contract_v1_262.json
      - .github/workflows/fox2017_original_md5_header_v1_262.yml
permissions:
  contents: read
jobs:
  unchanged-original-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_fox2017_original_md5_header_v1_262.py
      - run: |
          python scripts/fox2017_original_md5_header_v1_262.py --out build/v262/original.json
          python - <<'PY'
          import json
          r=json.load(open("build/v262/original.json"))
          assert r["source_version_ID"]==5720
          assert r["numeric_biological_response_rows_decoded"]==0
          assert r["status"] in ("STOP_NO_ORIGINAL_BYTES_AVAILABLE",
                                 "PASS_TWO_EXACT_MD5_ORIGINAL_FILES_README_AND_CSV_HEADER_ONLY")
          assert r["GEB_scientific_HOLD"]
          print("Fox exact original file access:",r["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v262-fox2017-exact-source-transport
          path: build/v262/original.json
          retention-days: 21
