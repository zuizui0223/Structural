name: Wolfe weekday-paired posthoc sensitivity v1.215
on:
  push:
    branches:
      - analysis/wolfe-joint-predator-v1-209
    paths:
      - development/wolfe_weekday_paired_contract_v1_215.json
permissions:
  contents: read
jobs:
  daypairs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_wolfe_day_pairs_v1_215.mjs
      - uses: actions/checkout@v4
        with:
          repository: ExperimentalConservation/Experimental-data
          ref: fabe50b58a13651be4168b91cd91589ccc261a96
          path: build/author
          persist-credentials: false
      - run: |
          node scripts/wolfe_day_pairs_v1_215.mjs "build/author/Wolfe et al. /Wolfe et al experimental data.csv" build/wolfe215/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: wolfe-v215-weekday-pair-sensitivity
          path: build/wolfe215/result.json
          retention-days: 21
