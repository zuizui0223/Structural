name: Helgeland existing ID alias crosswalk v1.235
on:
  push:
    branches: [science/helgeland-archipelago-source-intake-v1-230]
    paths:
      - scripts/helgeland_breeder_key_alias_v1_235.py
      - tests/test_helgeland_breeder_key_alias_v1_235.py
      - development/helgeland_breeder_alias_contract_v1_235.json
      - .github/workflows/helgeland_breeder_alias_v1_235.yml
permissions:
  contents: read
jobs:
  original-source-keys:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_helgeland_breeder_key_alias_v1_235.py
      - uses: actions/checkout@v4
        with:
          repository: torhanssonfrank/DensityRegulationHouseSparrows
          ref: a4e1c9ebc1148d7c7aca2bb5730b9d7104094fe5
          path: build/author
          persist-credentials: false
      - run: |
          python scripts/helgeland_breeder_key_alias_v1_235.py build/author --out build/v235/key_result.json
          python - <<'PY'
          import json
          r=json.load(open("build/v235/key_result.json"))
          assert set(r["named_candidate_key_results"])=={"ID","Year_ID","Year_ID_Location"}
          assert not r["N_nestlings_N_Recruits_values_decoded"]
          assert r["producer_rows"]==1903
          print("Three source-named key aliases inspected; reproductive effect remains forbidden")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v235-helgeland-existing-key-alias
          path: build/v235/key_result.json
          retention-days: 21
