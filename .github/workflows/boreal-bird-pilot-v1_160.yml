name: Boreal bird one-shot pilot v1.160

on:
  push:
    branches:
      - reframe/occupancy-dependent-isolation-v1-154
    paths:
      - development/boreal_19island_birds_pilot_execution_request_v1_160.json

permissions:
  contents: read

jobs:
  bird-pilot:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate one-shot request and sealed design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path("development/boreal_19island_birds_pilot_execution_request_v1_160.json").read_text())
          assert req["schema"]=="structural.boreal_19island_birds_pilot_execution_request.v1_160"
          assert req["status"]=="REQUEST_ONE_SHOT_BIRD_PILOT"
          assert req["one_shot"] is True
          assert req["confirmatory_response_authorized"] is False
          assert req["counts_as_empirical_evidence"] is False
          contract=json.loads(Path("development/boreal_19island_birds_pilot_contract_v1_159.json").read_text())
          assert contract["execution_authorized_now"] is False
          assert contract["semantic_access"]["required_confirmatory_target_values_parsed"]==0
          PY

      - name: Prepare short-lived Dryad bearer token
        env:
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
          DRYAD_TOKEN_FALLBACK: ${{ secrets.DRYAD_TOKEN }}
        run: |
          mkdir -p build/bird_v160
          python scripts/prepare_dryad_token_v0_73.py \
            --github-env "$GITHUB_ENV" \
            --receipt build/bird_v160/token_receipt.json

      - name: Fetch exact bird response as opaque bytes
        run: |
          mkdir -p build/bird_v160/raw
          python scripts/fetch_boreal_19island_bird_response_v1_160.py \
            build/bird_v160/raw/borealbirds_speciesmatrix_presenceabsence.csv \
            --receipt build/bird_v160/transport_receipt.json

      - name: Execute single semantic pilot pass
        id: pilot
        run: |
          set +e
          python scripts/run_boreal_19island_bird_pilot_v1_160.py \
            build/bird_v160/raw/borealbirds_speciesmatrix_presenceabsence.csv \
            --result build/bird_v160/pilot_result.json \
            --snapshot build/bird_v160/pilot_snapshot.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Delete raw bird response before artifact handling
        if: always()
        run: rm -rf build/bird_v160/raw

      - name: Assert artifact surface is response-safe
        if: always()
        run: |
          test ! -e build/bird_v160/raw
          find build/bird_v160 -type f -print
          test -e build/bird_v160/pilot_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("build/bird_v160/pilot_result.json").read_text())
          assert result["confirmatory_target_values_parsed"]==0
          assert result["excluded_target_values_parsed"]==0
          assert result["counts_as_empirical_evidence"] is False
          snap=Path("build/bird_v160/pilot_snapshot.json")
          if snap.exists():
              x=json.loads(snap.read_text())
              assert x["confirmatory_target_values_parsed"]==0
              assert x["excluded_target_values_parsed"]==0
              assert x["confirmatory_occurrence_values_stored"] is False
              assert x["excluded_occurrence_values_stored"] is False
          PY

      - name: Upload pilot receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boreal-bird-v160-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/bird_v160/token_receipt.json
            build/bird_v160/transport_receipt.json
            build/bird_v160/pilot_result.json
            build/bird_v160/pilot_snapshot.json
          if-no-files-found: warn
          retention-days: 14

      - name: Propagate scientific stop/pass
        if: always()
        run: exit "${{ steps.pilot.outputs.code || '2' }}"
