name: GIFT metadata dispatcher v1.29

on:
  push:
    branches:
      - main
    paths:
      - development/gift_metadata_dispatch_request_v1_29.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch-frozen-v089:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dispatch request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate one-shot metadata-only request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          req = json.loads(
              Path(
                  "development/gift_metadata_dispatch_request_v1_29.json"
              ).read_text(encoding="utf-8")
          )
          assert req["schema"] == (
              "structural.gift_metadata_dispatch_request.v1_29"
          )
          assert req["status"] == "REQUEST_FROZEN_GIFT_METADATA_V089_DISPATCH"
          assert req["candidate_id"] == "gift_native_angiosperm_islands_v3_2"
          assert req["target_workflow"] == (
              ".github/workflows/gift-metadata-freeze-v0_89.yml"
          )
          assert req["target_ref"] == "main"
          assert req["species_composition_authorized"] is False
          assert req["species_richness_authorized"] is False
          assert req["counts_as_empirical_evidence"] is False
          assert req["one_shot"] is True
          PY

      - name: Dispatch frozen GIFT metadata v0.89 on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "gift-metadata-freeze-v0_89.yml/dispatches"
          )
          req = urllib.request.Request(
              url,
              data=json.dumps({"ref": "main"}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as response:
              if response.status != 204:
                  raise SystemExit(
                      f"GIFT metadata workflow dispatch returned HTTP "
                      f"{response.status}"
                  )
          print("dispatched frozen GIFT metadata v0.89 on main")
          PY
