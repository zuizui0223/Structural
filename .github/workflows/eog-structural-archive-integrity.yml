name: Historical EOG Structural archive identity
on:
  push:
    paths:
      - 'archive/eog_structural_legacy_20261122/**'
      - 'scripts/verify_eog_structural_legacy.py'
  pull_request:
    paths:
      - 'archive/eog_structural_legacy_20261122/**'
      - 'scripts/verify_eog_structural_legacy.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen historical blobs (no new biological scoring)
        run: python scripts/verify_eog_structural_legacy.py
