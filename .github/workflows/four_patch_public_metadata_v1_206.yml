name: Four-patch experimental metadata only v1.206
on:
  push:
    branches:
      - science/four-patch-metadata-v1-206
    paths:
      - development/four_patch_dryad_metadata_request_v1_206.json
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_four_patch_dryad_metadata_v1_206.py
      - name: Read exact Dryad source VERSION and FILE metadata, not data
        run: python scripts/preflight_four_patch_metadata_v1_206.py build/four_patch_v206/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-four-patch-v206-public-metadata-receipt
          path: build/four_patch_v206/receipt.json
          retention-days: 21
