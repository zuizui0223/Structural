name: Unrepresented geocoded neighbor distances v1.222
on:
  push:
    branches:
      - science/geb_mapped_response_claims_v1-217
    paths:
      - development/unrepresented_geocoded_neighbourhood_contract_v1_222.json
      - tests/test_unrepresented_geocoded_neighbours_v1_222.py
      - scripts/check_unrepresented_geocoded_neighbours_v1_222.py
permissions:
  contents: read
  actions: read
jobs:
  neighbour-geography:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest numpy scipy
          python -m pytest -q tests/test_unrepresented_geocoded_neighbours_v1_222.py
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v123-appendix2-safe-ea565b98419f8aacde9fb13c26724bb385635b95-36524988694
          path: build/v222/barreto
          repository: zuizui0223/Structural
          run-id: 36524988694
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-weigelt-safe-rows-v0-60
          path: build/v222/weigelt
          repository: zuizui0223/Structural
          run-id: 36316161135
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v143-reference-fe0e65be12a223fb3f0991afae959cd62ef3aabb-36622553042
          path: build/v222/selected
          repository: zuizui0223/Structural
          run-id: 36622553042
          github-token: ${{ github.token }}
      - name: Exact 3D great-circle matched / full-namepoint nearest comparison
        run: |
          python scripts/check_unrepresented_geocoded_neighbours_v1_222.py build/v222/barreto/appendix2_safe_rows.csv build/v222/weigelt/weigelt_islanddata_safe_v0_60.csv build/v222/selected/state_reference.csv --out build/v222/result/nearest.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v222-response-safe-nearest-neighbour-audit
          path: build/v222/result/nearest.json
          retention-days: 21
