name: SW Finland standardized count recovery v1.173.2

on:
  push:
    branches:
      - main
    paths:
      - development/sw_finland_standardized_count_request_v1_173_2.json

permissions:
  contents: write

jobs:
  t0-count-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify pre-calibration retry boundary
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("development/sw_finland_standardized_historical_count_contract_v1_173_2.json").read_text())
          r=json.loads(Path("development/sw_finland_standardized_count_request_v1_173_2.json").read_text())
          assert c["prior_stop"]["future_outcome_values_opened"]==0
          assert c["prior_stop"]["effect_estimate_produced"] is False
          assert r["prior_failure_before_calibration"] is True
          assert r["future_outcome_values_opened_before_request"]==0
          assert r["future_outcome_access_requested"] is False
          assert r["supplement_future_summary_values_requested"] is False
          assert r["effect_estimate_requested"] is False
          assert r["one_shot"] is True
          assert r["eBird_used"] is False
          PY

      - name: Download exact archive bytes
        run: |
          set -euo pipefail
          mkdir -p build/swf_v1732/raw build/swf_v1732/safe build/swf_v1732/out
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          u="https://zenodo.org/records/4942881/files/colonization_select.csv?download=1"
          p=Path("build/swf_v1732/raw/colonization_select.csv");m=hashlib.md5();s=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Structural-v1.173.2"}),timeout=180) as src,p.open("wb") as dst:
              while True:
                  b=src.read(1024*1024)
                  if not b:break
                  dst.write(b);m.update(b);s.update(b)
          if m.hexdigest()!="ff648878946ba430fb86c4ab2aa02baa" or s.hexdigest()!="72b631033ef36210ee19b151dc4f6569760262d68f70b9ce6de6c8a11afeb957":
              p.unlink(missing_ok=True);raise SystemExit("archive identity mismatch")
          PY

      - name: Route t0 columns with outcome opaque
        run: |
          python scripts/route_sw_finland_t0_columns_v1_169.py             build/swf_v1732/raw/colonization_select.csv             --safe-output build/swf_v1732/safe/t0_safe.csv             --receipt build/swf_v1732/out/router.json

      - name: Recover counts under frozen logical-zero rule
        run: |
          python scripts/recover_sw_finland_standardized_counts_v1_173_2.py             build/swf_v1732/safe/t0_safe.csv             --router-receipt build/swf_v1732/out/router.json             --species-output build/swf_v1732/out/species_counts.csv             --anchor-output build/swf_v1732/out/anchor_audit.csv             --receipt build/swf_v1732/out/recovery.json

      - name: Delete raw archive and row-level safe projection
        if: always()
        run: rm -rf build/swf_v1732/raw build/swf_v1732/safe

      - name: Verify t0-only recovery and commit canonical v1.173 outputs
        run: |
          set -euo pipefail
          test ! -e build/swf_v1732/raw
          test ! -e build/swf_v1732/safe
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/swf_v1732/out/recovery.json").read_text())
          assert r["status"]=="STANDARDIZED_HISTORICAL_SOURCE_COUNTS_RECOVERED_T0_ONLY"
          assert r["recovery_revision"]=="v1.173.2"
          assert r["species_count"]==587
          assert r["anchors_matched"]>=20
          assert r["unresolved_nonnumeric_species"]==0
          assert r["exact_source_species"]>=30
          assert r["impossible_species"]==0
          assert r["future_outcome_values_opened"]==0
          assert r["protected_outcome_values_decoded"]==0
          assert r["supplement_future_summary_values_used"]==0
          assert r["pilot_future_outcome_authorized"] is False
          assert r["confirmatory_future_outcome_authorized"] is False
          PY
          cp build/swf_v1732/out/species_counts.csv development/sw_finland_historical_source_count_recovery_v1_173.csv
          cp build/swf_v1732/out/recovery.json development/sw_finland_historical_source_count_calibration_v1_173.json
          git add development/sw_finland_historical_source_count_recovery_v1_173.csv development/sw_finland_historical_source_count_calibration_v1_173.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover SW Finland historical source counts v1.173.2"
          git push origin HEAD:main
