name: Forest macroecology plot and environment join ledger
on:
  push:
    paths:
      - '.github/workflows/forest-macro-plot-ledger.yml'
      - 'analysis/forest_macro/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  event-metadata-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Check physical plot grain and no Occurrence access
        run: python -m pytest -q analysis/forest_macro/test_ledger.py
      - name: Read original Event metadata and build join-ready forest plot ledger
        run: python analysis/forest_macro/forest_plot_ledger.py --out forest_macro_output
      - uses: actions/upload-artifact@v4
        with:
          name: forest-macro-plot-ledger
          path: forest_macro_output/
          if-no-files-found: error
