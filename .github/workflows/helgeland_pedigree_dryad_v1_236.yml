name: Helgeland 2025 pedigree Dryad source metadata v1.236
on:
  push:
    branches: [science/helgeland-archipelago-source-intake-v1-230]
    paths:
      - scripts/helgeland_pedigree_dryad_metadata_v1_236.py
      - tests/test_helgeland_pedigree_dryad_metadata_v1_236.py
      - development/helgeland_2025_pedigree_source_contract_v1_236.json
      - .github/workflows/helgeland_pedigree_dryad_v1_236.yml
permissions:
  contents: read
jobs:
  source-metadata-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_helgeland_pedigree_dryad_metadata_v1_236.py
      - name: Exact Dryad DOI version and file list, zero biological downloads
        run: |
          python scripts/helgeland_pedigree_dryad_metadata_v1_236.py --out build/v236/metadata.json
          python - <<'PY'
          import json
          d=json.load(open("build/v236/metadata.json"))
          assert len(d["exact_five_file_metadata"])==5
          assert d["biological_rows_semantically_read"]==0
          assert not d["downloaded_raw_reproductive_file_bodies"]
          assert d["GEB_scientific_HOLD"]
          print("Dryad pedigree metadata verified only; zero reproductive responses")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v236-helgeland-pedigree-metadata
          path: build/v236/metadata.json
          retention-days: 21
