name: ForestEco2 90-survey Event-only fixed design gate v1.286
on:
  push:
    paths:
      - ".github/workflows/foresteco2-event-only-qualification-v1_286.yml"
      - "development/foresteco2_event_only_qualification_protocol_v1_286.json"
      - "scripts/foresteco2_event_only_qualification_v1_286.py"
      - "tests/test_foresteco2_event_only_qualification_v1_286.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forest-site-structure-before-plant-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Verify exactly 90 plots, 9 island-habitat groups and source firewall in synthetic fixtures
        run: python -m pytest -q tests/test_foresteco2_event_only_qualification_v1_286.py
      - name: Open ONLY SHA-locked original Event geometry and forest type
        run: |
          python scripts/foresteco2_event_only_qualification_v1_286.py \
            --protocol development/foresteco2_event_only_qualification_protocol_v1_286.json \
            --out foresteco2_event_only_result_v1_286.json
      - name: Check group and no biological response access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("foresteco2_event_only_result_v1_286.json").read_text(encoding="utf-8"))
          assert r["status"]=="EVENT_90_BY_9_PHYSICAL_DESIGN_QUALIFIED_OCCURRENCE_UNOPENED"
          assert r["original_author_events"]==90
          assert r["distinct_original_site_ids"]==90
          assert r["Occurrence_data_rows_opened"]==0
          assert r["S1_workbook_rows_opened"]==0
          assert r["biological_predictions_scored"]==0
          assert r["GEB_scientific_HOLD"] and r["new_confirmatory_systems"]==0 and r["eBird_used"] is False
          print("PASS: nine original plot strata, zero plant response rows")
          PY
      - name: Retain only aggregated site and forest class receipt, no site identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foresteco2-original-event-only-v1-286
          path: foresteco2_event_only_result_v1_286.json
          if-no-files-found: warn
