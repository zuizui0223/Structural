name: SW Finland logx counts to exact sources v1.174.2

on:
  push:
    branches:
      - main
    paths:
      - development/sw_finland_numeric_count_to_sources_request_v1_174_2.json

permissions:
  contents: write

jobs:
  exact-sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact v1.173.4 authority binding
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          req=json.loads(Path("development/sw_finland_numeric_count_to_sources_request_v1_174_2.json").read_text())
          assert req["status"]=="REQUEST_T0_LOGX_COUNTS_TO_EXACT_SOURCES"
          assert req["future_outcome_access_requested"] is False
          assert req["one_shot"] is True
          for key,path in {
            "receipt":"development/sw_finland_historical_source_count_calibration_v1_173_4.json",
            "species":"development/sw_finland_historical_source_count_recovery_v1_173_4.csv",
            "excluded":"development/sw_finland_historical_source_count_excluded_v1_173_4.csv",
          }.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==req["input_sha256"][key]
          r=json.loads(Path("development/sw_finland_historical_source_count_calibration_v1_173_4.json").read_text())
          assert r["status"]=="NUMERIC_T0_HISTORICAL_SOURCE_COUNTS_RECOVERED_LOGX"
          assert r["future_outcome_values_opened"]==0
          PY
      - name: Download exact archive and route t0 only
        run: |
          set -euo pipefail
          mkdir -p build/swf_v1742/raw build/swf_v1742/safe build/swf_v1742/out
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          u="https://zenodo.org/records/4942881/files/colonization_select.csv?download=1";p=Path("build/swf_v1742/raw/a.csv");m=hashlib.md5();s=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"Structural-v1.174.2"}),timeout=180) as src,p.open("wb") as dst:
              while True:
                  b=src.read(1024*1024)
                  if not b:break
                  dst.write(b);m.update(b);s.update(b)
          if m.hexdigest()!="ff648878946ba430fb86c4ab2aa02baa" or s.hexdigest()!="72b631033ef36210ee19b151dc4f6569760262d68f70b9ce6de6c8a11afeb957":raise SystemExit("archive identity mismatch")
          PY
          python scripts/route_sw_finland_t0_columns_v1_169.py build/swf_v1742/raw/a.csv --safe-output build/swf_v1742/safe/t0.csv --receipt build/swf_v1742/out/router.json
      - name: Reconstruct exact historical source identities
        run: |
          python scripts/promote_sw_finland_logx_counts_to_sources_v1_174_2.py             build/swf_v1742/safe/t0.csv             development/sw_finland_historical_source_count_recovery_v1_173_4.csv             development/sw_finland_historical_source_count_excluded_v1_173_4.csv             --router-receipt build/swf_v1742/out/router.json             --count-receipt development/sw_finland_historical_source_count_calibration_v1_173_4.json             --species-output build/swf_v1742/out/species.csv             --membership-output build/swf_v1742/out/membership.csv             --geometry-output build/swf_v1742/out/geometry.csv             --receipt build/swf_v1742/out/receipt.json
      - name: Delete raw and row-level safe data
        if: always()
        run: rm -rf build/swf_v1742/raw build/swf_v1742/safe
      - name: Verify and commit canonical exact-source products
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/swf_v1742/out/receipt.json").read_text())
          assert r["status"]=="T0_EXACT_SOURCE_IDENTITIES_FROZEN_FUTURE_OUTCOME_SEALED"
          assert r["numeric_authority_species"]==312
          assert r["excluded_nonnumeric_species"]==275
          assert r["exact_source_species"]>=30
          assert r["impossible_species"]==0
          assert r["future_outcome_values_opened"]==0
          PY
          cp build/swf_v1742/out/species.csv development/sw_finland_exact_source_species_v1_171.csv
          cp build/swf_v1742/out/membership.csv development/sw_finland_exact_source_membership_v1_171.csv
          cp build/swf_v1742/out/geometry.csv development/sw_finland_t0_island_geometry_v1_171.csv
          cp build/swf_v1742/out/receipt.json development/sw_finland_exact_source_reconstruction_v1_171.json
          git add development/sw_finland_exact_source_species_v1_171.csv development/sw_finland_exact_source_membership_v1_171.csv development/sw_finland_t0_island_geometry_v1_171.csv development/sw_finland_exact_source_reconstruction_v1_171.json
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze SW Finland exact source identities from logx counts v1.174.2"
          git push origin HEAD:main
