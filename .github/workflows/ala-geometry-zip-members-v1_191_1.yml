name: ALA geometry ZIP membership metadata v1.191.1
on:
  push:
    branches: [audit/ala-zip-members-v1-191-1]
permissions:
  contents: read
jobs:
  zip-names-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen original geography ZIP and print only ZIP member names
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,zipfile,io
          from pathlib import Path
          c=json.loads(Path("development/global_mammals_ala_island_geometry_gate_v1_191.json").read_text())
          s=c["source"]
          assert s["response_mammals_zip_must_not_be_downloaded"] is True
          url="https://raw.githubusercontent.com/"+s["repository"]+"/"+s["source_commit"]+"/"+s["geometry_zip"]
          req=urllib.request.Request(url,headers={"User-Agent":"Structural-v1.191.1-ZIP-metadata-only"})
          with urllib.request.urlopen(req,timeout=120) as f:
              blob=f.read(s["geometry_zip_size_bytes"]+1)
          assert len(blob)==s["geometry_zip_size_bytes"]
          sha=hashlib.sha1(b"blob "+str(len(blob)).encode()+b"\0"+blob).hexdigest()
          assert sha==s["geometry_blob_sha1"]
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              assert z.testzip() is None
              members=[{"name":x.filename,"bytes":x.file_size} for x in z.infolist()]
          print(json.dumps({
              "schema":"structural.ala_island_geometry_zip_members.v1_191_1",
              "status":"RESPONSE_FREE_ZIP_MEMBER_NAMES_ONLY",
              "shp_members":[x for x in members if x["name"].lower().endswith(".shp")],
              "all_members":members,
              "external_mammal_observations_opened":0,
              "original_heldout_responses_opened":0
          },sort_keys=True))
          PY
