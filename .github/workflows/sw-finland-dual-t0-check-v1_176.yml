name: SW Finland dual t0 source v1.176 response-free checks

on:
  push:
    branches:
      - analysis/sw-finland-dual-t0-source-gate-v1-176
  pull_request:
    paths:
      - development/sw_finland_dual_t0_source_identity_contract_v1_176.json
      - scripts/validate_sw_finland_dual_t0_sources_v1_176.py
      - tests/test_sw_finland_dual_t0_sources_v1_176.py
      - .github/workflows/sw-finland-dual-t0-check-v1_176.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: python -m pytest -q tests/test_sw_finland_dual_t0_sources_v1_176.py
