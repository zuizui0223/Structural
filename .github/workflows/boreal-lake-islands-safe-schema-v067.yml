name: Boreal lake-islands safe metadata schema v0.67

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  safe-schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact safe-file download links and open headers only
        run: |
          mkdir -p build/boreal_safe_schema_v067
          python - <<'PY'
          import csv, hashlib, io, json
          from urllib.parse import urljoin
          from pathlib import Path
          from urllib.request import Request, urlopen

          A=json.loads(Path(
              "development/boreal_lake_islands_safe_schema_authorization_v0_67.json"
          ).read_text())
          assert A["status"]=="one_shot_safe_metadata_header_only_retry_after_relative_url_bug"

          headers={
              "Accept":"application/json",
              "X-API-Version":"2.1.0",
              "User-Agent":"Structural-boreal-safe-schema/0.66"
          }
          req=Request(A["dryad"]["files_api"],headers=headers,method="GET")
          with urlopen(req,timeout=60) as r:
              meta=json.loads(r.read())

          emb=meta.get("_embedded") or {}
          rows=emb.get("stash:files") or emb.get("files") or []
          assert rows, "Dryad files list empty"
          by_path={r.get("path"):r for r in rows}

          def download_href(row):
              links=row.get("_links") or {}
              # Prefer an explicit download relation returned by Dryad metadata.
              for key,val in links.items():
                  if "download" in key.lower():
                      if isinstance(val,dict) and val.get("href"):
                          return val["href"]
                      if isinstance(val,str):
                          return val
              for key in ("downloadUrl","download_url"):
                  if row.get(key):
                      return row[key]
              return None

          out_files=[]
          total_content_requests=0

          for spec in A["safe_files"]:
              row=by_path.get(spec["path"])
              assert row is not None, spec["path"]
              observed_id=row.get("id")
              if observed_id is not None:
                  assert int(observed_id)==spec["file_id"],(spec["path"],observed_id,spec["file_id"])
              assert int(row.get("size"))==spec["size"]
              digest=row.get("digest")
              if digest:
                  assert digest==spec["sha256"],(spec["path"],digest,spec["sha256"])

              href=download_href(row)
              assert href, f"Dryad metadata exposes no download relation for {spec['path']}"
              url=urljoin("https://datadryad.org", href)
              freq=Request(
                  url,
                  headers={"User-Agent":"Structural-boreal-safe-schema/0.66"},
                  method="GET"
              )
              with urlopen(freq,timeout=60) as r:
                  raw=r.read()
              total_content_requests+=1

              assert len(raw)==spec["size"],(spec["path"],len(raw),spec["size"])
              assert hashlib.sha256(raw).hexdigest()==spec["sha256"],spec["path"]

              # Semantic ceiling: decode only first physical line / CSV header.
              first=raw.splitlines()[0]
              header=next(csv.reader(io.StringIO(first.decode("utf-8-sig"))))
              assert header and all(x.strip() for x in header)

              out_files.append({
                  "path":spec["path"],
                  "file_id":spec["file_id"],
                  "role":spec["role"],
                  "size_bytes":spec["size"],
                  "sha256":spec["sha256"],
                  "headers":header,
                  "header_count":len(header),
                  "rows_2_plus_semantically_parsed":0
              })

          result={
              "schema":"structural.boreal_lake_islands_safe_schema_result.v0_66",
              "status":"safe_headers_opened_biological_response_sealed",
              "candidate_id":A["candidate_id"],
              "files":out_files,
              "safe_file_content_requests":total_content_requests,
              "safe_rows_2_plus_semantically_parsed":0,
              "biological_response_http_requests":0,
              "biological_response_values_opened":False,
              "counts_as_empirical_evidence":False
          }
          p=Path("build/boreal_safe_schema_v067/safe_schema.json")
          p.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(p.read_text())
          PY

      - name: Enforce schema-only firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path(
              "build/boreal_safe_schema_v067/safe_schema.json"
          ).read_text())
          assert x["status"]=="safe_headers_opened_biological_response_sealed"
          assert x["safe_rows_2_plus_semantically_parsed"]==0
          assert x["biological_response_http_requests"]==0
          assert x["biological_response_values_opened"] is False
          assert len(x["files"])==5
          for f in x["files"]:
              assert f["rows_2_plus_semantically_parsed"]==0
          print("boreal safe-schema firewall intact")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: boreal-lake-islands-safe-schema-v0-66
          path: build/boreal_safe_schema_v067/safe_schema.json
          if-no-files-found: error
          retention-days: 90
