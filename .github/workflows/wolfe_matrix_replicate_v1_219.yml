name: Wolfe matrix jackknife and replicate audit v1.219
on:
  push:
    branches: [analysis/wolfe-joint-predator-v1-209]
    paths:
      - scripts/wolfe_matrix_replicate_robustness_v1_219.py
      - tests/test_wolfe_matrix_replicate_robustness_v1_219.py
      - development/wolfe_matrix_replicate_contract_v1_219.json
      - .github/workflows/wolfe_matrix_replicate_v1_219.yml
permissions:
  contents: read
jobs:
  source-locked-posthoc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_wolfe_matrix_replicate_robustness_v1_219.py
      - uses: actions/checkout@v4
        with:
          repository: ExperimentalConservation/Experimental-data
          ref: fabe50b58a13651be4168b91cd91589ccc261a96
          path: build/author_source
          persist-credentials: false
      - name: Score source-fingerprinted matrix and replicate checks
        run: |
          python scripts/wolfe_matrix_replicate_robustness_v1_219.py "build/author_source/Wolfe et al. /Wolfe et al experimental data.csv" --out build/wolfe219/result.json
          python - <<'PY'
          import json
          r=json.load(open("build/wolfe219/result.json"))
          assert r["source_blob_sha1"]=="e78003d425b646b390ae02e36c007892c1c70926"
          a=r["six_patch"]["summaries"]["heterogeneous_low_minus_high"]
          assert all(abs(x-y)<1e-12 for x,y in zip(a["all_three_equal_weight"],[.25,1/3]))
          assert all(abs(x-y)<1e-12 for x,y in zip(a["leave_one_matrix_out"]["low"],[0,1/8]))
          p=r["complete_case_replicate_matched"]["6_heterogeneous"]
          assert (p["paired_units"],p["low_positive_only"],p["high_positive_only"],p["tied"])==(11,4,0,7)
          assert abs(p["hypothetical_exchangeable_sign_test_two_sided"]-.125)<1e-12
          q=r["six_heterogeneous_missing_high_corridor_J_equal_zero_or_one"]
          assert [x["hypothetical_exchangeable_sign_test_two_sided"] for x in q]==[.125,.375]
          print("v1.219 frozen source agreement PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wolfe-v219-matrix-replicate-robustness
          path: build/wolfe219/result.json
          retention-days: 21
