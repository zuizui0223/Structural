name: "Forest NEON secure API token access no-secret safety tests"
on:
  push:
    paths:
      - ".github/workflows/forest-macro-neon-auth-no-secret-tests.yml"
      - "analysis/forest_macro_global/neon_authenticated_beetle_catalog_gate.py"
      - "analysis/forest_macro_global/test_neon_authenticated_beetle_catalog_gate.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_neon_2026_token_safety_without_actual_authenticated_access:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test synthetic token only via HTTP header, response no signed links and no unauthenticated species download
        run: |
          python -m pip install pytest
          python -m pytest -q analysis/forest_macro_global/test_neon_authenticated_beetle_catalog_gate.py
      - name: Verify no-secret run stops without trying original NEON file downloads
        run: |
          env -u NEON_API_TOKEN python analysis/forest_macro_global/neon_authenticated_beetle_catalog_gate.py \
            --out neon_credential_absent_safety_gate
      - name: Require empty-token stopped state and no original biological effects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("neon_credential_absent_safety_gate/NEON_original_secret_backed_access_manifest.json").read_text())
          assert q["schema"]=="structural.NEON_2026_authenticated_file_catalog_source_gate.v1"
          assert q["access_status"]=="SCIENTIFIC_SOURCE_STOP_SECRET_NOT_CONFIGURED"
          assert not q["source_api_authentication_verified"]
          assert q["original_file_catalog_n"] is None
          assert q["original_beetle_data_files_downloaded"]==0
          assert q["raw_token_or_signed_URL_or_taxa_never_saved"]
          assert not q["forest_beetle_temperature_or_movement_effect_scored"]
          PY
      - name: Preserve source no-secret state manifest, not original data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-macro-neon-safe-secret-absent-access-test
          path: neon_credential_absent_safety_gate/
          if-no-files-found: warn
