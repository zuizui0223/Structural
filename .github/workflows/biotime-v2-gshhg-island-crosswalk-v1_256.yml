name: BioTIME 2.0 GSHHG island polygon feasibility v1.256

on:
  push:
    paths:
      - ".github/workflows/biotime-v2-gshhg-island-crosswalk-v1_256.yml"
      - "development/biotime_v2_gshhg_island_crosswalk_protocol_v1_256.json"
      - "scripts/biotime_v2_gshhg_strict_site_export_v1_256.R"
      - "scripts/biotime_v2_gshhg_island_crosswalk_v1_256.py"
      - "tests/test_biotime_v2_gshhg_island_crosswalk_v1_256.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  island-polygons-no-response:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-locked polygon interpreter and test dependencies
        run: python -m pip install 'shapely>=2,<3' 'pyproj>=3,<4' 'pyshp>=2,<3' pytest
      - name: Check island, mainland and shoreline rules on synthetic geometry
        run: python -m pytest -q tests/test_biotime_v2_gshhg_island_crosswalk_v1_256.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install R physical frame extraction dependencies
        run: Rscript -e 'install.packages(c("data.table","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Source-lock original 2025 BioTIME RDS and metadata
        run: |
          python scripts/biotime_v2_full_source_transport_v1_250.py \
            --out-rds biotime_v2_query_15April25.rds \
            --out-meta biotime_v2_metadata_15April25.csv \
            --out-receipt biotime_v2_island_physical_source_receipt_v1_256.json
      - name: Extract only 33 frozen study-network strict physical locations; NEVER taxon
        run: |
          Rscript scripts/biotime_v2_gshhg_strict_site_export_v1_256.R \
            biotime_v2_query_15April25.rds \
            development/biotime_v2_conservative_network_cohort_v1_255.json \
            development/biotime_v2_gshhg_island_crosswalk_protocol_v1_256.json \
            biotime_v2_island_physical_site_inputs_v1_256.csv
      - name: Verify tagged original GSHHG h L1 polygons and count actual island sites
        run: |
          python scripts/biotime_v2_gshhg_island_crosswalk_v1_256.py \
            --sites biotime_v2_island_physical_site_inputs_v1_256.csv \
            --cohort development/biotime_v2_conservative_network_cohort_v1_255.json \
            --protocol development/biotime_v2_gshhg_island_crosswalk_protocol_v1_256.json \
            --summary-out biotime_v2_island_polygon_feasibility_v1_256.json \
            --studies-out biotime_v2_island_polygon_study_summaries_v1_256.csv
      - name: Assert fixed 33 study networks, literal land membership and no taxon inputs
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          j=json.loads(Path("biotime_v2_island_polygon_feasibility_v1_256.json").read_text())
          assert j["schema"]=="structural.biotime_gshhg_island_crosswalk.v1_256"
          assert j["study_network_candidates"]==33
          assert j["gshhg_source"]["bytes"]==149157845
          assert j["future_33_study_species_responses_opened"]==0
          assert not j["global_oceanic_vs_continental_island_origin_verified"]
          assert j["marine_sampling_sites_never_relabelled_as_island_land_studies"]
          with open("biotime_v2_island_polygon_study_summaries_v1_256.csv",newline="") as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==33
          assert len({r["study"] for r in rows})==33
          assert all("latitude" not in r and "longitude" not in r and "ABUNDANCE" not in r for r in rows)
          print("ISLAND GEO ONLY",j["strict_multi_island_study_network_total"],"multi-island study-network proxies")
          PY
      - name: Retain only GIS source fingerprint and aggregate per-study polygon counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biotime-v2-gshhg-island-feasibility-v1-256
          path: |
            biotime_v2_island_physical_source_receipt_v1_256.json
            biotime_v2_island_polygon_feasibility_v1_256.json
            biotime_v2_island_polygon_study_summaries_v1_256.csv
          if-no-files-found: warn
      - name: Delete raw public RDS and coordinate-level GIS inputs from workflow
        if: always()
        run: |
          rm -f biotime_v2_query_15April25.rds \
            biotime_v2_query_15April25.rds.partial \
            biotime_v2_metadata_15April25.csv \
            biotime_v2_island_physical_site_inputs_v1_256.csv
