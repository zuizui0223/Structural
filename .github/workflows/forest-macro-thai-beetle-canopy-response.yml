name: Thai beetle canopy vs understorey actual SLAM family response
on:
  push:
    paths:
      - ".github/workflows/forest-macro-thai-beetle-canopy-response.yml"
      - "analysis/forest_macro_global/thai_beetle_canopy_family_response.py"
      - "analysis/forest_macro_global/test_thai_beetle_canopy_family_response.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_two_forest_SLAM_beetle_vertical_community:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests with strict two-forest response, sampling-method and taxonomic controls
        run: |
          python -m pip install pytest
          python -m pytest -q analysis/forest_macro_global/test_thai_beetle_canopy_family_response.py
      - name: Reacquire original licensed GBIF beetle archive and score SLAM canopy vs understorey
        run: |
          python analysis/forest_macro_global/thai_beetle_canopy_family_response.py \
            --out thai_beetle_canopy_exploratory_results
      - name: Check exact original biological denominator and separate forest replication
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          j=json.loads(Path("thai_beetle_canopy_exploratory_results/thai_beetle_canopy_SLAM_forest_family_results.json").read_text())
          assert j["schema"]=="structural.thai_forest_beetle_canopy_SLAM_original_response.v1"
          assert j["source_field_original_event_count"]==288
          assert j["published_beetle_specimens_reproduced"]==1622
          assert j["unique_forest_study_regions"]==2
          assert j["SLAM_jar_events_per_layer"]=={"canopy":72,"understorey":72}
          assert j["canopy_SLAM_beetle_individuals"]+j["understorey_SLAM_beetle_individuals"]==1622
          assert not j["causal_canopy_height_effect_estimated"]
          assert not j["species_level_richness_estimable_from_publisher_rows"]
          assert j["no_raw_coordinates_or_source_eventIDs_exported"]
          PY
      - name: Preserve only two-forest family summaries, never occurrence locations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-macro-thai-canopy-beetle-family-response
          path: thai_beetle_canopy_exploratory_results/
          if-no-files-found: warn
