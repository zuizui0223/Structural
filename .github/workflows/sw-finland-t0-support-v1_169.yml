name: SW Finland t0 source-support audit v1.169

on:
  push:
    branches:
      - main
    paths:
      - development/sw_finland_t0_support_audit_request_v1_169.json

permissions:
  contents: write

jobs:
  t0-safe-support:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate response-independent request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("development/sw_finland_t0_support_audit_request_v1_169.json").read_text())
          assert r["status"]=="REQUEST_T0_SAFE_SOURCE_SUPPORT_AUDIT"
          assert r["canonical_header_freeze"]=="development/sw_finland_header_freeze_v1_167.json"
          assert r["future_outcome_values_opened_before_request"]==0
          assert r["future_outcome_access_requested"] is False
          assert r["effect_estimate_requested"] is False
          assert r["eBird_used"] is False
          PY

      - name: Download exact archive bytes
        run: |
          set -euo pipefail
          mkdir -p build/swf_v169/raw build/swf_v169/safe build/swf_v169/out
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          url="https://zenodo.org/records/4942881/files/colonization_select.csv?download=1"
          expected_md5="ff648878946ba430fb86c4ab2aa02baa"
          expected_sha="72b631033ef36210ee19b151dc4f6569760262d68f70b9ce6de6c8a11afeb957"
          out=Path("build/swf_v169/raw/colonization_select.csv")
          md5=hashlib.md5();sha=hashlib.sha256()
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Structural-v1.169"}),timeout=180) as src,out.open("wb") as dst:
            while True:
              b=src.read(1024*1024)
              if not b:break
              dst.write(b);md5.update(b);sha.update(b)
          if md5.hexdigest()!=expected_md5 or sha.hexdigest()!=expected_sha:
            out.unlink(missing_ok=True);raise SystemExit("exact archive identity mismatch")
          PY

      - name: Route t0 safe columns with outcome opaque
        run: |
          python scripts/route_sw_finland_t0_columns_v1_169.py \
            build/swf_v169/raw/colonization_select.csv \
            --safe-output build/swf_v169/safe/t0_safe.csv \
            --receipt build/swf_v169/out/router.json

      - name: Audit direct source-count support
        run: |
          python scripts/audit_sw_finland_t0_source_count_support_v1_169.py \
            build/swf_v169/safe/t0_safe.csv \
            --router-receipt build/swf_v169/out/router.json \
            --receipt build/swf_v169/out/source_support.json

      - name: Delete row-level archive and safe projection
        if: always()
        run: |
          rm -rf build/swf_v169/raw build/swf_v169/safe

      - name: Verify response boundary and persist aggregate receipts
        run: |
          set -euo pipefail
          test ! -e build/swf_v169/raw
          test ! -e build/swf_v169/safe
          python - <<'PY'
          import json
          from pathlib import Path
          o=Path("build/swf_v169/out")
          r=json.loads((o/"router.json").read_text())
          s=json.loads((o/"source_support.json").read_text())
          assert r["status"]=="T0_SAFE_COLUMNS_ROUTED_PROTECTED_OUTCOME_OPAQUE"
          assert r["protected_field_values_decoded"]==0
          assert r["protected_field_bytes_persisted"]==0
          assert r["outcome_values_read"]==0
          assert r["future_outcome_opened"] is False
          assert s["protected_field_values_decoded"]==0
          assert s["outcome_values_read"]==0
          assert s["future_outcome_opened"] is False
          Path("development/sw_finland_t0_router_receipt_v1_169.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          Path("development/sw_finland_t0_source_count_support_v1_169.json").write_text(json.dumps(s,indent=2,sort_keys=True)+"\n")
          PY
          git add development/sw_finland_t0_router_receipt_v1_169.json development/sw_finland_t0_source_count_support_v1_169.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze SW Finland t0 source-support audit v1.169"
          git push origin HEAD:main
