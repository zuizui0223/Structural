name: BALA 7-island spatial beta direction source-free known-truth v1.318
on:
  push:
    paths:
      - ".github/workflows/bala-spatial-beta-synthetic-v1_318.yml"
      - "development/bala_spatial_homogenization_pre_response_protocol_v1_318.json"
      - "scripts/bala_original_island_spatial_beta_v1_318.py"
      - "tests/test_bala_original_island_spatial_beta_v1_318.py"
  pull_request:
    paths:
      - ".github/workflows/bala-spatial-beta-synthetic-v1_318.yml"
      - "development/bala_spatial_homogenization_pre_response_protocol_v1_318.json"
      - "scripts/bala_original_island_spatial_beta_v1_318.py"
      - "tests/test_bala_original_island_spatial_beta_v1_318.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  known-truth-no-original-biology:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install synthetic test runner
        run: python -m pip install pytest
      - name: Verify 29 original physical sites can homogenize or differentiate under same alpha
        run: python -m pytest -q tests/test_bala_original_island_spatial_beta_v1_318.py
      - name: Original seven-island BALA Occurrence source untouched
        run: |
          echo "SYNTHETIC ONLY: original 63904 source species records NOT reopened in this workflow"
