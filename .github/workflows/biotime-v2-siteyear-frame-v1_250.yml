name: BioTIME 2.0 original-source survey frame v1.250

on:
  push:
    paths:
      - ".github/workflows/biotime-v2-siteyear-frame-v1_250.yml"
      - "scripts/biotime_v2_full_source_transport_v1_250.py"
      - "scripts/biotime_v2_sample_frame_v1_250.R"
      - "scripts/biotime_v2_siteyear_frame_report_v1_250.py"
      - "tests/test_biotime_v2_siteyear_frame_v1_250.py"
      - "docs/BIOTIME_GLOBAL_TEMPORAL_ECOLOGY_V1_249.md"
  pull_request:
    paths:
      - ".github/workflows/biotime-v2-siteyear-frame-v1_250.yml"
      - "scripts/biotime_v2_full_source_transport_v1_250.py"
      - "scripts/biotime_v2_sample_frame_v1_250.R"
      - "scripts/biotime_v2_siteyear_frame_report_v1_250.py"
      - "tests/test_biotime_v2_siteyear_frame_v1_250.py"

permissions:
  contents: read

jobs:
  frame-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test sampling frame report guards
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_biotime_v2_siteyear_frame_v1_250.py tests/test_biotime_v2_metadata_preflight_v1_249.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install efficient fixed-frame grouping
        run: Rscript -e 'install.packages("data.table", repos = "https://cloud.r-project.org")'
      - name: Verify original 2025 BioTIME RDS and study metadata from publisher
        run: |
          python scripts/biotime_v2_full_source_transport_v1_250.py \
            --out-rds biotime_v2_query_15April25.rds \
            --out-meta biotime_v2_metadata_15April25.csv \
            --out-receipt biotime_source_transport_v1_250.json
      - name: Count physical, repeated study-site-year sampling frame (NO taxon response)
        run: |
          Rscript scripts/biotime_v2_sample_frame_v1_250.R \
            biotime_v2_query_15April25.rds \
            biotime_v2_metadata_15April25.csv \
            biotime_siteyear_frame_v1_250.csv
      - name: Freeze sampled-site-year denominator aggregates
        run: |
          python scripts/biotime_v2_siteyear_frame_report_v1_250.py \
            --csv biotime_siteyear_frame_v1_250.csv \
            --transport biotime_source_transport_v1_250.json \
            --out biotime_siteyear_frame_v1_250.json
      - name: Upload source receipt and response-free site-year counts ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biotime-v2-siteyear-frame-only-v1-250
          path: |
            biotime_source_transport_v1_250.json
            biotime_siteyear_frame_v1_250.csv
            biotime_siteyear_frame_v1_250.json
          if-no-files-found: warn
      - name: Prohibit archival retention of original 174 MB biological RDS
        if: always()
        run: rm -f biotime_v2_query_15April25.rds biotime_v2_query_15April25.rds.partial
