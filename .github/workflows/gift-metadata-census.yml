name: GIFT response-blind metadata census

on:
  pull_request:
    branches: [main]
    paths:
      - "research/gift_global_archipelago/**"
      - ".github/workflows/gift-metadata-census.yml"

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry-only exclusion dependencies
        run: python -m pip install pyshp shapely openpyxl
      - name: Run response-blind GIFT 3.2 metadata census
        env:
          GIFT_VERSION: "3.2"
        run: python research/gift_global_archipelago/metadata_census_v0_1.py | tee gift_metadata_census.json
      - name: Assert species composition stayed sealed
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_metadata_census.json"))
          assert x["gift_version"] == "3.2"
          assert x["response_values_accessed"] is False
          assert x["species_composition_endpoint_called"] is False
          assert x["response_surface_manifest"]["response_values_accessed"] is False
          assert len(x["response_surface_manifest"]["records_sha256"]) == 64
          assert len(x["source_fingerprint"]) == 64
          print("RESPONSE_SEALED_OK", x["gift_version"])
          PY
      - name: Freeze closed A-Islands geometry exclusion
        env:
          GIFT_VERSION: "3.2"
        run: python research/gift_global_archipelago/freeze_closed_system_exclusion_v0_1.py | tee gift_aislands_exclusion.json
      - name: Assert exclusion used geometry only
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_aislands_exclusion.json"))
          assert x["response_values_accessed"] is False
          assert x["gift_species_composition_endpoint_called"] is False
          assert x["aislands_species_data_requested"] is False
          assert x["excluded_gift_entity_count"] >= 1
          assert len(x["receipt_sha256"]) == 64
          print("GEOMETRY_ONLY_EXCLUSION_OK", x["excluded_gift_entity_count"])
          PY
      - name: Cross-check frozen GIFT intake source identity
        run: |
          python - <<'PY'
          import hashlib, json
          census=json.load(open("gift_metadata_census.json"))
          exclusion=json.load(open("gift_aislands_exclusion.json"))
          intake=json.load(open("research/gift_global_archipelago/intake_v0_10.json"))
          payload={
              "gift_source_fingerprint": census["source_fingerprint"],
              "exclusion_receipt_sha256": exclusion["receipt_sha256"],
          }
          observed=hashlib.sha256(
              json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          assert observed == intake["source_fingerprint"]
          assert census["response_surface_manifest"]["records_sha256"] == (
              "b58116ad0f44cfe395086a0e5e799f0b62df5ad1dfd712ffbdfed9874af61d99"
          )
          assert exclusion["after_conservative_archipelago_exclusion"]["groups_by_minimum_island_count"]["12"] == 24
          assert intake["study_specific_frozen_state"]["response_access_granularity"].startswith("GIFT checklist API")
          print("INTAKE_SOURCE_IDENTITY_OK", observed)
          PY
      - name: Validate GIFT independent-system intake v0.10
        run: python scripts/validate_independent_system_intake_v0_10.py research/gift_global_archipelago/intake_v0_10.json | tee gift_intake_receipt.json
      - name: Assert intake authorizes only v0.31 construction
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_intake_receipt.json"))
          assert x["status"] == "eligible_to_construct_v0_31_partition_protocol"
          assert x["v0_31_protocol_construction_authorized"] is True
          assert x["pilot_response_authorized"] is False
          assert x["confirmatory_response_authorized"] is False
          assert x["mechanism_response_authorized"] is False
          assert x["effect_size"] is None
          assert x["prediction_score"] is None
          print("GIFT_INTAKE_PASS")
          PY
      - name: Freeze predictor-complete archipelago universe
        env:
          GIFT_VERSION: "3.2"
        run: python research/gift_global_archipelago/freeze_analysis_universe_v0_1.py --exclusion-json gift_aislands_exclusion.json | tee gift_analysis_universe.json
      - name: Assert final universe is response sealed
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_analysis_universe.json"))
          assert x["response_values_accessed"] is False
          assert x["species_composition_endpoint_called"] is False
          assert x["n_final_archipelagos"] >= 12
          assert x["pilot_archipelago_count"] == 3
          assert x["confirmatory_archipelago_count"] == x["n_final_archipelagos"] - 3
          assert len(x["universe_fingerprint"]) == 64
          assert x["extreme_rules"]["primary_unchanged_from_prospective_v0_3"] is True
          support=x["h1_support_counts"]
          assert support["confirmatory_extreme_contributors"] >= 2
          assert support["confirmatory_nonextreme_contributors"] >= 2
          assert support["confirmatory_paired_contributors"] >= 1
          pilot_lists=set()
          confirm_lists=set()
          pilot_ids=set(x["pilot_archipelagos"])
          for g in x["groups"]:
              assert g["n_islands"] >= 16
              assert len(g["block_sizes"]) == 4
              assert min(g["block_sizes"]) >= 4
              assert max(g["block_sizes"]) - min(g["block_sizes"]) <= 1
              assert sum(g["block_sizes"]) == g["n_islands"]
              target = pilot_lists if g["archipelago_id"] in pilot_ids else confirm_lists
              for island in g["islands"]:
                  target.update(island["list_IDs"])
          assert pilot_lists
          assert confirm_lists
          assert pilot_lists.isdisjoint(confirm_lists)
          print("FINAL_UNIVERSE_FROZEN", x["n_final_archipelagos"], x["n_final_islands"])
          print("PILOT_ARCHIPELAGOS", x["pilot_archipelagos"])
          PY
      - name: Audit exact M4 climate layer metadata
        env:
          GIFT_VERSION: "3.2"
        run: python research/gift_global_archipelago/audit_environment_reference_v0_1.py | tee gift_environment_reference_audit.json
      - name: Assert climate audit stayed response-blind
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_environment_reference_audit.json"))
          assert x["species_composition_accessed"] is False
          assert len(x["candidate_layers"]) > 0
          print("M4_METADATA_AUDIT_OK", len(x["candidate_layers"]))
          PY
      - name: Audit Roeble geology crosswalk source
        run: python research/gift_global_archipelago/audit_roeble_geology_crosswalk_v0_1.py | tee roeble_geology_audit.json
      - name: Assert geology audit stayed response-blind
        run: |
          python - <<'PY'
          import json
          x=json.load(open("roeble_geology_audit.json"))
          assert x["gift_species_composition_accessed"] is False
          assert x["structural_outcome_accessed"] is False
          assert len(x["xlsx_sha256"]) == 64
          assert len(x["sheets"]) >= 1
          print("ROEBLE_GEOLOGY_AUDIT_OK", x["xlsx_sha256"], [s["title"] for s in x["sheets"]])
          PY
      - name: Freeze Roeble geology crosswalk
        run: |
          python research/gift_global_archipelago/freeze_roeble_geology_crosswalk_v0_1.py \
            --universe gift_analysis_universe.json \
            | tee gift_roeble_geology_crosswalk.json
      - name: Assert geology crosswalk stayed pre-response
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_roeble_geology_crosswalk.json"))
          assert x["status"] == "FROZEN_BEFORE_PILOT_RESPONSE"
          assert x["response_values_accessed"] is False
          assert x["gift_species_composition_accessed"] is False
          assert len(x["crosswalk_fingerprint"]) == 64
          print(
              "ROEBLE_CROSSWALK_FROZEN",
              x["confirmatory_quantitative_geology_eligible"],
              x["confirmatory_pure_continental"],
              x["confirmatory_pure_oceanic"],
              x["confirmatory_mixed"],
              x["geology_h2_fraction_slope_estimable"],
          )
          PY
      - name: Freeze GIFT macro-study protocol before pilot response
        run: |
          python research/gift_global_archipelago/freeze_study_protocol_v0_1.py \
            --universe gift_analysis_universe.json \
            --intake-receipt gift_intake_receipt.json \
            --environment-audit gift_environment_reference_audit.json \
            --geology-crosswalk gift_roeble_geology_crosswalk.json \
            | tee gift_study_protocol.json
      - name: Assert study protocol remains pre-response
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_study_protocol.json"))
          assert x["status"] == "FROZEN_BEFORE_PILOT_RESPONSE"
          assert x["response_values_accessed"] is False
          assert x["pilot_response_opened"] is False
          assert x["confirmatory_response_opened"] is False
          assert x["graph_operator"]["primary_radii_km"] == [25.0,50.0,125.0,250.0]
          assert "complete frozen eligible-island universe" in x["isolation_hypothesis"]["primary_rule"]
          assert x["evidence_partition"]["pilot_confirmatory_list_overlap"] == 0
          assert x["burned_pilot_gate"]["effect_sizes_allowed"] is False
          assert x["burned_pilot_gate"]["prediction_scores_allowed"] is False
          geo=x["H2_primary"]["external_geological_type_secondary"]
          assert geo["status"] in {
              "confirmatory_secondary_authorized_pre_response",
              "pre_response_nonestimable_secondary",
          }
          assert len(geo["crosswalk_fingerprint"]) == 64
          assert len(x["protocol_fingerprint"]) == 64
          print("STUDY_PROTOCOL_FROZEN", x["protocol_fingerprint"])
          PY
      - name: Spend burned pilot on frozen pilot lists only
        env:
          GIFT_VERSION: "3.2"
        run: |
          set +e
          python research/gift_global_archipelago/run_burned_pilot_v0_1.py \
            --universe gift_analysis_universe.json \
            --protocol gift_study_protocol.json \
            --raw-output gift_burned_pilot_raw.csv \
            | tee gift_burned_pilot_receipt.json
          rc=${PIPESTATUS[0]}
          echo "GIFT_PILOT_RC=${rc}" >> "${GITHUB_ENV}"
          exit 0
      - name: Verify burned pilot evidence ceiling
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_burned_pilot_receipt.json"))
          assert x["pilot_response_opened"] is True
          assert x["confirmatory_response_opened"] is False
          assert x["confirmatory_list_query_count"] == 0
          assert x["model_fits"] == 0
          assert x["effect_size"] is None
          assert x["prediction_score"] is None
          assert x["predictive_denominator_contribution"] == 0
          assert x["species_names_reported"] is False
          assert x["protocol_fingerprint"] == "7564e576a032b85a9e53c4fdb31b520951dee361d7af0bb9049d93f0d7d0ae60"
          assert x["analysis_universe_fingerprint"] == "dbd9fbb85b6b6adf95fd4c6754284d5562e511f318187b38cb03f7d117c23bf9"
          print("PILOT_EVIDENCE_CEILING_OK", x["status"], x["pilot_receipt_sha256"])
          PY
      - name: Preserve burned pilot receipt and raw response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gift-global-archipelago-burned-pilot-v0-1
          path: |
            gift_burned_pilot_receipt.json
            gift_burned_pilot_raw.csv
            gift_analysis_universe.json
            gift_study_protocol.json
          retention-days: 90
      - name: Adjudicate burned pilot
        run: |
          python - <<'PY'
          import json, os
          x=json.load(open("gift_burned_pilot_receipt.json"))
          print("BURNED_PILOT", x["status"])
          for row in x["archipelago_audits"]:
              print(row["archipelago_id"], "islands=", row["n_islands"],
                    "species=", row["species_with_presence"],
                    "estimable=", row["estimable_species"],
                    "pass=", row["archipelago_pass"])
          if x["status"] != "PILOT_PASS_ESTIMABILITY_ONLY":
              raise SystemExit(2)
          assert x["confirmatory_response_authorized"] is True
          PY
