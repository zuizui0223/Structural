name: Mammal-selected island geography audit v1.219
on:
  push:
    branches:
      - science/geb_mapped_response_claims_v1-217
    paths:
      - development/mammal_safe_geography_request_v1_219.json
      - scripts/compare_mammal_safe_geography_v1_219.py
permissions:
  contents: read
  actions: read
jobs:
  compare-geography:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_mammal_safe_geography_v1_219.py
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-weigelt-safe-rows-v0-60
          path: build/v219/all
          repository: zuizui0223/Structural
          run-id: 36316161135
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v143-reference-fe0e65be12a223fb3f0991afae959cd62ef3aabb-36622553042
          path: build/v219/subset
          repository: zuizui0223/Structural
          run-id: 36622553042
          github-token: ${{ github.token }}
      - name: Compare immutable response-safe geographic characteristics
        run: |
          python scripts/compare_mammal_safe_geography_v1_219.py build/v219/all/weigelt_islanddata_safe_v0_60.csv build/v219/subset/state_reference.csv --out build/v219/out/geography.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v219-safe-geography-summary
          path: build/v219/out/geography.json
          retention-days: 21
