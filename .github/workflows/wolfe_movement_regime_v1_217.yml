name: Wolfe posthoc corridor regime interaction v1.217
on:
  push:
    branches: [analysis/wolfe-joint-predator-v1-209]
    paths:
      - scripts/wolfe_regime_interaction_v1_217.py
      - tests/test_wolfe_regime_interaction_v1_217.py
      - development/wolfe_movement_regime_contract_v1_217.json
      - docs/WOLFE_MOVEMENT_REGIME_INTERACTION_V1_217.md
      - .github/workflows/wolfe_movement_regime_v1_217.yml
permissions:
  contents: read
jobs:
  source-locked-posthoc-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic source-safe tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_wolfe_regime_interaction_v1_217.py
      - uses: actions/checkout@v4
        with:
          repository: ExperimentalConservation/Experimental-data
          ref: fabe50b58a13651be4168b91cd91589ccc261a96
          path: build/author_source
          persist-credentials: false
      - name: Recompute fixed terminal guild contrast in each transfer regime
        run: |
          python scripts/wolfe_regime_interaction_v1_217.py "build/author_source/Wolfe et al. /Wolfe et al experimental data.csv" --out build/wolfe_v217/result.json
          python - <<'PY'
          import json
          d=json.load(open("build/wolfe_v217/result.json"))
          a=d["all_regime_contrast_reproduces_v1_212"]
          for p,expect in [("4",[-1/36,-1/18,-1/36]),("6",[2/9,5/36,1/4])]:
              x=a[p]
              for k,e in zip(("observed_only","missing_lower","missing_upper"),expect):
                  assert abs(x[k]-e)<1e-12,(p,k,x[k],e)
          s=d["regime_contrasts"]["6"]
          assert abs(s["low"]["missing_lower"]-1/3)<1e-12
          assert abs(s["high"]["missing_upper"]-1/12)<1e-12
          print("v1.212 agreement and v1.217 source-lock: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wolfe-v217-posthoc-corridor-regime-audit
          path: build/wolfe_v217/result.json
          retention-days: 21
