name: CamTrapAsia source mammal taxa versus frozen 529 v1.238
on:
  push:
    branches: [science/heldout-geographic-search-index-v1-235]
    paths:
      - development/camtrapasia_taxon_name_contract_v1_238.json
permissions:
  contents: read
  actions: read
jobs:
  field-taxon-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_camtrapasia_taxon_names_v1_238.py
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v112-ultrarare-pilot-03c170e50de4bd21f3c9148b36905e20aecc51d6-37153960728
          path: build/v238/old529
          repository: zuizui0223/Structural
          run-id: 37153960728
          github-token: ${{ github.token }}
      - name: Compare only verified mammal species names from official traits file to 529 frozen taxa
        run: |
          python scripts/camtrapasia_taxon_only_v1_238.py build/v238/old529/ultrarare_species_universe.csv --out build/v238/overlap.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v238-camtrapasia-species-overlap-only
          path: build/v238/overlap.json
          retention-days: 21
