name: Boreal birds response-free checks v1.159

on:
  push:
    branches:
      - reframe/occupancy-dependent-isolation-v1-154
    paths:
      - development/boreal_19island_birds_**
      - development/structural_active_priority_v1_158.json
      - docs/BOREAL_BIRDS_TOPOLOGY_SENSITIVITY_V1_158.md
      - scripts/freeze_boreal_birds_topology_nulls_v1_158.py
      - scripts/run_boreal_19island_bird_pilot_v1_160.py
      - scripts/fetch_boreal_19island_bird_response_v1_160.py
      - src/structural/boreal_19island_bird_pilot_router.py
      - tests/test_boreal_birds_topology_nulls_v1_158.py
      - tests/test_boreal_19island_bird_pilot_router_v1_159.py
      - tests/test_boreal_19island_bird_pilot_executor_v1_160.py
      - tests/test_boreal_19island_bird_pilot_v1_161.py
      - scripts/run_boreal_19island_bird_pilot_v1_161.py
      - src/structural/boreal_19island_bird_pilot_router_v1_161.py
      - development/boreal_19island_birds_pilot_contract_v1_161.json
      - development/boreal_19island_birds_prediction_freeze_contract_v1_163.json
      - development/boreal_19island_bird_pilot_freeze_v1_162.json
      - development/boreal_19island_bird_pilot_snapshot_v1_162.json
      - scripts/freeze_boreal_19island_bird_predictions_v1_163.py
      - tests/test_boreal_19island_bird_predictions_v1_163.py
      - .github/workflows/boreal-birds-response-free-v1_159.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-free:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run boreal bird response-free tests
        run: >
          pytest -q
          tests/test_boreal_birds_topology_nulls_v1_158.py
          tests/test_boreal_19island_bird_pilot_router_v1_159.py
          tests/test_boreal_19island_bird_pilot_executor_v1_160.py
          tests/test_boreal_19island_bird_pilot_v1_161.py
          tests/test_boreal_19island_bird_predictions_v1_163.py
      - name: Assert no response artifact was created
        run: |
          test ! -e development/borealbirds_speciesmatrix_presenceabsence.csv
          test ! -e build/borealbirds_speciesmatrix_presenceabsence.csv
