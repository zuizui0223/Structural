name: GIFT community topology pre-response freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "research/gift_community_topology/**"
      - ".github/workflows/gift-community-topology.yml"

permissions:
  contents: read

concurrency:
  group: gift-community-topology-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install predictor-only dependencies
        run: python -m pip install pyshp shapely numpy
      - name: Replay v0.1 predictor-only STOP boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("research/gift_community_topology/pre_response_stop_v0_1.json"))
          assert x["status"] == "STOP_PRE_RESPONSE_NON_ESTIMABLE"
          assert x["response_values_accessed"] is False
          assert x["species_composition_endpoint_called"] is False
          assert x["extreme_topology_gain_nonzero_islands"] == 0
          print("V0_1_PRE_RESPONSE_STOP_REPLAY_OK", x["panel_fingerprint"])
          PY
      - name: Freeze v0.2 common three-clade predictor panel
        run: |
          python research/gift_community_topology/freeze_common_panel_v0_2.py \
            --prior-exclusions research/gift_community_topology/prior_response_exclusions_v0_1.json \
            | tee gift_community_panel.json
      - name: Assert community response remains sealed
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_community_panel.json"))
          assert x["schema"] == "structural.gift_community_topology_panel.v0_2"
          assert x["status"] == "FROZEN_PREDICTOR_PANEL_RESPONSE_SEALED"
          assert x["species_composition_endpoint_called"] is False
          assert x["response_values_accessed"] is False
          assert x["targets"] == ["Angiospermae","Pteridophyta","Gymnospermae"]
          assert all(v["opened"] is False for v in x["response_surfaces"].values())
          assert x["n_final_archipelagos"] >= 10
          assert x["n_final_islands"] >= 100
          assert len(x["panel_fingerprint"]) == 64
          print("COMMUNITY_PANEL_FROZEN", x["n_final_archipelagos"], x["n_final_islands"], x["support"], x["panel_fingerprint"])
          PY
      - name: Replay terminal H2 pre-response closure
        run: |
          python - <<'PY'
          import json
          x=json.load(open("research/gift_community_topology/pre_response_h2_stop_v0_4.json"))
          assert x["status"] == "H2_TERMINAL_PRE_RESPONSE_NON_ESTIMABLE"
          assert x["response_values_accessed"] is False
          assert x["species_composition_endpoint_called"] is False
          assert x["terminal_boundary"]["H2_will_not_be_tested_in_this_dataset"] is True
          assert x["terminal_boundary"]["H2_cannot_be_rescued_by_post_response_analysis"] is True
          assert x["terminal_boundary"]["H1_H3_may_proceed_under_unchanged_pre_response_definitions"] is True
          print("H2_TERMINAL_PRE_RESPONSE_CLOSURE_OK")
          PY
      - name: Freeze final H1 H3 community protocol v0.5
        run: |
          python research/gift_community_topology/freeze_protocol_v0_5.py \
            --panel gift_community_panel.json \
            --prior-exclusions research/gift_community_topology/prior_response_exclusions_v0_1.json \
            --h2-terminal research/gift_community_topology/pre_response_h2_stop_v0_4.json \
            | tee gift_community_protocol.json
      - name: Assert predictor-only estimability before response
        run: |
          python - <<'PY'
          import json
          x=json.load(open("gift_community_protocol.json"))
          assert x["schema"] == "structural.gift_community_topology_protocol.v0_5"
          assert x["status"] == "QUALIFIED_TO_OPEN_COMMUNITY_RESPONSE"
          assert x["response_values_accessed"] is False
          assert x["response_open_authorized"] is True
          assert all(x["pre_response_gates"].values())
          assert x["H1_primary"]["prediction"].startswith("positive")
          assert x["H2"]["status"] == "TERMINAL_PRE_RESPONSE_NON_ESTIMABLE_NOT_TESTED"
          assert x["H2"]["cannot_be_reintroduced_after_response"] is True
          assert x["pre_response_gates"]["all_clade_H1_models_full_rank"] is True
          assert x["pre_response_gates"]["all_clade_H1_targets_retained"] is True
          assert set(x["pre_response_matrix_audits"]["H1_by_clade"]) == {
              "Angiospermae","Pteridophyta","Gymnospermae"
          }
          assert x["H1_primary"]["prediction"] == "positive"
          assert x["H3_primary"]["prediction"] == "negative"
          assert x["H3_primary"]["prediction"].startswith("negative")
          assert x["H3_primary"]["uses_same_per_clade_H1_models"] is True
          b=x["model"]["bootstrap_design"]
          assert b["accepted_replicates"] == 10000
          assert b["requested_replicates"] == 10000
          assert len(b["accepted_draws_sha256"]) == 64
          assert x["pre_response_gates"]["bootstrap_draw_set_complete"] is True
          assert len(x["protocol_fingerprint"]) == 64
          print("COMMUNITY_PROTOCOL_QUALIFIED", x["protocol_fingerprint"])
          print("MATRIX_AUDITS", x["pre_response_matrix_audits"])
          PY
      - name: Assert CI has no checklist response query
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/gift-community-topology.yml").read_text()
          checklist_query="query"+"=checklists"
          opener="open_"+"community_response"
          assert checklist_query not in wf
          assert opener not in wf
          print("NO_COMMUNITY_RESPONSE_ACCESS_IN_FREEZE_CI")
          PY
