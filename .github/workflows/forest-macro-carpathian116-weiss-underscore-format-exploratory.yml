name: "Forest macro Carpathian116 Weiss511 secondary one-underscore taxon formatting"
on:
  push:
    branches:
      - analysis/forest-macro-plot-environment
    paths:
      - "analysis/forest_macro_global/carpathian116_weiss_underscore_format_exploratory.py"
      - "docs/FOREST_MACRO_CARPATHIAN116_GLOOR_WEISS_UNDERSCORE_FORMAT_EXPLORATORY_PRESPEC_20261118.md"
      - ".github/workflows/forest-macro-carpathian116-weiss-underscore-format-exploratory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secondary_exploratory_source_taxonomic_format_ONLY:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Ensure original PLOS OLE guild reference reader"
        run: |
          if ! command -v libreoffice >/dev/null && ! command -v soffice >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer
          fi
      - name: "Synthetic only one strictly qualified underscore and 0 biological rows"
        run: |
          python analysis/forest_macro_global/carpathian116_weiss_underscore_format_exploratory.py --test
      - name: "Original publisher-fingerprinted first taxon headers and source-verified Weiss ontology, no Gloor outcomes"
        run: |
          python analysis/forest_macro_global/carpathian116_weiss_underscore_format_exploratory.py \
            --out CARPATHIAN116_WEISS_FORMAT_SENSITIVITY
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("CARPATHIAN116_WEISS_FORMAT_SENSITIVITY/Carpathian116_Weiss511_genus_underscore_species_format_secondary_coverage.json").read_text())
          assert r["schema"]=="structural.Carpathian116_Weiss511_single_underscore_exploratory_source_nameonly.v1"
          assert r["primary_prior_exact_0of309_HOLD_UNCHANGED"]
          assert not r["source_Gloor_abundance_site_environment_rows_OPENED"]
          assert r["old_Finland_Chiu_Piccini_BELongDead_PREDICTS_NEON_BALA_GEB_scores_UNCHANGED"]
          assert not r["new_ecological_effect"]
          assert not r["eBird_used"] and not r["TinyFish_used"]
          if "secondary_format_sensitivity_anonymous_only" in r:
              q=r["secondary_format_sensitivity_anonymous_only"]
              assert q["Gloor_raw_union_taxon_columns"]==309
              assert q["Gloor_raw_primary_exact_match_count_UNCHANGED"]==0
              assert q["Gloor_header_instances_all_exactly_two_Latin_tokens_one_underscore"]==401
              assert q["exploratory_FORMAT_conversion_collisions"]==0
              assert not q["original_author_documented_underscore_to_space_rule_VERIFIED"]
              assert q["source_format_exploratory_result_DOES_NOT_AUTHORIZE_CONFIRMATORY_GUILD_MODEL"]
              assert q["source_outcome_frozen_thresholds_NOT_WEAKENED"]
              assert q["Gloor_beetle_site_abundance_or_environment_values_READ"]==0
              assert not q["new_biodiversity_effect_estimated"]
              assert q["no_original_species_guild_pairs_or_taxon_identifiers_EXPORTED"]
          else:
              assert r["source_taxonomy_method_STOP_not_ecological_null"]
          print("CARPATHIAN116_WEISS_NAME_FORMAT_EXPLORATORY_STATUS",r["status"])
          PY
      - name: "Archive anonymous exploratory form-only coverage counts and untouched exact primary"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-carpathian116-weiss-underscore-exploratory-nameonly
          path: CARPATHIAN116_WEISS_FORMAT_SENSITIVITY/
          if-no-files-found: warn
