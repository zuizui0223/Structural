name: Global mammals historical-overlap retry v1.39
on:
  push:
    branches: [main]
    paths:
      - development/global_mammals_historical_overlap_retry_request_v1_39.json
permissions:
  contents: read
  actions: read
jobs:
  overlap-audit-retry:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate operational-only retry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("development/global_mammals_historical_overlap_retry_request_v1_39.json").read_text())
          assert r["status"]=="REQUEST_OPERATIONAL_RETRY_SAME_V137_SCIENTIFIC_CONTRACT"
          assert r["failed_run"]["workflow_run_id"]==36585590372
          assert r["failed_run"]["failed_before_overlap_script_body"] is True
          assert r["matching_rules_changed"] is False
          assert r["Appendix1_access_authorized"] is False
          assert r["one_retry_only"] is True
          PY
      - name: Prepare Dryad token
        env:
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
          DRYAD_TOKEN_FALLBACK: ${{ secrets.DRYAD_TOKEN }}
        run: |
          mkdir -p build/global_mammals_v139
          python scripts/prepare_dryad_token_v0_73.py --github-env "$GITHUB_ENV" --receipt build/global_mammals_v139/token_receipt.json
      - name: Download exact historical 318 safe design
        uses: actions/download-artifact@v4
        with:
          name: zenodo-318-island-mammals-safe-design-v0-8
          path: build/global_mammals_v139/historical
          repository: zuizui0223/Structural
          run-id: 36296726405
          github-token: ${{ github.token }}
      - name: Verify historical safe design identity
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("build/global_mammals_v139/historical/safe_island_design.csv")
          assert hashlib.sha256(p.read_bytes()).hexdigest()=="d35a583b9b5fd6b5073db11f25ec9584796ba463f19ac5498b9a41d21aa387db"
          PY
      - name: Download exact v1.31 retained partition
        uses: actions/download-artifact@v4
        with:
          name: global-mammals-v131-quarantine-79965159298b0b4eedcb4a52c926e817c54e62b2-36582701305
          path: build/global_mammals_v139/quarantine
          repository: zuizui0223/Structural
          run-id: 36582701305
          github-token: ${{ github.token }}
      - name: Execute unchanged v1.37 identity audit
        run: |
          mkdir -p build/global_mammals_v139/output
          python scripts/audit_global_mammals_historical_overlap_v1_37.py             build/global_mammals_v139/historical/safe_island_design.csv             build/global_mammals_v139/quarantine/island_partition_quarantined.csv             --identity-output build/global_mammals_v139/output/appendix2_identity.csv             --matches-output build/global_mammals_v139/output/historical_overlap_matches.csv             --retained-output build/global_mammals_v139/output/island_partition_after_historical_overlap.csv             --receipt build/global_mammals_v139/output/overlap_receipt.json
      - name: Delete raw Appendix 2 bytes
        if: always()
        run: rm -f build/global_mammals_v139/output/Appendix_2-dryad.xlsx
      - name: Enforce unchanged response ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/global_mammals_v139/output/overlap_receipt.json").read_text())
          assert x["status"]=="HISTORICAL_OVERLAP_AUDIT_COMPLETE_RESPONSE_INDEPENDENTLY"
          assert x["Appendix1_reopened"] is False
          assert x["species_headers_opened"] is False
          assert x["occurrence_values_opened"] is False
          PY
      - name: Upload overlap audit
        uses: actions/upload-artifact@v4
        with:
          name: global-mammals-v139-overlap-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/global_mammals_v139/token_receipt.json
            build/global_mammals_v139/output/appendix2_identity.csv
            build/global_mammals_v139/output/historical_overlap_matches.csv
            build/global_mammals_v139/output/island_partition_after_historical_overlap.csv
            build/global_mammals_v139/output/overlap_receipt.json
          if-no-files-found: error
          retention-days: 30
