name: Zhoushan public taxa vs frozen mammal 529 names v1.230
on:
  push:
    branches:
      - science/marine-mammal-field-intake-v1-224
    paths:
      - development/zhoushan_published_taxa_gate_v1_230.json
permissions:
  contents: read
  actions: read
jobs:
  taxon-identity-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/test_zhoushan_taxa_gate_v1_230.py
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v112-ultrarare-pilot-03c170e50de4bd21f3c9148b36905e20aecc51d6-37153960728
          path: build/v230/frozen
          repository: zuizui0223/Structural
          run-id: 37153960728
          github-token: ${{ github.token }}
      - run: |
          python scripts/compare_zhoushan_taxa_v1_230.py build/v230/frozen/ultrarare_species_universe.csv --ledger development/zhoushan_published_taxa_gate_v1_230.json --out build/v230/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v230-zhoushan-taxonomic-overlap-only
          path: build/v230/result.json
          retention-days: 21
