name: Boreal bird confirmatory scoring v1.165

on:
  push:
    branches:
      - main
    paths:
      - development/boreal_bird_confirmatory_execution_request_v1_165.json

permissions:
  contents: read

jobs:
  one-shot-confirmatory:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout frozen Structural code with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce one-shot request and committed-input hashes
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          REQUEST="development/boreal_bird_confirmatory_execution_request_v1_165.json"
          test "$(git rev-list --count HEAD -- "$REQUEST")" = "1"
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          req=json.loads(Path(
            "development/boreal_bird_confirmatory_execution_request_v1_165.json"
          ).read_text())
          assert req["schema"]=="structural.boreal_bird_confirmatory_execution_request.v1_165"
          assert req["status"]=="REQUEST_ONE_SHOT_BIRD_CONFIRMATORY_SCORING"
          assert req["candidate_id"]=="lac_la_ronge_boreal_19island_birds_2026_topology_sensitivity"
          assert req["one_shot"] is True
          assert req["rerun_authorized"] is False
          assert req["irreversible_confirmatory_open"] is True
          assert req["pilot_response_may_be_reopened"] is False
          assert req["excluded_response_may_be_opened"] is False
          assert req["nonfixed_confirmatory_species_may_be_opened"] is False
          assert req["ebird_enabled"] is False
          paths={
            "pilot_execution":"development/boreal_bird_pilot_execution_v1_163.json",
            "pilot_snapshot":"development/boreal_bird_pilot_snapshot_v1_163.json",
            "preconfirmatory_freeze":"development/boreal_bird_preconfirmatory_freeze_v1_164.json",
            "prediction_surface":"development/boreal_bird_confirmatory_predictions_v1_164.csv",
          }
          for key,path in paths.items():
              subprocess.run(["git","ls-files","--error-unmatch",path],check=True,stdout=subprocess.DEVNULL)
              sha=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              assert req["committed_input_sha256"][key]==sha,(key,sha)
          pre=json.loads(Path(paths["preconfirmatory_freeze"]).read_text())
          assert pre["status"]=="BIRD_ACTUAL_AND_NULL_PREDICTIONS_FROZEN_BEFORE_CONFIRMATORY_RESPONSE"
          assert pre["bird_confirmatory_values_opened"]==0
          assert pre["bird_confirmatory_response_authorized"] is False
          pilot=json.loads(Path(paths["pilot_execution"]).read_text())
          assert pilot["status"]=="BIRD_PILOT_GATE_PASSED_FREEZE_MODELS_AND_PREDICTIONS_ONLY"
          assert pilot["bird_confirmatory_response_opened"] is False
          PY

      - name: Prepare short-lived Dryad bearer token
        env:
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
          DRYAD_TOKEN_FALLBACK: ${{ secrets.DRYAD_TOKEN }}
        run: |
          mkdir -p build/boreal_bird_v165
          python scripts/prepare_dryad_token_v0_73.py \
            --github-env "$GITHUB_ENV" \
            --receipt build/boreal_bird_v165/token_receipt.json

      - name: Transport exact bird bytes without semantic opening
        run: |
          mkdir -p build/boreal_bird_v165/raw
          python scripts/fetch_boreal_bird_response_v1_163.py \
            build/boreal_bird_v165/raw/borealbirds_speciesmatrix_presenceabsence.csv \
            --receipt build/boreal_bird_v165/transport_receipt.json

      - name: Score frozen confirmatory primary exactly once
        id: score
        run: |
          set +e
          python scripts/score_boreal_bird_confirmatory_v1_165.py \
            build/boreal_bird_v165/raw/borealbirds_speciesmatrix_presenceabsence.csv \
            development/boreal_bird_confirmatory_predictions_v1_164.csv \
            development/boreal_bird_preconfirmatory_freeze_v1_164.json \
            development/boreal_bird_pilot_snapshot_v1_163.json \
            --result build/boreal_bird_v165/confirmatory_result.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Delete raw response bytes before artifact handling
        if: always()
        run: |
          rm -rf build/boreal_bird_v165/raw

      - name: Assert raw response is absent
        if: always()
        run: |
          test ! -d build/boreal_bird_v165/raw

      - name: Upload result-only audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boreal-bird-v165-confirmatory-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/boreal_bird_v165/token_receipt.json
            build/boreal_bird_v165/transport_receipt.json
            build/boreal_bird_v165/confirmatory_result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail only on scoring-system failure
        if: always()
        env:
          SCORE_EXIT_CODE: ${{ steps.score.outputs.exit_code }}
        run: |
          test "$SCORE_EXIT_CODE" = "0"
