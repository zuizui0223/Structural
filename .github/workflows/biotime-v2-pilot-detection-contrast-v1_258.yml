name: BioTIME pilot new-versus-continuing detection audit v1.258

on:
  push:
    paths:
      - ".github/workflows/biotime-v2-pilot-detection-contrast-v1_258.yml"
      - "development/biotime_v2_pilot_detection_continuity_contrast_v1_258.json"
      - "tests/test_biotime_v2_pilot_detection_contrast_v1_258.py"
      - "development/biotime_v2_burned_pilot_by_study_source_group_v1_252.csv"
  pull_request:
    paths:
      - ".github/workflows/biotime-v2-pilot-detection-contrast-v1_258.yml"
      - "tests/test_biotime_v2_pilot_detection_contrast_v1_258.py"
      - "development/biotime_v2_pilot_detection_continuity_contrast_v1_258.json"

permissions:
  contents: read

jobs:
  frozen-aggregate-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-free test dependency
        run: python -m pip install pytest
      - name: Verify original counts, two detection endpoints, and holdout firewall
        run: python -m pytest -q tests/test_biotime_v2_pilot_detection_contrast_v1_258.py
