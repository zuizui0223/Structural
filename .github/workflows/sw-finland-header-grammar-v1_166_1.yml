name: SW Finland header grammar diagnostic v1.166.1

on:
  push:
    branches:
      - main
    paths:
      - development/sw_finland_header_grammar_diagnostic_request_v1_166_1.json

permissions:
  contents: write

jobs:
  header-grammar-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate zero-row diagnostic request
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("development/sw_finland_header_grammar_diagnostic_request_v1_166_1.json").read_text())
          assert r["status"]=="REQUEST_ZERO_ROW_HEADER_GRAMMAR_DIAGNOSTIC"
          assert r["prior_data_rows_opened"]==0
          assert r["prior_outcome_values_read"]==0
          assert r["future_outcome_access"] is False
          assert r["eBird_used"] is False
          PY
      - name: Download exact archive bytes
        run: |
          mkdir -p build/swf_grammar/raw build/swf_grammar/out
          python - <<'PY'
          import hashlib,urllib.request
          from pathlib import Path
          url="https://zenodo.org/records/4942881/files/colonization_select.csv?download=1"
          expected="ff648878946ba430fb86c4ab2aa02baa"
          out=Path("build/swf_grammar/raw/colonization_select.csv")
          h=hashlib.md5()
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Structural-v1.166.1"}),timeout=180) as src,out.open("wb") as dst:
            while True:
              b=src.read(1024*1024)
              if not b: break
              dst.write(b);h.update(b)
          if h.hexdigest()!=expected: raise SystemExit("MD5 mismatch")
          PY
      - name: Diagnose header grammar only
        run: |
          python scripts/audit_sw_finland_header_grammar_v1_166_1.py \
            build/swf_grammar/raw/colonization_select.csv \
            --receipt build/swf_grammar/out/sw_finland_header_grammar_receipt.json
      - name: Delete raw archive
        if: always()
        run: rm -rf build/swf_grammar/raw
      - name: Persist response-free grammar receipt
        run: |
          test ! -e build/swf_grammar/raw
          cp build/swf_grammar/out/sw_finland_header_grammar_receipt.json development/sw_finland_header_grammar_receipt_v1_166_1.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("development/sw_finland_header_grammar_receipt_v1_166_1.json").read_text())
          assert x["status"]=="HEADER_GRAMMAR_UNIQUELY_IDENTIFIED"
          assert x["data_rows_semantically_opened"]==0
          assert x["outcome_values_read"]==0
          assert x["t0_projection_authorized"] is False
          PY
          git add development/sw_finland_header_grammar_receipt_v1_166_1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Freeze SW Finland header grammar v1.166.1"
          git push origin HEAD:main
