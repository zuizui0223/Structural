name: Response-opaque global mammal heldout geography index v1.235
on:
  push:
    branches:
      - science/heldout-geographic-search-index-v1-235
    paths:
      - development/mammal_heldout_geographic_search_index_v1_235.json
permissions:
  contents: read
  actions: read
jobs:
  geographic-index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests of coordinate encoding, safe IDs and fixed tiles
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_mammal_heldout_geographic_index_v1_235.py
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v123-appendix2-safe-ea565b98419f8aacde9fb13c26724bb385635b95-36524988694
          path: build/v235/geometry
          repository: zuizui0223/Structural
          run-id: 36524988694
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v143-reference-fe0e65be12a223fb3f0991afae959cd62ef3aabb-36622553042
          path: build/v235/selected
          repository: zuizui0223/Structural
          run-id: 36622553042
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v152-pilot-routing-f5ae81b05aac3ce4c5db6f43ce41e89c1d14548c-36625810600
          path: build/v235/heldout
          repository: zuizui0223/Structural
          run-id: 36625810600
          github-token: ${{ github.token }}
      - name: Count all 4,126 original heldout islands and spatial blocks in fixed global grid
        run: |
          python scripts/index_original_mammal_heldout_geography_v1_235.py build/v235/geometry/appendix2_safe_rows.csv build/v235/selected/state_reference.csv build/v235/heldout/confirmatory_ids.csv --out build/v235/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v235-original-4126-heldout-geography-index
          path: build/v235/result.json
          retention-days: 21
