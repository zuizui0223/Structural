name: NRMN marine island Method1 physical feasibility v1.261

on:
  push:
    paths:
      - ".github/workflows/nrmn-marine-island-method1-v1_261.yml"
      - "development/nrmn_marine_island_gshhg_protocol_v1_261.json"
      - "scripts/nrmn_marine_island_geometry_v1_261.py"
      - "tests/test_nrmn_marine_island_geometry_v1_261.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey-geometry-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-free geometry test and official parquet dependencies
        run: python -m pip install pytest 'pyarrow>=18,<24' 'shapely>=2,<3' 'pyproj>=3,<4' 'pyshp>=2,<3'
      - name: First require synthetic Method1, survey ID and two-island geography tests
        run: python -m pytest -q tests/test_nrmn_marine_island_geometry_v1_261.py
      - name: Enumerate ONLY official NRMN survey event geography; verify original tagged GSHHG
        run: |
          python scripts/nrmn_marine_island_geometry_v1_261.py \
            --contract development/nrmn_marine_island_gshhg_protocol_v1_261.json \
            --summary-out nrmn_marine_island_feasibility_v1_261.json \
            --groups-out nrmn_marine_island_group_summaries_v1_261.csv
      - name: Require 20 prospectively selected source groups and zero fish reads
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          report=json.loads(Path("nrmn_marine_island_feasibility_v1_261.json").read_text())
          assert report["schema"]=="structural.nrmn_marine_island_feasibility.v1_261"
          assert report["status"]=="ORIGINAL_SURVEY_METADATA_ONLY_GIS_MATCHED"
          assert report["group_count"]==20
          assert report["biological_fish_response_rows_opened"]==0
          assert report["GEB_scientific_HOLD"]
          assert report["GSHHG_source_sha256"]=="8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41"
          with open("nrmn_marine_island_group_summaries_v1_261.csv",newline="") as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==20 and len({(r["program"],r["country"],r["area"],r["location"]) for r in rows})==20
          assert not any("species" in k.lower() or "abundance" in k.lower() or "site_code" in k.lower() or "survey_id" in k.lower() for k in rows[0])
          print("SURVEY-ONLY MARINE ISLAND NETWORKS:",report["qualified_multi_island_reef_networks"])
          PY
      - name: Retain only GIS source fingerprint and region-level physical counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nrmn-marine-island-Method1-source-only-v1-261
          path: |
            nrmn_marine_island_feasibility_v1_261.json
            nrmn_marine_island_group_summaries_v1_261.csv
          if-no-files-found: warn
