name: "Forest macro England NFI2026 original Trap_type code dictionary only"
on:
  push:
    branches:
      - analysis/forest-macro-plot-environment
    paths:
      - "analysis/forest_macro_global/england_nfi2026_trap_type_author_dictionary_only.py"
      - "docs/FOREST_NFI_ENGLAND_2026_TRAP_TYPE_AUTHOR_CODES_METADATA_ONLY_PRESPEC_20261119.md"
      - ".github/workflows/forest-macro-england-nfi2026-trap-type-author-dictionary-only.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact_author_label_only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "Synthetic trap-author field categorical dictionary and OTU seal"
        run: |
          python analysis/forest_macro_global/england_nfi2026_trap_type_author_dictionary_only.py --test
      - name: "One original SHA-locked official Trap_type categorical source field audit"
        run: |
          python analysis/forest_macro_global/england_nfi2026_trap_type_author_dictionary_only.py --out NFI2026_SOURCE_TRAP_TYPE_CODES
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("NFI2026_SOURCE_TRAP_TYPE_CODES/NFI2026_Trap_type_source_field_dictionary_only.json")
          x=json.loads(p.read_text())
          assert x["source_original_328col_OTU_species_rows_READ"]==0
          assert x["no_earlier_Finland_Carpathian_PREDICTS_Thai_NEON_BALA_GEB_scores_REOPENED"]
          assert x["no_original_site_or_sample_IDs_exposed"]
          assert not x["eBird_used"] and not x["TinyFish_used"]
          if "original_author_Trap_type_field_category_result" in x:
              d=x["original_author_Trap_type_field_category_result"]
              assert d["source_328col_OTU_OR_species_response_rows_READ"]==0
              assert d["site_year_pair_count_RESCORED"] is False
              assert d["source_category_code_not_method_or_layer_reinterpreted"]
              assert d["source_other_original_23_field_values_NOT_SEMANTICALLY_USED"]
              if d["status"]=="SOURCE_NFI2026_TRAP_TYPE_CATEGORICAL_DICTIONARY_ONLY_PASS":
                  assert sum(d["source_original_Trap_type_lexical_categories_counts"].values())==331
                  assert d["previous_frozen_literal_Trap_type_classifier"]["Other"]==166
          else:
              assert x["new_source_method_category_dictionary_NOT_VALIDATED"]
          print("NFI_AUTHOR_ORIGINAL_TRAP_TYPE_ONLY",x["status"])
          PY
      - name: "Archive original author category codes and counts, no biological or site values"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-england-nfi2026-trap-type-author-codes-only
          path: NFI2026_SOURCE_TRAP_TYPE_CODES/
          if-no-files-found: warn
