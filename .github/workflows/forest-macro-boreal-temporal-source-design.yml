name: "Forest macro northern source design consumed — synthetic only"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/forest-macro-boreal-temporal-source-design.yml"
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install openpyxl==3.1.5
      - run: python analysis/forest_macro_global/boreal_temporal_independent_source_design.py --test
