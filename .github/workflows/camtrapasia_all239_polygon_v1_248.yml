name: CamTrapAsia all 239 study centers on pinned GADM 3.6 source polygons v1.248
on:
  push:
    branches: [science/heldout-geographic-search-index-v1-235]
    paths:
      - development/camtrapasia_full239_polygon_identity_contract_v1_248.json
permissions:
  contents: read
  actions: read
jobs:
  all239-geography-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install pytest shapely pyproj
          python -m pytest -q tests/test_camtrapasia_full239_polygon_v1_248.py
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v123-appendix2-safe-ea565b98419f8aacde9fb13c26724bb385635b95-36524988694
          path: build/v248/geo
          repository: zuizui0223/Structural
          run-id: 36524988694
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: global-mammals-v152-pilot-routing-f5ae81b05aac3ce4c5db6f43ce41e89c1d14548c-36625810600
          path: build/v248/heldout
          repository: zuizui0223/Structural
          run-id: 36625810600
          github-token: ${{ github.token }}
      - name: Match ALL 239 centers to frozen island land polygons and island areas
        run: |
          python scripts/camtrapasia_all239_polygon_v1_248.py build/v248/geo/appendix2_safe_rows.csv build/v248/heldout/confirmatory_ids.csv --out build/v248/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v248-all239-response-safe-source-land-candidates
          path: build/v248/result.json
          retention-days: 21
