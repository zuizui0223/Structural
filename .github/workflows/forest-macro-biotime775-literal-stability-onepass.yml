name: "Forest BioTIME775 consumed literal group stability — synthetic only"
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/forest-macro-biotime775-literal-stability-onepass.yml"
      - "analysis/forest_macro_global/biotime775_literal_group_stability_onepass.py"
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python analysis/forest_macro_global/biotime775_literal_group_stability_onepass.py --test
