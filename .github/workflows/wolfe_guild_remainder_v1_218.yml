name: Wolfe six-patch guild marginal and association v1.218
on:
  push:
    branches: [analysis/wolfe-joint-predator-v1-209]
    paths:
      - scripts/wolfe_guild_remainder_v1_218.py
      - tests/test_wolfe_guild_remainder_v1_218.py
      - development/wolfe_guild_remainder_contract_v1_218.json
      - .github/workflows/wolfe_guild_remainder_v1_218.yml
permissions:
  contents: read
jobs:
  source-locked-posthoc-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_wolfe_guild_remainder_v1_218.py
      - uses: actions/checkout@v4
        with:
          repository: ExperimentalConservation/Experimental-data
          ref: fabe50b58a13651be4168b91cd91589ccc261a96
          path: build/author_source
          persist-credentials: false
      - name: Replay exact source and enforce v1.217 endpoint limits
        run: |
          python scripts/wolfe_guild_remainder_v1_218.py "build/author_source/Wolfe et al. /Wolfe et al experimental data.csv" --out build/wolfe_v218/result.json
          python - <<'PY'
          import json
          r=json.load(open("build/wolfe_v218/result.json"))
          o=r["observed_source_microcosms"]
          assert (o["heterogeneous_low"]["G_present"],o["heterogeneous_low"]["S_present"],o["heterogeneous_low"]["both_present"])==(7,5,4)
          assert (o["heterogeneous_high"]["G_present"],o["heterogeneous_high"]["S_present"],o["heterogeneous_high"]["both_present"])==(2,6,0)
          a=r["six_heterogeneous_low_minus_high_corridor"]
          expected={"G":[1/3,5/12],"S":[-1/6,-1/12],"J":[1/4,1/3],
                    "marginal_product":[1/6,5/24],"association_remainder":[1/12,7/48]}
          for k,vals in expected.items():
              assert all(abs(x-y)<1e-12 for x,y in zip(a[k],vals)),(k,a[k],vals)
          assert r["joint_missing_state_completions"]==16
          print("source-locked guild decomposition: PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wolfe-v218-posthoc-guild-remainder
          path: build/wolfe_v218/result.json
          retention-days: 21
