name: Independent CamTrapAsia field-source metadata preflight v1.236
on:
  push:
    branches:
      - science/heldout-geographic-search-index-v1-235
    paths:
      - development/camtrapasia_public_source_contract_v1_236.json
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic source-checksum tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_zenodo_camtrapasia_metadata_v1_236.py
      - name: Verify public Zenodo record and exact three input file checksums
        run: |
          python scripts/zenodo_camtrapasia_metadata_v1_236.py --out build/v236/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-v236-camtrapasia-metadata-only
          path: build/v236/receipt.json
          retention-days: 21
