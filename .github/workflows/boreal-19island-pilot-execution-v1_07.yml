name: Boreal 19-island burned pilot v1.07

on:
  push:
    branches:
      - main
    paths:
      - development/boreal_19island_pilot_execution_request_v1_07.json

permissions:
  contents: read

jobs:
  one-shot-burned-pilot:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - name: Checkout frozen Structural code with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce one-shot non-rerunnable request
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          REQUEST="development/boreal_19island_pilot_execution_request_v1_07.json"
          test "$(git rev-list --count HEAD -- "$REQUEST")" = "1"
          python - <<'PY'
          import json
          from pathlib import Path

          req = json.loads(
              Path(
                  "development/boreal_19island_pilot_execution_request_v1_07.json"
              ).read_text(encoding="utf-8")
          )
          assert req["schema"] == (
              "structural.boreal_19island_pilot_execution_request.v1_07"
          )
          assert req["status"] == "REQUEST_ONE_SHOT_BURNED_PILOT_EXECUTION"
          assert req["candidate_id"] == (
              "lac_la_ronge_boreal_19island_beetles_2026"
          )
          assert req["authorization_fingerprint"] == (
              "2942d3d76d118bcf04c71d721d8f37f5531abb964713828dc375f610d08fab97"
          )
          assert req["irreversible_semantic_pilot_open"] is True
          assert req["pilot_is_feasibility_only"] is True
          assert req["confirmatory_response_may_be_opened"] is False
          assert req["raw_response_may_be_uploaded"] is False
          assert req["counts_as_empirical_evidence"] is False
          assert req["one_shot"] is True
          PY

      - name: Regenerate exact frozen pilot authorization
        run: |
          mkdir -p build/boreal_v107
          python scripts/authorize_boreal_19island_pilot_response_v1_05.py \
            --output build/boreal_v107/pilot_authorization.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          freeze = json.loads(
              Path(
                  "development/boreal_19island_pilot_authorization_freeze_v1_06.json"
              ).read_text(encoding="utf-8")
          )
          path = Path("build/boreal_v107/pilot_authorization.json")
          raw = path.read_bytes()
          auth = json.loads(raw)
          expected = freeze["authorization"]
          assert hashlib.sha256(raw).hexdigest() == (
              expected["authorization_json_sha256"]
          )
          assert auth["authorization_fingerprint"] == (
              expected["authorization_fingerprint"]
          )
          assert auth["authorization_consumed"] is False
          assert auth["response_values_opened_by_authorization"] is False
          PY

      - name: Prepare short-lived Dryad bearer token
        env:
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
          DRYAD_TOKEN_FALLBACK: ${{ secrets.DRYAD_TOKEN }}
        run: |
          python scripts/prepare_dryad_token_v0_73.py \
            --github-env "$GITHUB_ENV" \
            --receipt build/boreal_v107/token_receipt.json

      - name: Transport exact response bytes without semantic opening
        run: |
          mkdir -p build/boreal_v107/raw
          python scripts/fetch_boreal_19island_beetle_response_v1_07.py \
            build/boreal_v107/pilot_authorization.json \
            build/boreal_v107/raw/beetles_speciesmatrix_presenceabsence.csv \
            --receipt build/boreal_v107/transport_receipt.json

      - name: Consume burned pilot exactly once
        id: pilot
        run: |
          set +e
          python scripts/run_boreal_19island_pilot_v1_07.py \
            build/boreal_v107/pilot_authorization.json \
            build/boreal_v107/raw/beetles_speciesmatrix_presenceabsence.csv \
            --execution-receipt build/boreal_v107/execution_receipt.json \
            --training-snapshot build/boreal_v107/training_snapshot.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Delete raw response bytes before artifact handling
        if: always()
        run: |
          rm -rf build/boreal_v107/raw
          rm -f build/boreal_v107/pilot_authorization.json

      - name: Assert raw response is absent
        if: always()
        run: |
          test ! -d build/boreal_v107/raw
          test ! -f build/boreal_v107/pilot_authorization.json

      - name: Upload consumed pilot audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boreal-v107-burned-pilot-${{ github.sha }}-${{ github.run_id }}
          path: |
            build/boreal_v107/token_receipt.json
            build/boreal_v107/transport_receipt.json
            build/boreal_v107/execution_receipt.json
            build/boreal_v107/training_snapshot.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if pilot gate did not qualify
        if: always()
        env:
          PILOT_EXIT_CODE: ${{ steps.pilot.outputs.exit_code }}
        run: |
          test "$PILOT_EXIT_CODE" = "0"
