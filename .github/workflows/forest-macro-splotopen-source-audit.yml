name: Forest island bridge sPlotOpen global field forest structure cohort audit
on:
  push:
    paths:
      - ".github/workflows/forest-macro-splotopen-source-audit.yml"
      - "analysis/forest_macro_global/audit_splotopen_forest_cohort.py"
      - "analysis/forest_macro_global/test_audit_splotopen_forest_cohort.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global_original_plot_metadata_quality:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit test no response-conditioned forest selection and no coordinates exported
        run: |
          python -m pip install pytest
          python -m pytest -q analysis/forest_macro_global/test_audit_splotopen_forest_cohort.py
      - name: Acquire independently hosted public sPlotOpen v76 CSV transform
        run: |
          mkdir -p original_derived_archive
          curl --fail --location --retry 2 --retry-delay 5 \
            --connect-timeout 20 --max-time 520 \
            "https://networks.skewed.de/net/splotopen/files/splotopen.csv.zip" \
            --output original_derived_archive/splotopen_v76_derived.csv.zip
          python - <<'PY'
          import zipfile
          p="original_derived_archive/splotopen_v76_derived.csv.zip"
          assert zipfile.is_zipfile(p), "Downloaded sPlotOpen CSV transform is not ZIP"
          with zipfile.ZipFile(p) as z:
              n=z.namelist()
              print("Network transform members:",n)
              assert any(s.endswith("nodes.csv") for s in n)
          PY
      - name: Audit distinct physical forest plot metadata before opening species edges
        run: |
          python analysis/forest_macro_global/audit_splotopen_forest_cohort.py \
            --archive original_derived_archive/splotopen_v76_derived.csv.zip \
            --out splot_forest_site_support
      - name: Fail closed on invalid denominator, pseudo-replication or species-derived selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("splot_forest_site_support/splotopen_forest_source_meta_manifest.json")
          q=json.loads(p.read_text())
          assert q["schema"]=="structural.global_forest_splotopen_v76_metadata_audit.v1"
          assert q["plot_nodes_unduplicated"]>10000
          assert q["source_contributor_forest_plots"]>1000
          assert q["forest_source_datasets"]>1
          assert q["species_growth_form_selection_leakage_avoided"] is True
          assert q["original_taxon_edges_read"]==0
          assert q["2020_satellite_canopy_used_on_historic_plots"] is False
          assert q["independent_forest_regions_verified"]==0
          assert q["new_biological_effects_computed"] is False
          assert q["no_raw_locations_or_site_ids_exported"]
          assert not q["eBird_used"]
          PY
      - name: Archive only aggregate forest biome support and cohort manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-macro-splotopen-global-original-field-structure-support
          path: splot_forest_site_support/
          if-no-files-found: warn
